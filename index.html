// 一棵丛林树：树干 + 三团树冠 + 底部根须
function drawTree(x, baseY, s, canopy, trunk){
  ctx.fillStyle = trunk;
  ctx.fillRect(x-4*s, baseY-92*s, 8*s, 92*s);                       // 树干
  ctx.beginPath();                                                  // 根须
  ctx.moveTo(x-4*s, baseY-36*s); ctx.lineTo(x-13*s, baseY); ctx.lineTo(x-1*s, baseY); ctx.closePath(); ctx.fill();
  ctx.fillStyle = canopy;
  ctx.beginPath();                                                  // 层叠树冠
  ctx.arc(x,        baseY-100*s, 32*s, 0, 7);
  ctx.arc(x-26*s,   baseY-78*s,  22*s, 0, 7);
  ctx.arc(x+26*s,   baseY-78*s,  22*s, 0, 7);
  ctx.arc(x+8*s,    baseY-62*s,  18*s, 0, 7);
  ctx.fill();
}

  for(const cv of conveyors){

    for(let bx=-26; bx<cv.w+26; bx+=26){
      let px = x + bx + off;
      if(px > x-8 && px < x+cv.w) ctx.fillRect(px, y-3, 11, 5);

    const ax = x + cv.w/2, ay = y + 6, d = cv.dir;
    ctx.fillStyle = cv.dir>0 ? "#ffd34d" : "#ff8a3d";
    ctx.beginPath();
    ctx.moveTo(ax - 26*d, ay-4); ctx.lineTo(ax - 14*d, ay-4); ctx.lineTo(ax - 14*d, ay-8);
    ctx.lineTo(ax - 4*d, ay);    ctx.lineTo(ax - 14*d, ay+8); ctx.lineTo(ax - 14*d, ay+4);
    ctx.lineTo(ax - 26*d, ay+4);
    ctx.closePath(); ctx.fill();
    // 两端滚筒
    for(const rx of [x+3, x+cv.w-3]){
      ctx.fillStyle = "#55636f";
      ctx.beginPath(); ctx.arc(rx, y+1, 7, 0, 7); ctx.fill();
      ctx.fillStyle = "#2a323a";
      ctx.beginPath(); ctx.arc(rx, y+1, 3, 0, 7); ctx.fill();
    }
    // 侧护栏
    ctx.fillStyle = "#39434f";
    ctx.fillRect(x, y+3, 3, 8); ctx.fillRect(x+cv.w-3, y+3, 3, 8);
  }
}
function drawTerrain2(){
  // 第二~八关：同一种"金属/装甲地板"结构，配色由关卡主题决定
  const P = themePal();
  const cDk0 = P.dk0, cDk1 = P.dk1;
  const cFloor = P.floor;
  const cBeam = P.beam;
  const cTop  = P.top;
  const cWarn = P.warn;
  const cRivet= P.rivet;
  const cEdge = P.edge;
  const cPlatBody = P.platBody;
  const cPlatTop  = P.platTop;
  const cPlatBot  = P.platBot;

  // 地面下方的机房暗层（有蒸汽与管线，不再是熔岩深坑）
  const dk = ctx.createLinearGradient(0,420,0,H);
  dk.addColorStop(0,cDk0); dk.addColorStop(1,cDk1);
  ctx.fillStyle = dk; ctx.fillRect(0, 420, W, H-420);
  for(let i=0;i<10;i++){
    const bx = ((i*150 - cam*0.35) % 1500 + 1500) % 1500 - 100;
    ctx.fillStyle = P.beam; ctx.fillRect(bx, 505, 120, 10);
    ctx.fillStyle = P.wall1; ctx.fillRect(bx+16, 470, 8, 45);
  }
  // 地板：金属平台（顶面高光 + 铆钉 + 承重梁）
  for(const pc of terrainPieces){
    const pts = pc.pts;
    if(pts[pts.length-1][0] < cam-20 || pts[0][0] > cam+W+20) continue;
    ctx.fillStyle=cFloor;
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]-cam, pts[i][1]);
    ctx.lineTo(pts[pts.length-1][0]-cam, H+20);
    ctx.lineTo(pts[0][0]-cam, H+20);
    ctx.closePath(); ctx.fill();
    // 承重梁纹理
    ctx.fillStyle=cBeam;
    for(let i=0;i<pts.length-1;i++){
      const [ax,ay]=pts[i], [bx2,by]=pts[i+1];
      const steps = Math.max(1, Math.floor((bx2-ax)/64));
      for(let s=0;s<steps;s++){
        const t=(s+0.5)/steps, tx=ax+(bx2-ax)*t, ty=ay+(by-ay)*t;
        ctx.fillRect(tx-cam-3, ty+26, 6, H-ty);
      }
    }
    // 顶面钢板高光
    ctx.strokeStyle=cTop; ctx.lineWidth=5; ctx.lineCap="butt";
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]-cam, pts[i][1]);
    ctx.stroke();
    // 警示黄条（地板边缘）
    ctx.strokeStyle=cWarn; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]+7);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]-cam, pts[i][1]+7);
    ctx.stroke();
    // 铆钉
    ctx.fillStyle=cRivet;
    for(let i=0;i<pts.length-1;i++){
      const [ax,ay]=pts[i], [bx2,by]=pts[i+1];
      const step=(bx2-ax);
      const steps = Math.max(1, Math.floor(step/56));
      for(let s=0;s<=steps;s++){
        const t=s/steps, tx=ax+(bx2-ax)*t, ty=ay+(by-ay)*t;
        ctx.fillRect(tx-cam-1, ty+3, 3, 3);
      }
    }
    // 断口（深坑）侧壁发光
    ctx.strokeStyle=cEdge; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]); ctx.lineTo(pts[0][0]-cam, H+20);
    ctx.moveTo(pts[pts.length-1][0]-cam, pts[pts.length-1][1]); ctx.lineTo(pts[pts.length-1][0]-cam, H+20);
    ctx.stroke();
  }
  // 平台（钢制栈桥：格栅 + 侧梁 + 警示边；第三关会被碎片砸出裂缝并断裂）
  for(const pl of platforms){
    if(pl.dead || pl.x+pl.w<cam || pl.x>cam+W) continue;
    const cracking = pl.crackT > 0;
    const shk = cracking ? Math.sin(perfNow/26)*2.4 : 0;
    const px = pl.x - cam + shk, py = pl.y + (cracking ? Math.sin(perfNow/19)*0.9 : 0);
    ctx.fillStyle=cPlatBody; ctx.fillRect(px, py, pl.w, pl.h);
    ctx.fillStyle=cPlatTop; ctx.fillRect(px, py, pl.w, 4);
    ctx.fillStyle=cPlatBot; ctx.fillRect(px, py+pl.h-4, pl.w, 4);
    // 格栅
    ctx.strokeStyle=P.beam; ctx.lineWidth=2;
    for(let gx=pl.x+8; gx<pl.x+pl.w-6; gx+=16){
      ctx.beginPath(); ctx.moveTo(gx-cam+shk, py+4); ctx.lineTo(gx-cam+shk, py+pl.h-4); ctx.stroke();
    }
    // 两端吊索
    ctx.strokeStyle=P.top; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px+6, py); ctx.lineTo(px+6, py-14);
    ctx.moveTo(px+pl.w-6, py); ctx.lineTo(px+pl.w-6, py-14); ctx.stroke();
    if(cracking){
      // 裂缝（沿桥面撕开）+ 红色闪烁警示
      ctx.strokeStyle="#0a0d10"; ctx.lineWidth=2.4;
      ctx.beginPath();
      for(let k=0;k<4;k++){
        const bx = px + pl.w*(0.18 + k*0.22);
        ctx.moveTo(bx, py+1);
        ctx.lineTo(bx+6, py+pl.h*0.55);
        ctx.lineTo(bx-4, py+pl.h-1);
      }
      ctx.stroke();
      ctx.globalAlpha = .25 + .35*Math.abs(Math.sin(perfNow/90));
      ctx.fillStyle="#ff2f14";
      ctx.fillRect(px, py, pl.w, pl.h);
      ctx.globalAlpha = 1;
      // 剩余时间提示（2 秒倒计时的小刻度条）
      const k2 = 1 - pl.crackT/120;
      ctx.fillStyle="#ff5b3d"; ctx.fillRect(px+6, py-7, Math.max(0, (pl.w-12)*(1-k2)), 3);
    }
  }
  // 传送带（画在地板之上、箱子之下）
  drawConveyors();
}
function drawTerrain(){
  if(LEVEL_IDX >= 2) return drawTerrain2();
  // 悬崖水潭（水面横贯，被地形多边形覆盖后只在断口露出）
  ctx.fillStyle="#123a55";
  ctx.fillRect(cam-20, 495, W+40, H-495+20);
  ctx.fillStyle="#2a6b8f";
  for(let wv=Math.floor((cam-20)/26)*26; wv<cam+W+40; wv+=26){
    ctx.fillRect(wv-cam + ((perfNow/200)%26), 495, 12, 4);
  }
  // 起伏地面：沿地形折线绘制多边形 + 坡面草皮
  for(const pc of terrainPieces){
    const pts = pc.pts;
    if(pts[pts.length-1][0] < cam-20 || pts[0][0] > cam+W+20) continue;
    ctx.fillStyle="#2d4a2f";
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]-cam, pts[i][1]);
    ctx.lineTo(pts[pts.length-1][0]-cam, H+20);
    ctx.lineTo(pts[0][0]-cam, H+20);
    ctx.closePath(); ctx.fill();
    // 泥土纹理
    ctx.fillStyle="#233b24";
    for(let i=0;i<pts.length-1;i++){
      const [ax,ay]=pts[i], [bx2,by]=pts[i+1];
      const steps = Math.max(1, Math.floor((bx2-ax)/48));
      for(let s=0;s<steps;s++){
        const t=(s+0.5)/steps, tx=ax+(bx2-ax)*t, ty=ay+(by-ay)*t;
        ctx.fillRect(tx-cam-10, ty+22+((tx*7)%3)*12, 20, 6);
      }
    }
    // 草皮（沿坡面）
    ctx.strokeStyle="#4a7a3d"; ctx.lineWidth=9; ctx.lineCap="butt";
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]-cam, pts[i][1]);
    ctx.stroke();
    // 悬崖边缘描边（断口感）
    ctx.strokeStyle="#1c2f1d"; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]); ctx.lineTo(pts[0][0]-cam, H+20);
    ctx.moveTo(pts[pts.length-1][0]-cam, pts[pts.length-1][1]); ctx.lineTo(pts[pts.length-1][0]-cam, H+20);
    ctx.stroke();
  }
  // 平台
  for(const pl of platforms){
    if(pl.x+pl.w<cam || pl.x>cam+W) continue;
    ctx.fillStyle="#5b4630"; ctx.fillRect(pl.x-cam, pl.y, pl.w, pl.h);
    ctx.fillStyle="#7d5f3f"; ctx.fillRect(pl.x-cam, pl.y, pl.w, 5);
    ctx.fillStyle="#3e2f1f"; ctx.fillRect(pl.x-cam, pl.y+pl.h-4, pl.w, 4);
  }
}
// 红色液体：从反应堆渗出来的粘稠血红色液体（碰到即死）
function drawRedPools(){
  for(const pool of redPools){
    const x = pool.x - cam, y = pool.y, w = pool.w, h = pool.h;
    if(x + w < -60 || x > W + 60) continue;
    // 蒸发红光
    ctx.globalAlpha = .16 + .06*Math.sin(perfNow/240);
    ctx.fillStyle = "#ff1a1a";
    ctx.beginPath(); ctx.ellipse(x+w/2, y+h*0.4, w*0.6, h*2.4, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    // 液面主体（上亮下暗）
    const g = ctx.createLinearGradient(0, y, 0, y+h+8);
    g.addColorStop(0, "#d01820"); g.addColorStop(.55, "#8a0a12"); g.addColorStop(1, "#3d0004");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, y+h);
    ctx.lineTo(x, y+3);
    for(let sx = 0; sx < w; sx += 18){
      ctx.lineTo(x+sx, y+1 + Math.sin((perfNow/260) + sx*0.05)*1.6);
    }
    ctx.lineTo(x+w, y+3); ctx.lineTo(x+w, y+h);
    ctx.closePath(); ctx.fill();
    // 表面高光波纹
    ctx.fillStyle = "rgba(255,120,120,.45)";
    for(let sx = 0; sx < w-10; sx += 26){
      const off = Math.sin((perfNow/300) + sx*0.07)*3;
      ctx.fillRect(x+sx+off, y+2, 11, 2);
    }
    // 冒泡
    for(let k=0;k<3;k++){
      const bt = (perfNow/9 + k*30) % 46;
      const bx = x + ((k*97 + Math.floor(perfNow/60)*13) % Math.max(1, w-8));
      ctx.globalAlpha = Math.max(0, .55 - bt*0.012);
      ctx.fillStyle = "#ff6a6a";
      ctx.beginPath(); ctx.arc(bx, y+4 - bt*0.12, 2.2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
// 第三关：被碎片砸裂 / 砸穿的地板
function drawHoles(){
  for(const hl of holes){
    const x = hl.x - cam;
    if(x + hl.w < -60 || x > W + 60) continue;
    if(hl.crackT > 0){
      // 裂缝预警（红色闪烁 + 抖动），还没塌
      const jit = Math.sin(perfNow/40 + hl.seed)*1.6;
      ctx.save();
      ctx.globalAlpha = .30 + .55*Math.abs(Math.sin(perfNow/70 + hl.seed));
      ctx.strokeStyle = "#ff3b2f"; ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const sx = x + 6 + i*(hl.w-12)/4;
        ctx.moveTo(sx + jit, hl.y - 1);
        ctx.lineTo(sx + Math.sin(i*2.1 + hl.seed)*11 + jit, hl.y + 26 + (i%2)*8);
      }
      ctx.moveTo(x + hl.w*0.2 + jit, hl.y + 8); ctx.lineTo(x + hl.w*0.8 + jit, hl.y + 14);
      ctx.stroke();
      ctx.globalAlpha = .45; ctx.fillStyle = "#ffb347";
      ctx.fillRect(x + hl.w/2 - 3 + jit, hl.y - 8, 6, 6);
      ctx.restore();
      continue;
    }
    // 已塌：黑洞 + 崩塌的断口
    const g = ctx.createLinearGradient(0, hl.y, 0, hl.y + 150);
    g.addColorStop(0, "#05070a"); g.addColorStop(.6, "#0b0e13"); g.addColorStop(1, "rgba(8,10,14,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - 2, hl.y - 1, hl.w + 4, Math.min(H - hl.y + 20, 160));
    // 断口碎块
    ctx.fillStyle = "#2b333d";
    ctx.beginPath();
    ctx.moveTo(x - 6, hl.y); ctx.lineTo(x + 10, hl.y); ctx.lineTo(x + 4, hl.y + 12); ctx.lineTo(x - 8, hl.y + 7);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + hl.w + 6, hl.y); ctx.lineTo(x + hl.w - 10, hl.y); ctx.lineTo(x + hl.w - 4, hl.y + 13);
    ctx.lineTo(x + hl.w + 8, hl.y + 6); ctx.closePath(); ctx.fill();
    // 断口下缘的钢筋
    ctx.strokeStyle = "#4a5560"; ctx.lineWidth = 1.4;
    for(let i=0;i<3;i++){
      const sx = x + 8 + i*(hl.w-16)/2;
      ctx.beginPath(); ctx.moveTo(sx, hl.y + 2); ctx.lineTo(sx + 2, hl.y + 16 + (i%2)*6); ctx.stroke();
    }
  }
}
// 第三关：左端的逃生门（绿色 EXIT 灯 + 卷帘门半开）
function drawExitDoor(){
  if(!finalRun) return;
  const x = runExitX - cam;
  if(x < -160 || x > W + 160) return;
  const gy = groundYAt(runExitX + 40);
  const base = gy < Infinity ? gy : 440;
  const top = base - 138;

  ctx.fillStyle = "#232b34"; ctx.fillRect(x - 54, top - 12, 108, 150);
  ctx.fillStyle = "#141a21"; ctx.fillRect(x - 46, top, 92, 138);
  // 门后的强光（出口）
  const g = ctx.createLinearGradient(x, top, x, base);
  g.addColorStop(0, "#eaffff"); g.addColorStop(.55, "#9fe4ff"); g.addColorStop(1, "#3f8fb5");
  ctx.fillStyle = g; ctx.fillRect(x - 38, top + 8, 76, 130);
  // 半开的卷帘门（从上方落下）
  ctx.fillStyle = "#3a444f";
  for(let i=0;i<4;i++){
    ctx.fillRect(x - 40, top + 6 + i*9, 80, 7);
    ctx.fillStyle = i%2 ? "#48535f" : "#3a444f";
  }
  ctx.fillStyle = "#2a333c"; ctx.fillRect(x - 40, top + 6, 80, 4);
  // EXIT 指示牌
  ctx.fillStyle = "#0c3320"; ctx.fillRect(x - 40, top - 34, 80, 20);
  ctx.fillStyle = "#4dff88"; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
  ctx.fillText("EXIT", x, top - 19);
  // 指向左的箭头 + 闪烁
  ctx.globalAlpha = .55 + .45*Math.abs(Math.sin(perfNow/220));
  ctx.fillStyle = "#4dff88";
  ctx.beginPath(); ctx.moveTo(x - 62, top - 24); ctx.lineTo(x - 48, top - 32); ctx.lineTo(x - 48, top - 16);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}
// 第三关：追在身后的红液浪头（浪头左侧是空气，右侧全是液体）
function drawLiquidWall(){
  if(!liquid) return;
  const t = perfNow/1000;
  const ex = liquid.x - cam;
  if(ex > W + 180) return;
  const x0 = Math.max(-70, ex);
  const wave = (yy) =>
    Math.max(-70, x0 + Math.sin(yy*0.035 + t*2.6)*11 + Math.sin(yy*0.09 - t*3.7)*5 + (yy < 130 ? -7 : 0));
  // 背后的红光
  const gl = ctx.createLinearGradient(x0 - 240, 0, x0 + 60, 0);
  gl.addColorStop(0, "rgba(255,40,30,0)");
  gl.addColorStop(1, "rgba(255,40,30,.38)");
  ctx.fillStyle = gl; ctx.fillRect(x0 - 240, 0, Math.max(0, W - x0 + 300), H);
  // 液墙主体
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#6b0409"); g.addColorStop(.42, "#a5101a");
  g.addColorStop(.80, "#cf1725"); g.addColorStop(1, "#4e0106");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x0, H + 12);
  for(let yy = -12; yy <= H + 12; yy += 14) ctx.lineTo(wave(yy), yy);
  ctx.lineTo(W + 90, H + 12);
  ctx.closePath(); ctx.fill();
  // 浪头亮边
  ctx.beginPath();
  for(let yy = -12; yy <= H + 12; yy += 14){
    if(yy === -12) ctx.moveTo(wave(yy), yy); else ctx.lineTo(wave(yy), yy);
  }
  ctx.strokeStyle = "rgba(255,140,120,.85)"; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = "rgba(255,235,225,.55)"; ctx.lineWidth = 1.8; ctx.stroke();
  // 浪尖卷曲
  ctx.fillStyle = "rgba(255,90,80,.55)";
  ctx.beginPath();
  ctx.ellipse(wave(H*0.22) + 16, H*0.22, 22, 12, 0, 0, 7); ctx.fill();
  // 内部翻滚的暗纹与气泡
  ctx.globalAlpha = .16; ctx.fillStyle = "#ff8070";
  for(let k=0;k<10;k++){
    const spanX = Math.max(60, W + 240 - x0);
    const bx = x0 + 30 + ((perfNow/6 + k*137) % spanX);
    const by = H - 30 - ((perfNow/9 + k*97) % Math.max(60, H - 50));
    ctx.beginPath(); ctx.arc(bx, by, 5 + (k%3)*4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
// 第三关：跟着一起逃命的士兵（敌军也扔下枪往回跑）
function drawFleeSoldier(s){
  const x = s.x - cam;
  if(x < -70 || x > W + 70) return;
  const alpha = s.dead ? Math.max(0, 1 - s.sinkT/26) : 1;
  if(alpha <= 0) return;
  const sink = s.dead ? s.sinkT*1.6 : 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(x + s.w/2, s.y + s.h + 1, s.w*0.72, 4, 0, 0, 7); ctx.fill();
  ctx.translate(x + s.w/2, s.y + s.h + sink);
  ctx.scale(-1, 1);                                   // 一律朝左跑
  const sw = Math.sin(s.animT), sw2 = Math.sin(s.animT + Math.PI);
  // 后腿 / 前腿
  ctx.save(); ctx.translate(-2, -15); ctx.rotate(sw*0.72);
  ctx.fillStyle = "#1d3f6e"; ctx.fillRect(-3, 0, 6, 15);
  ctx.fillStyle = "#14161b"; ctx.fillRect(-4, 12, 9, 4); ctx.restore();
  ctx.save(); ctx.translate(3, -15); ctx.rotate(sw2*0.82);
  ctx.fillStyle = "#245089"; ctx.fillRect(-3, 0, 6, 15);
  ctx.fillStyle = "#14161b"; ctx.fillRect(-4, 12, 9, 4); ctx.restore();
  // 躯干 / 背心 / 背包
  ctx.fillStyle = "#55663a"; ctx.fillRect(-7, -31, 14, 18);
  ctx.fillStyle = "#4a5a32"; ctx.fillRect(-7, -31, 14, 3);
  ctx.fillStyle = "#2e3a22"; ctx.fillRect(-5, -28, 10, 9);
  ctx.fillStyle = "#3a4a26"; ctx.fillRect(-9, -30, 4, 9);
  // 手臂：惊慌时高举双手
  const arm = (ax, ay, ang) => {
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = "#55663a"; ctx.fillRect(-2.5, 0, 5, 12);
    ctx.fillStyle = "#c9a17a"; ctx.fillRect(-2.5, 11, 5, 4);
    ctx.restore();
  };
  if(s.panic){ arm(4, -29, -2.35 + sw*0.16); arm(-3, -29, 2.5 + sw2*0.16); }
  else { arm(2, -29, sw2*1.05); arm(-2, -29, sw*1.05); }
  // 头 + 钢盔
  ctx.fillStyle = "#c9a17a"; ctx.fillRect(-5, -41, 11, 10);
  ctx.fillStyle = "#3d4a26";
  ctx.beginPath(); ctx.arc(0.5, -40, 8, Math.PI, 0); ctx.fill();
  ctx.fillRect(-7.5, -41, 16, 3);
  ctx.fillStyle = "#2a3319"; ctx.fillRect(-7.6, -38.6, 16.4, 2);
  ctx.fillStyle = "#1c1f18"; ctx.fillRect(2, -37, 3.4, 2.2);
  // 吓出的汗
  if(!s.dead && s.panic && Math.floor(s.animT*0.9)%11 === 0){
    ctx.globalAlpha = alpha*0.8; ctx.fillStyle = "#8fd0ff";
    ctx.beginPath(); ctx.arc(-10, -45, 1.9, 0, 7); ctx.fill(); ctx.globalAlpha = alpha;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawFleeSquad(){

// 开场演出：直升机 + 绳索
function drawInsert(){
  const t = stateTimer, hp2 = heliPos(t);
  const hx = hp2.x-cam, hy = hp2.y;
  // 绳索（放下→滑降→收回）
  let ropeLen = 0;
  const Rmax = groundYAt(260) - (hp2.y+30);
  if(t>=95 && t<135)      ropeLen = (t-95)/40 * Rmax;
  else if(t>=135 && t<235) ropeLen = Rmax;
  else if(t>=235 && t<275) ropeLen = (1-(t-235)/40) * Rmax;
  if(ropeLen>0){
    ctx.strokeStyle="#d8d2c0"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(hx+12, hy+22); ctx.lineTo(hx+12, hy+22+ropeLen); ctx.stroke();
  }
  // 直升机（像素风：机身+座舱+尾梁+旋翼）
  ctx.save(); ctx.translate(hx, hy);
  const dirF = t<270 ? -1 : 1; // 来时朝左，离场朝右
  ctx.scale(dirF,1);
  ctx.fillStyle="#2f4a2f";                                        // 机身
  ctx.fillRect(-26, 0, 46, 20);
  ctx.fillStyle="#3d5f3d"; ctx.fillRect(-22, 3, 38, 8);
  ctx.fillStyle="#7ab0d8"; ctx.fillRect(8, 4, 12, 10);            // 座舱玻璃
  ctx.fillStyle="#2f4a2f"; ctx.fillRect(-58, 4, 34, 7);           // 尾梁
  ctx.fillRect(-62, -2, 6, 18);                                   // 尾鳍
  ctx.fillStyle="#c9d4e0";                                        // 尾桨
  const tr2 = Math.floor(perfNow/60)%2 ? 16 : 2;
  ctx.fillRect(-64, 6-tr2/2, 2, tr2);
  ctx.fillStyle="#22262c"; ctx.fillRect(-8, -6, 10, 7);           // 旋翼座
  ctx.strokeStyle="#22262c"; ctx.lineWidth=3;                     // 主旋翼（旋转 illusion）
  const rw = Math.cos(perfNow/45)*46;
  ctx.beginPath(); ctx.moveTo(-rw, -8); ctx.lineTo(rw, -8); ctx.stroke();
  ctx.strokeStyle="#555c66"; ctx.lineWidth=1.5;
  const rw2 = Math.sin(perfNow/45)*40;
  ctx.beginPath(); ctx.moveTo(-rw2, -6); ctx.lineTo(rw2, -6); ctx.stroke();
  ctx.restore();
  // 绳索末端把手
  if(ropeLen>0){ ctx.fillStyle="#8a6a3a"; ctx.fillRect(hx+7, hy+22+ropeLen-4, 10, 5); }
}

  ctx.fillStyle="#20262d"; ctx.fillRect(x+4, y+h-18, w-8, 15);

  ctx.lineTo(x+w-22, y+14); ctx.lineTo(x+w-4, y+26); ctx.lineTo(x+w-4, y+34);

  ctx.fillStyle="#33402c"; ctx.fillRect(x+6, y+30, w-14, 2);

  // 舱盖
  ctx.fillStyle="#2f3b2b"; ctx.beginPath(); ctx.ellipse(cx-9, cy-5, 10, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle="#5c6c4e"; ctx.beginPath(); ctx.ellipse(cx-9, cy-6, 7.5, 5, 0, 0, 7); ctx.fill();

                : (spotting && Math.floor(e.t/4)%2 ? "#ff7a3c" : "#8b2a12");
  ctx.fillRect(cx + gd*13 - 2, cy - 5, 5, 3);
  // 车体编号
  ctx.fillStyle="#8d9a7c"; ctx.font="bold 8px monospace";
  ctx.fillText("T-72", x+14, y+27);

    ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(26,0); ctx.lineTo(0,9); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle="#fffbe0";
    ctx.beginPath(); ctx.arc(2,0,6.5,0,7); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=.28; ctx.fillStyle="#ffb347";
    ctx.beginPath(); ctx.arc(mzx, mzy, 16, 0, 7); ctx.fill();
    ctx.globalAlpha=1;
  }
  // 察觉提示：还没锁定目标时头顶冒出感叹号（告诉玩家"它发现我了/还没发现我"）
  if(spotting){
    ctx.save();
    ctx.globalAlpha = Math.min(1, e.spot/16);
    ctx.fillStyle = "#ffd34d"; ctx.font = "bold 15px monospace"; ctx.textAlign = "center";
    ctx.fillText("!", cx, cy - 22 - Math.min(7, e.spot*0.5));
    ctx.textAlign = "left";
    ctx.restore();
  }
  // 开火前的瞄准提示：短虚线（不是光束），远远就能看见"这辆坦克正在瞄我"
  if(e.aim > 0){
    const lx = mzx, ly = mzy;

  if(e.vx){
    ctx.globalAlpha=.30; ctx.fillStyle="#9aa0a8";
    const px = x + (e.vx > 0 ? 2 : w-6);
    ctx.fillRect(px, y + 20 - (e.t%18)*0.6, 4, 4);
    ctx.globalAlpha=1;
  }
}
// 滚轮炮台：装甲炮身 + 两个大轮子（滚动动画）+ 前伸炮管
function drawRoller(e, x, y){
  const w = e.w, h = e.h, face = e.face || 1;
  const wy = y + h - 9;                                  // 轮轴高度
  // 轮子
  for(const wx of [x + 12, x + w - 12]){
    ctx.fillStyle = "#1b1f24";
    ctx.beginPath(); ctx.arc(wx, wy, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#3d454e";
    ctx.beginPath(); ctx.arc(wx, wy, 5.5, 0, 7); ctx.fill();
    ctx.strokeStyle = "#7c8794"; ctx.lineWidth = 2;
    const sp = e.wheel || 0;
    for(let k=0;k<3;k++){
      const a = sp + k*Math.PI/3;
      ctx.beginPath();
      ctx.moveTo(wx - Math.cos(a)*5, wy - Math.sin(a)*5);
      ctx.lineTo(wx + Math.cos(a)*5, wy + Math.sin(a)*5);
      ctx.stroke();
    }
  }
  // 车体
  ctx.fillStyle = "#39424d"; ctx.fillRect(x+2, y+10, w-4, h-14);
  ctx.fillStyle = "#4d5866"; ctx.fillRect(x+4, y+12, w-8, 8);
  ctx.fillStyle = "#2a3138"; ctx.fillRect(x+2, y+26, w-4, 5);
  // 履带挡泥板
  ctx.fillStyle = "#232a31"; ctx.fillRect(x, y+24, 5, 8); ctx.fillRect(x+w-5, y+24, 5, 8);
  // 炮塔 + 炮管（朝主角方向）
  ctx.fillStyle = "#5a6675"; ctx.fillRect(x + w/2 - 9, y, 18, 13);
  ctx.fillStyle = "#6f7d8d"; ctx.fillRect(x + w/2 - 7, y+2, 14, 4);
  const gx = face > 0 ? x + w/2 + 6 : x + w/2 - 6;
  ctx.fillStyle = "#20262c"; ctx.fillRect(face > 0 ? gx : gx - 22, y + 5, 22, 6);
  // 瞄准红点（即将开火时闪）
  if(e.burst > 0 || e.cd < 20){
    ctx.fillStyle = (Math.floor(perfNow/90)%2) ? "#ff3b1f" : "#8a1c0c";
    ctx.fillRect(x + w/2 - 2, y - 4, 4, 4);
  }
  // 排气
  if(e.vx){
    ctx.globalAlpha = .4;
    const px = x + (e.vx > 0 ? 0 : w);
    ctx.fillStyle = "#9aa0a8"; ctx.fillRect(px - 1, y + h - 14 - (perfNow/60)%6, 4, 4);
    ctx.globalAlpha = 1;
  }
}
// 天花板摄像头：吊杆 + 云台 + 镜头 + 红色录像灯（预警时扫描锥）
function drawCam(e, x, y){
  const cx = x + e.w/2, w = e.w, h = e.h;
  // 吊杆
  ctx.fillStyle = "#2a333d"; ctx.fillRect(cx-3, 0, 6, y);
  ctx.fillStyle = "#1c232b"; ctx.fillRect(cx-9, 0, 18, 5);
  // 云台
  ctx.fillStyle = "#39434f"; ctx.fillRect(cx-6, y-6, 12, 10);
  // 机身
  ctx.fillStyle = "#46525f";
  ctx.beginPath();
  ctx.moveTo(x+3, y); ctx.lineTo(x+w-3, y); ctx.lineTo(x+w-7, y+h); ctx.lineTo(x+7, y+h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#576577"; ctx.fillRect(x+6, y+3, w-12, 5);
  // 镜头（朝下）
  ctx.fillStyle = "#0c1014"; ctx.beginPath(); ctx.arc(cx, y+h, 7, 0, Math.PI); ctx.fill();
  ctx.fillStyle = "#2b6b8a"; ctx.beginPath(); ctx.arc(cx, y+h-2, 4, 0, 7); ctx.fill();
  ctx.fillStyle = "#8fd8ff"; ctx.beginPath(); ctx.arc(cx-1, y+h-3, 1.6, 0, 7); ctx.fill();
  // 录像/预警灯
  const alarming = e.warn > 0 || e.burst > 0;
  ctx.fillStyle = alarming ? ((Math.floor(perfNow/70)%2) ? "#ff3b1f" : "#ffb3a0")
                           : ((Math.floor(perfNow/700)%2) ? "#ff6a4a" : "#5a1c10");
  ctx.fillRect(x+w-9, y+3, 4, 4);
  // 预警扫描锥
  if(e.warn > 0){
    ctx.globalAlpha = .12 + .10*Math.sin(perfNow/60);
    ctx.fillStyle = "#ff5b3d";
    ctx.beginPath();
    ctx.moveTo(cx-6, y+h); ctx.lineTo(cx-64, H); ctx.lineTo(cx+64, H); ctx.lineTo(cx+6, y+h);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
}

// ---------- 第四关小 Boss：外星督军（孵化厅守卫） ----------
function spawnMini(){
  miniSpawned = true;
  const A = miniArena || {x:MINI_ARENA_X, l:MINI_ARENA_L, r:MINI_ARENA_R,
                          name:"外星督军 · 孵化厅守卫", hp:170, tone:"alien"};
  const gy = groundYAt(A.x + 52);
  mini = {kind:"mini", x:A.x, y:(gy < Infinity ? gy : GROUND_Y) - 96, w:104, h:96,
          hp:A.hp, maxHp:A.hp, name:A.name, tone:A.tone || "alien",
          face:-1, t:0, st:"idle", stT:0, cd:100, flash:0,
          dead:false, animT:0, vx:0, vy:0, warnT:0, chargeDir:-1, rewarded:false, grounded:true,
          rage:false};
  enemies.push(mini);
  shake = Math.max(shake, 14);
  sfx(60,.7,"sawtooth",.14,-50);
}
function updateMini(e, p){
  e.t++; if(e.flash > 0) e.flash--;
  e.animT += 0.12;
  const A = miniArena || {l:MINI_ARENA_L, r:MINI_ARENA_R};
  const cx = e.x + e.w/2, px = p.x + p.w/2;
  const dx = px - cx, dist = Math.abs(dx);
  if(e.st !== "charge") e.face = dx > 0 ? 1 : -1;
  if(!e.rage && e.hp <= e.maxHp * 0.5){
    e.rage = true; e.flash = 20; shake = Math.max(shake, 10);
    sfx(70,.6,"sawtooth",.14,-40);
    explode(cx, e.y + e.h/2, "#ff2f14", 22, 5);
  }

  // 重力
  e.vy += 0.6; e.y += e.vy;
  const gy = groundYAt(cx);
  if(gy < Infinity && e.y + e.h >= gy){ e.y = gy - e.h; e.vy = 0; e.grounded = true; }
  else e.grounded = false;
  if(e.dead) return;

  e.stT++;
  if(e.st === "idle"){
    const spd = e.rage ? 1.55 : 1.15;
    if(dist > 300) e.x += e.face * spd;
    else if(dist < 165) e.x -= e.face * (spd*0.85);
    if(e.stT > (e.rage ? 32 : 48)){
      e.stT = 0;
      const r = Math.random();
      if(r < 0.46){ e.st = "wind"; e.warnT = e.rage ? 34 : 46; sfx(90,.5,"sawtooth",.10,-50); }
      else if(r < 0.78){ e.st = "spit"; }
      else { e.st = "summon"; }
    }
  } else if(e.st === "wind"){
    e.warnT--;
    if(e.warnT <= 0){
      e.st = "charge"; e.stT = 0; e.chargeDir = e.face;
      sfx(130,.45,"square",.13,-40);
    }
  } else if(e.st === "charge"){
    e.x += e.chargeDir * (e.rage ? 6.0 : 4.6);
    shake = Math.max(shake, e.rage ? 6 : 4);
    if(e.x < A.l - 30 || e.x + e.w > A.r + 30 || e.stT > 80){
      e.st = "stun"; e.stT = 0; shake = Math.max(shake, 12);
      sfx(80,.5,"square",.14,-30);
      explode(e.x + e.w/2, e.y + e.h - 8, "#9aa0a8", 20, 4.5);
    }
  } else if(e.st === "stun"){
    if(e.stT > 66){ e.st = "idle"; e.stT = 0; }
  } else if(e.st === "spit"){
    if(e.stT === 24){
      const n = e.rage ? 7 : 5;
      for(let k=0;k<n;k++){
        const ang = -Math.PI/2 + (k-(n-1)/2)*0.26;
        ebullets.push({x:cx, y:e.y + 20, w:11, h:11, r:6,
                       vx:Math.cos(ang)*5.2, vy:Math.sin(ang)*5.2, g:0.26, life:220, acid:true});
      }
      sfx(170,.3,"sawtooth",.1,-70);
    }
    if(e.stT > 62){ e.st = "idle"; e.stT = 0; }
  } else if(e.st === "summon"){
    if(e.stT === 28){
      const n = e.rage ? 3 : 2;
      for(let k=0;k<n;k++){
        const sx = cx + (k - (n-1)/2)*96;
        const g2 = groundYAt(sx);
        enemies.push(makeAlien(sx, g2 < Infinity ? g2 : GROUND_Y, k === 1 ? "spit" : "claw"));
      }
      shake = Math.max(shake, 9); sfx(90,.42,"square",.12,-60);
      explode(cx, e.y + e.h - 6, "#7dfce8", 16, 4);
    }
    if(e.stT > 58){ e.st = "idle"; e.stT = 0; }
  }
}

function drawAlien(e, x, y){

    ctx.fillStyle = flash ? "#fff" : "#1b2b3a";
    ctx.beginPath(); ctx.arc(cx, cy, 13, 0, 6.283); ctx.fill();

    ctx.moveTo(x+6, y+10+bob);
    ctx.quadraticCurveTo(x+e.w/2, y-4+bob, x+e.w-4, y+14+bob);
    ctx.quadraticCurveTo(x+e.w+3, y+30, x+e.w-8, y+34);
    ctx.quadraticCurveTo(x+e.w/2, y+40, x+6, y+32);
    ctx.closePath(); ctx.fill();
    // 腹囊（发光）
    const g2 = ctx.createRadialGradient(x+e.w/2, y+26, 1, x+e.w/2, y+26, 14);
    g2.addColorStop(0, "rgba(150,255,120,.95)"); g2.addColorStop(1, "rgba(70,180,60,.25)");
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x+e.w/2, y+26, 12, 0, 6.283); ctx.fill();
    // 头
    ctx.fillStyle = flash ? "#fff" : "#4a3468";
    ctx.beginPath(); ctx.arc(x + e.w/2 + f*7, y+11+bob, 8, 0, 6.283); ctx.fill();
    // 口器（吐酸时张开）
    const open = e.spit > 0 ? 4 : 1.6;

    ctx.beginPath(); ctx.ellipse(x + e.w/2 + f*10, y+13+bob, open, 2.6, 0, 0, 6.283); ctx.fill();

    ctx.beginPath(); ctx.arc(x + e.w/2 + f*11, y+8+bob, 2.2, 0, 6.283); ctx.fill();

  ctx.closePath(); ctx.fill();

    ctx.moveTo(sx, y+16+bob); ctx.lineTo(sx+2, y+8+bob); ctx.lineTo(sx+5, y+16+bob);

  ctx.lineTo(x + e.w/2 + f*6, y+22+bob);

  // 前爪（跳动时张开）

      ctx.moveTo(bx, y+1);
      ctx.quadraticCurveTo(bx+2, y-13-(b%2)*4, bx+4, y-6);
      ctx.lineTo(bx+2.4, y+1); ctx.closePath(); ctx.fill();
    }
    return;
  }
  if(e.kind==="turret"){
    // 固定炮台：三脚底座 + 可旋转炮塔（平滑转头）+ 长炮管（特殊炮台为青色）
    const cx = x + e.w/2, cy = y + 19, sp = e.sp;
    const c1 = sp ? "#1d6a68" : "#3a3f4a",
          c2 = sp ? "#3aa8a0" : "#5a6370",
          c3 = sp ? "#124b48" : "#232830",
          c4 = sp ? "#7ff0e4" : "#8894a4";
    const ang = e.gunA===undefined
      ? Math.atan2(chestY() - cy, (player.x+player.w/2) - cx) : e.gunA;
    const kick = e.kick || 0;
    ctx.globalAlpha=.3; ctx.fillStyle="#000";
    ctx.beginPath(); ctx.ellipse(cx, y+e.h+1, 24, 5, 0, 0, 7); ctx.fill(); ctx.globalAlpha=1;
    // 三脚支架（外撇三条腿 + 横撑）
    ctx.fillStyle=c3;
    ctx.beginPath();
    ctx.moveTo(cx-4, cy+2); ctx.lineTo(cx+4, cy+2);
    ctx.lineTo(cx+22, y+e.h); ctx.lineTo(cx+12, y+e.h);
    ctx.lineTo(cx, cy+11); ctx.lineTo(cx-12, y+e.h); ctx.lineTo(cx-22, y+e.h);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=c1;
    ctx.fillRect(cx-19, y+e.h-9, 12, 3); ctx.fillRect(cx+8, y+e.h-9, 12, 3);
    ctx.fillStyle=c4; ctx.globalAlpha=.5;
    ctx.fillRect(cx-19, y+e.h-9, 12, 1); ctx.fillRect(cx+8, y+e.h-9, 12, 1);
    ctx.globalAlpha=1;
    ctx.fillStyle=c1; ctx.fillRect(cx-3, cy+2, 6, 15);      // 立柱
    // 底座转盘（带一圈随转动变化的刻度，能看出它在转）
    ctx.fillStyle=c3; ctx.beginPath(); ctx.ellipse(cx, cy+5, 17, 6.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle=c1; ctx.beginPath(); ctx.ellipse(cx, cy+3, 16, 6.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle=c2; ctx.beginPath(); ctx.ellipse(cx, cy+2, 16, 4.6, 0, 0, 7); ctx.fill();
    ctx.fillStyle=c3;
    for(let k=0;k<8;k++){
      const a2 = ang + k*Math.PI/4;
      ctx.fillRect(cx + Math.cos(a2)*12 - 1, cy+2 + Math.sin(a2)*3.4 - 1, 2.4, 2.4);
    }
    // 炮管（随 gunA 平滑转向，开火有后座）
    ctx.save(); ctx.translate(cx, cy-2); ctx.rotate(ang);
    ctx.translate(-kick*1.6, 0);
    ctx.fillStyle=c3; ctx.fillRect(0, -5, 26, 10);
    ctx.fillStyle=c2; ctx.fillRect(0, -5, 26, 2.6);
    ctx.fillStyle=c1; ctx.fillRect(0, 2.4, 26, 2.2);
    ctx.fillStyle="#101418"; ctx.fillRect(25, -6.5, 8, 13);      // 炮口制退器
    ctx.fillStyle="#000"; ctx.fillRect(31, -3, 3, 6);
    ctx.fillStyle=c4; ctx.fillRect(6, -7.2, 3, 2);               // 炮管箍
    if(kick>2){                                                  // 炮口焰
      ctx.globalAlpha=.9; ctx.fillStyle="#ffe58a";
      ctx.beginPath(); ctx.moveTo(34,-5); ctx.lineTo(36+Math.random()*9,0); ctx.lineTo(34,5);
      ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.restore();
    // 转塔（半圆罩 + 观察窗）
    ctx.fillStyle=c1; ctx.beginPath(); ctx.arc(cx, cy-2, 14, Math.PI, 0); ctx.fill();
    ctx.fillRect(cx-14, cy-3, 28, 7);
    ctx.fillStyle=c2; ctx.beginPath(); ctx.arc(cx, cy-3, 11, Math.PI, 0); ctx.fill();
    ctx.fillStyle=c3; ctx.beginPath(); ctx.arc(cx, cy-3, 11, Math.PI, 0);
    ctx.arc(cx, cy-3, 8.4, 0, Math.PI, true); ctx.fill();
    // 观察窗（朝炮管方向的一小块玻璃）
    ctx.fillStyle="#8ad8ff"; ctx.globalAlpha=.75;
    ctx.fillRect(cx + Math.cos(ang)*6 - 2.2, cy - 9 + Math.sin(ang)*2, 4.4, 3);
    ctx.globalAlpha=1;
    // 侧面弹药箱 + 弹链
    ctx.fillStyle="#2c333b"; ctx.fillRect(cx+10, cy+6, 11, 9);
    ctx.fillStyle=c2; ctx.fillRect(cx+10, cy+6, 11, 2);
    ctx.fillStyle="#8a7a4a";
    for(let k=0;k<3;k++) ctx.fillRect(cx+12+k*3, cy+10, 2, 3);
    // 状态灯
    if(!e.dead){
      const blink = Math.floor(t/15)%2===0;
      ctx.fillStyle = sp ? (blink?"#5afff0":"#1a8a80") : (blink?"#ff5b3d":"#802a1a");
      ctx.fillRect(cx-2, cy-14, 4, 4);
    }
    return;
  }
  // ----- 士兵（冲锋兵 / 自爆兵 / 狙击手）-----
  const run = e.mode==="runner" || e.mode==="bomber";
  const bob = run ? Math.abs(Math.sin(t*0.5))*1.6 : 0;
  const dir = (player.x > e.x)?1:-1;
  ctx.save(); ctx.translate(x+e.w/2, y+bob); ctx.scale(dir,1); ctx.translate(-e.w/2,0);
  const isB = e.mode==="bomber";
  const uni   = isB ? "#a83e1c" : "#4d5c34";
  const uniHi = isB ? "#cb5624" : "#62743f";
  const uniLo = isB ? "#6d2610" : "#333f26";
  const vest  = isB ? "#5b1c0d" : "#2f3a23";
  const sw = run ? Math.sin(t*0.5) : 0;
  // 后腿
  ctx.fillStyle=uniLo; ctx.fillRect(12 + sw*2, 25, 6.5, 12);
  ctx.fillStyle="#12140f"; ctx.fillRect(11 + sw*2, 35, 8, 5);
  // 前腿
  ctx.fillStyle=uni;   ctx.fillRect(4 - sw*2, 25, 7, 12);
  ctx.fillStyle=uniHi; ctx.fillRect(4 - sw*2, 25, 2.4, 12);
  ctx.fillStyle="#171a12"; ctx.fillRect(3 - sw*2, 35, 9, 5);
  // 躯干 + 高光
  ctx.fillStyle=uni;   ctx.fillRect(2.5, 11, 18, 14);
  ctx.fillStyle=uniHi; ctx.fillRect(2.5, 11, 18, 2.4);
  // 防弹背心
  ctx.fillStyle=vest; ctx.fillRect(4.5, 13, 14, 9);
  ctx.fillStyle="#46512f"; ctx.fillRect(6, 15, 11, 1.6);
  // 自爆兵：胸挂炸药 + 快速闪烁引信灯
  if(isB){
    ctx.fillStyle="#3a2a12"; ctx.fillRect(6,17.5,7,6);
    ctx.fillStyle="#c9a44a"; ctx.fillRect(7,18.5,5,1.2);
    ctx.fillStyle = (Math.floor(t/6)%2) ? "#ffe86b" : "#ff2200";
    ctx.fillRect(14,16,4,4);
  }
  // 弹匣袋 / 腰带
  ctx.fillStyle=uniLo; ctx.fillRect(6,20.5,4,3.6); ctx.fillRect(11,20.5,4,3.6);
  ctx.fillStyle="#22261a"; ctx.fillRect(2.5, 24, 18, 2.6);
  // 肩章
  ctx.fillStyle=isB?"#ffb347":"#8a9a5e"; ctx.fillRect(3,11.4,5,2);
  // 后臂
  ctx.fillStyle=uniLo; ctx.fillRect(1.5,12,4.5,8.5);
  // 头 + 钢盔（盔顶弧 + 盔檐）
  ctx.fillStyle="#c9a17a"; ctx.fillRect(5.5,2.5,11,9.5);
  ctx.fillStyle="#b08a63"; ctx.fillRect(14,4.5,2,6.5);
  ctx.fillStyle=isB?"#6b1e0c":"#3a4526";
  ctx.beginPath(); ctx.arc(11, 3.6, 7.6, Math.PI, 0); ctx.fill();
  ctx.fillRect(3.4, 3.2, 15.2, 2.6);
  ctx.fillStyle=isB?"#8a2a12":"#4d5c34";
  ctx.fillRect(3, 5.4, 16, 1.8);                    // 盔檐
  ctx.fillStyle="#1c1f18"; ctx.fillRect(11, 6.8, 3.4, 2.2);  // 护目镜阴影
  if(isB){ ctx.fillStyle="#2a1a12"; ctx.fillRect(5.5, 8.4, 11, 3); }  // 面罩
  // 武器
  if(!isB){
    ctx.fillStyle="#1c1f22"; ctx.fillRect(13, 14, 13, 3.4);
    ctx.fillStyle="#2f353b"; ctx.fillRect(13, 14, 13, 1.2);
    ctx.fillStyle="#14171a"; ctx.fillRect(24, 13.2, 5, 2.2);   // 枪口
    ctx.fillStyle="#2a2f34"; ctx.fillRect(15, 17, 3, 4);       // 弹匣
    if(e.mode==="sniper"){ ctx.fillStyle="#3d454d"; ctx.fillRect(17, 11.4, 7, 2.4); }
  } else {
    ctx.fillStyle="#2a1f10"; ctx.fillRect(15, 16, 4, 7);       // 手提炸药包
  }
  ctx.restore();
}
// ============ 第二关 Boss：反应堆核心 + 上下旋转炮舱 ============
// ---------- 第四关最终 Boss 绘制：嵌在舱壁上的外星主脑 ----------
function drawAlienBoss(){
  const b = boss, wx = b.wallX - cam;
  if(wx > W + 200) return;
  const core = b.core, cx = core.x - cam, cy = core.y;
  const shakeK = 1;

  // ===== 母舰舱壁（生物装甲板）=====
  ctx.fillStyle = "#1a1024"; ctx.fillRect(wx, 0, W - wx + 200, H);
  for(let sy = 0; sy < H; sy += 64){
    ctx.fillStyle = ((sy/64)|0) % 2 ? "#221532" : "#1d1229";
    ctx.fillRect(wx, sy, W - wx + 200, 62);
  }
  // 装甲缝里的青色脉络
  ctx.strokeStyle = "rgba(125,252,232,.22)"; ctx.lineWidth = 2;
  for(let sy = 24; sy < H; sy += 64){
    ctx.beginPath();
    ctx.moveTo(wx, sy);
    for(let x = wx; x < W + 100; x += 46) ctx.lineTo(x, sy + Math.sin((x + perfNow*0.03)*0.02)*5);
    ctx.stroke();
  }
  // 骨刺
  ctx.fillStyle = "#3a2453";
  for(let sy = 30; sy < H; sy += 96){
    ctx.beginPath(); ctx.moveTo(wx, sy); ctx.lineTo(wx + 34, sy + 12); ctx.lineTo(wx, sy + 26); ctx.closePath(); ctx.fill();
  }

  // ===== 巨脸轮廓 =====
  const fcx = wx + 190, fcy = 268;
  ctx.fillStyle = "#2a1a3d";
  ctx.beginPath();
  ctx.ellipse(fcx, fcy, 214, 196, 0, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = "#34204a";
  ctx.beginPath();
  ctx.ellipse(fcx - 8, fcy - 10, 188, 172, 0, 0, 6.283);
  ctx.fill();
  // 额头纹路
  ctx.strokeStyle = "rgba(125,252,232,.18)"; ctx.lineWidth = 3;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(fcx, fcy, 150 - i*34, -2.5, -0.6);
    ctx.stroke();
  }

  // ===== 三只眼 =====
  for(const c of b.cannons){
    const ex = c.x - cam + c.w/2, ey = c.y + c.h/2;
    if(c.dead){
      // 打爆的眼：熔黑的空洞 + 余烬
      ctx.fillStyle = "#0a0710";
      ctx.beginPath(); ctx.ellipse(ex, ey, 26, 22, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = "#4a2b1a"; ctx.lineWidth = 3; ctx.stroke();
      for(let k=0;k<3;k++){
        ctx.fillStyle = "rgba(255,120,60," + (0.25 + 0.25*Math.sin(perfNow*0.01 + k)) + ")";
        ctx.fillRect(ex - 8 + k*7, ey - 4 + (k%2)*6, 3, 3);
      }
      continue;
    }
    const charging = c.warnT > 0;
    const firing = c.beamT > 0;
    // 眼白
    ctx.fillStyle = "#e9f7ff";
    ctx.beginPath(); ctx.ellipse(ex, ey, 26, 23, 0, 0, 6.283); ctx.fill();
    // 血丝
    ctx.strokeStyle = "rgba(180,40,60,.45)"; ctx.lineWidth = 1.4;
    for(let k=0;k<4;k++){
      const a = k*1.7 + c.t*0.01;
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.lineTo(ex + Math.cos(a)*24, ey + Math.sin(a)*21); ctx.stroke();
    }
    // 虹膜
    ctx.fillStyle = firing ? "#ffffff" : (charging ? "#ff2f14" : "#7dfce8");
    ctx.beginPath(); ctx.arc(ex, ey, 13, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#0a1a1f";
    ctx.beginPath(); ctx.ellipse(ex, ey, 4, 12, 0, 0, 6.283); ctx.fill();
    // 眼皮（蓄力时眯起）
    if(charging){
      ctx.fillStyle = "#2a1a3d";
      const hh = 26 - c.warnT * 0.5;
      ctx.beginPath(); ctx.ellipse(ex, ey - hh, 27, hh, 0, 0, 6.283); ctx.fill();
    }
    // 预警线 / 光束
    if(c.warnT > 0){
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.4*Math.abs(Math.sin(c.warnT*0.5));
      ctx.strokeStyle = "#ff2f14"; ctx.lineWidth = 1.6; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.lineTo(ex + Math.cos(c.gunA)*1200, ey + Math.sin(c.gunA)*1200);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
    }
    if(c.beamT > 0){
      const k = c.beamT / 18;
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = "#eaffff"; ctx.lineWidth = 4 + 12*k;
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.lineTo(ex + Math.cos(c.gunA)*1200, ey + Math.sin(c.gunA)*1200);
      ctx.stroke();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = "#7dfce8"; ctx.lineWidth = 2 + 26*k;
      ctx.stroke();
      ctx.restore();
    }
  }

  // ===== 中央核心（护盾 / 裸露）=====
  if(!core.dead){
    const glow = 0.55 + 0.25*Math.sin(perfNow*0.006);
    const g = ctx.createRadialGradient(cx + core.w/2, cy + core.h/2, 6, cx + core.w/2, cy + core.h/2, 92);
    g.addColorStop(0, "rgba(255,80,140," + glow + ")");
    g.addColorStop(0.55, "rgba(150,40,180,.35)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx + core.w/2, cy + core.h/2, 92, 0, 6.283); ctx.fill();
    // 核心本体
    ctx.fillStyle = "#ff4f8b";
    ctx.beginPath(); ctx.ellipse(cx + core.w/2, cy + core.h/2, 30, 44, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#ffe3ef";
    ctx.beginPath(); ctx.ellipse(cx + core.w/2, cy + core.h/2, 16, 26, 0, 0, 6.283); ctx.fill();
    // 护盾：六边形能量罩
    if(core.shielded){
      ctx.save();
      ctx.globalAlpha = 0.38 + 0.16*Math.sin(perfNow*0.008);
      ctx.strokeStyle = "#7dfce8"; ctx.lineWidth = 3;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a = -Math.PI/2 + i*Math.PI/3;
        const px2 = cx + core.w/2 + Math.cos(a)*70, py2 = cy + core.h/2 + Math.sin(a)*84;
        if(i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
      }
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
  }

  // ===== 地面触须 =====
  for(const tn of b.tentacles){
    const gx = tn.x - cam;
    const gy = groundYAt(tn.x);
    const fy = gy < Infinity ? gy : GROUND_Y;
    if(tn.warn > 0){
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.4*Math.abs(Math.sin(tn.t*0.3));
      ctx.strokeStyle = "#ff2f14"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(gx, fy - 4, 30, 9, 0, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.fillStyle = "#ff2f14";
      ctx.beginPath(); ctx.ellipse(gx, fy - 4, 16, 5, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    } else {
      const h = 96 * tn.up;
      ctx.fillStyle = "#3a2453";
      ctx.beginPath();
      ctx.moveTo(gx - 16, fy);
      ctx.quadraticCurveTo(gx - 6, fy - h*0.55, gx, fy - h);
      ctx.quadraticCurveTo(gx + 6, fy - h*0.55, gx + 16, fy);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#7dfce8";
      ctx.beginPath(); ctx.arc(gx, fy - h, 5, 0, 6.283); ctx.fill();
    }
  }

  // ===== 血条 =====
  const bw = 520, bx = W/2 - bw/2, by = 86;
  ctx.fillStyle = "#000a"; ctx.fillRect(bx-4, by-24, bw+8, 32);
  ctx.fillStyle = "#2a1a3d"; ctx.fillRect(bx, by, bw, 14);
  const k = Math.max(0, core.hp / core.maxHp);
  const hg = ctx.createLinearGradient(bx, 0, bx+bw, 0);
  hg.addColorStop(0, "#ff4f8b"); hg.addColorStop(1, "#ffb347");
  ctx.fillStyle = hg; ctx.fillRect(bx, by, bw*k, 14);
  ctx.fillStyle = "#e8f4ff"; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
  ctx.fillText(core.shielded ? "外星主脑 · 先打掉三只眼"
                             : "外星主脑 · 核心暴露！" + (core.phase === 2 ? " · 狂暴" : ""),
               W/2, by - 8);
  // 二阶段：舱内红光
  if(core.phase === 2 && !core.dead){
    ctx.globalAlpha = .07 + .05*Math.sin(perfNow*0.006);
    ctx.fillStyle = "#ff2f14"; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "left";
  // 眼睛状态灯
  for(let i=0;i<b.cannons.length;i++){
    const c = b.cannons[i];
    ctx.fillStyle = c.dead ? "#3a2a52" : "#7dfce8";
    ctx.beginPath(); ctx.arc(bx + i*16, by + 24, 4.5, 0, 6.283); ctx.fill();
  }
}
function drawReactor(){
  const b = boss, wx = b.wallX - cam;
  if(wx > W + 260) return;

  const core = b.core, cx = core.x - cam, cy = core.y;

    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(wx, sy+54, wallW, 4);
  }

  for(let px=wx+26; px<wx+wallW; px+=116){

    ctx.fillStyle="#39424d"; ctx.fillRect(px+3, 0, 4, GROUND_Y);

  ctx.fillStyle="#3c4854"; ctx.fillRect(wx, pipeY, wallW, 14);
  ctx.fillStyle="#54626f"; ctx.fillRect(wx, pipeY, wallW, 4);

  for(let px=wx+30; px<wx+wallW; px+=88) ctx.fillRect(px, pipeY-4, 10, 22);   // 法兰
  ctx.fillStyle="#7fe6ff";
  for(let k=0;k<16;k++){
    const px = wx + ((perfNow/16 + k*72) % wallW);
    ctx.globalAlpha = .55; ctx.fillRect(px, pipeY+6, 14, 2.4); ctx.globalAlpha = 1;
  }
  // 上层电缆桥架
  ctx.fillStyle="#1b2127"; ctx.fillRect(wx, 62, wallW, 8);
  ctx.strokeStyle="#39434f"; ctx.lineWidth=2;
  for(let px=wx+12; px<wx+wallW; px+=34){
    ctx.beginPath(); ctx.moveTo(px+6, 70); ctx.quadraticCurveTo(px+16, 82, px+26, 70); ctx.stroke();
  }
  // 地面格栅
  ctx.fillStyle="#1b2026"; ctx.fillRect(wx, GROUND_Y-12, wallW, 12);
  ctx.fillStyle="#333d47";
  for(let px=wx; px<wx+wallW; px+=18) ctx.fillRect(px, GROUND_Y-12, 8, 12);
  // 警示斜条（墙根）
  ctx.save(); ctx.beginPath(); ctx.rect(wx, GROUND_Y-30, wallW, 12); ctx.clip();
  ctx.fillStyle="#d8b23c"; ctx.fillRect(wx, GROUND_Y-30, wallW, 12);
  ctx.fillStyle="#1d2126";
  for(let s=0; s<wallW; s+=24){
    ctx.beginPath(); ctx.moveTo(wx+s, GROUND_Y-18); ctx.lineTo(wx+s+9, GROUND_Y-30);
    ctx.lineTo(wx+s+18, GROUND_Y-30); ctx.lineTo(wx+s+9, GROUND_Y-18); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // 顶部警示排灯
  for(let px=wx+18; px<wx+wallW; px+=62){
    const on = Math.floor((perfNow/340) + px/62) % 2 === 0;
    ctx.fillStyle = on ? "#ff3b1f" : "#4a1004";
    ctx.fillRect(px, 14, 11, 7);
  }
  // 压力表 / 铭牌
  for(let k=0;k<4;k++){
    const px = wx + 210 + k*74, py = 200;
    ctx.fillStyle="#39424c"; ctx.beginPath(); ctx.arc(px, py, 11, 0, 7); ctx.fill();
    ctx.fillStyle="#c9d6e2"; ctx.beginPath(); ctx.arc(px, py, 8, 0, 7); ctx.fill();
    ctx.strokeStyle="#8d3d2a"; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(px, py);
    ctx.lineTo(px + Math.cos(perfNow/500 + k)*6, py + Math.sin(perfNow/500 + k)*6); ctx.stroke();
  }

  // ================= 反应堆核心 =================
  // 防护外框
  ctx.fillStyle="#151a20"; ctx.fillRect(cx-30, cy-30, core.w+60, core.h+60);
  ctx.fillStyle="#333d48"; ctx.fillRect(cx-24, cy-24, core.w+48, core.h+48);
  ctx.fillStyle="#1e252c"; ctx.fillRect(cx-16, cy-16, core.w+32, core.h+32);
  // 四角液压夹钳
  for(let k=0;k<4;k++){
    const qx = k%2 ? cx+core.w+16 : cx-16, qy = k<2 ? cy-16 : cy+core.h+16;
    ctx.fillStyle="#4a5561"; ctx.fillRect(qx-10, qy-10, 20, 20);
    ctx.fillStyle="#697585"; ctx.fillRect(qx-7, qy-7, 14, 6);
    ctx.fillStyle="#2b333c"; ctx.fillRect(qx-3, qy+2, 6, 8);
  }
  if(!core.dead){
    const pulse = .55 + .45*Math.abs(Math.sin(perfNow/240));
    // 六边形外壳
    ctx.fillStyle="#4e5b6a";
    ctx.beginPath();
    ctx.moveTo(cx+core.w/2, cy-12); ctx.lineTo(cx+core.w+8, cy+core.h*0.25);
    ctx.lineTo(cx+core.w+8, cy+core.h*0.75); ctx.lineTo(cx+core.w/2, cy+core.h+12);
    ctx.lineTo(cx-8, cy+core.h*0.75); ctx.lineTo(cx-8, cy+core.h*0.25);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle="#38424e";
    ctx.beginPath();
    ctx.moveTo(cx+core.w/2, cy-4); ctx.lineTo(cx+core.w-2, cy+core.h*0.3);
    ctx.lineTo(cx+core.w-2, cy+core.h*0.7); ctx.lineTo(cx+core.w/2, cy+core.h+4);
    ctx.lineTo(cx+2, cy+core.h*0.7); ctx.lineTo(cx+2, cy+core.h*0.3);
    ctx.closePath(); ctx.fill();
    // 内部能量
    const eg = ctx.createRadialGradient(cx+core.w/2, cy+core.h/2, 6, cx+core.w/2, cy+core.h/2, core.h*0.62);
    eg.addColorStop(0, "#fffbe0");
    eg.addColorStop(.42, core.shielded ? "#7dfff2" : "#ffb347");
    eg.addColorStop(1, core.shielded ? "#0e4a52" : "#6e1603");
    ctx.fillStyle = eg;
    ctx.fillRect(cx, cy, core.w, core.h);
    // 能量流动条纹
    ctx.globalAlpha = .34; ctx.fillStyle="#ffffff";
    for(let s=0; s<7; s++) ctx.fillRect(cx, cy + ((perfNow/5 + s*20) % core.h), core.w, 2);
    ctx.globalAlpha = 1;
    // 中心转子 + 十字筋
    ctx.save(); ctx.translate(cx+core.w/2, cy+core.h/2); ctx.rotate(perfNow/900);
    ctx.strokeStyle="rgba(255,255,255,.30)"; ctx.lineWidth=3;
    for(let k=0;k<6;k++){
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(k*Math.PI/3)*core.w*0.46, Math.sin(k*Math.PI/3)*core.w*0.46);
      ctx.stroke();
    }
    ctx.fillStyle="rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.arc(0, 0, 9 + pulse*3, 0, 7); ctx.fill();
    ctx.restore();
    // 护盾力场（炮舱未毁 → 核心无敌）
    if(core.shielded){
      const R = Math.max(core.w, core.h)*0.72;
      ctx.globalAlpha = .20 + .16*pulse;
      ctx.strokeStyle="#5afff0"; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(cx+core.w/2, cy+core.h/2, R, 0, 7); ctx.stroke();
      ctx.globalAlpha = .09 + .07*pulse; ctx.fillStyle="#5afff0";
      ctx.beginPath(); ctx.arc(cx+core.w/2, cy+core.h/2, R, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      // 六边形网格
      ctx.strokeStyle="rgba(120,255,245,.32)"; ctx.lineWidth=1;
      for(let a=0; a<8; a++){
        const ang = a*Math.PI/4 + perfNow/2800;
        ctx.beginPath();
        ctx.moveTo(cx+core.w/2, cy+core.h/2);
        ctx.lineTo(cx+core.w/2+Math.cos(ang)*R, cy+core.h/2+Math.sin(ang)*R);
        ctx.stroke();
      }
      // 护盾节点
      for(let a=0; a<6; a++){
        const ang = a*Math.PI/3 - perfNow/1800;
        ctx.fillStyle="rgba(150,255,248,.8)";
        ctx.beginPath();
        ctx.arc(cx+core.w/2+Math.cos(ang)*R, cy+core.h/2+Math.sin(ang)*R, 3.2, 0, 7);
        ctx.fill();
      }
    }
  } else {
    // 核心熔毁：破口透出稳定白光（第二关终点）
    const dg = ctx.createLinearGradient(0, cy, 0, cy+core.h);
    dg.addColorStop(0,"#eaffff"); dg.addColorStop(1,"#ffd27a");
    ctx.fillStyle=dg; ctx.fillRect(cx, cy, core.w, core.h);
    ctx.globalAlpha = .3 + .15*Math.sin(perfNow/120);
    ctx.fillStyle="#fff3a0"; ctx.fillRect(cx-34, cy-24, core.w+68, core.h+48);
    ctx.globalAlpha=1;
    ctx.fillStyle="#101418";
    ctx.beginPath(); ctx.moveTo(cx-8, cy+core.h*0.3); ctx.lineTo(cx+10, cy+core.h*0.16);
    ctx.lineTo(cx+6, cy+core.h*0.44); ctx.closePath(); ctx.fill();
  }

  // ================= 上下炮舱（旋转炮塔，打掉才能破盾） =================
  for(const g of b.cannons){
    const gx = g.x-cam + g.w/2, gy = g.y + g.h/2;
    // 液压臂（连回墙体）
    ctx.strokeStyle="#2c343d"; ctx.lineWidth=10; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(gx+g.w*0.5-2, gy); ctx.lineTo(gx+g.w*0.5+40, gy); ctx.stroke();
    ctx.strokeStyle="#48525e"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(gx+g.w*0.5-2, gy-2.5); ctx.lineTo(gx+g.w*0.5+40, gy-2.5); ctx.stroke();
    ctx.lineCap="butt";
    // 护罩
    ctx.fillStyle = g.dead ? "#22272d" : "#2b333c";
    ctx.beginPath(); ctx.arc(gx, gy, g.w/2+7, 0, 7); ctx.fill();
    ctx.fillStyle = g.dead ? "#2a2f36" : "#48525f";
    ctx.beginPath(); ctx.arc(gx, gy, g.w/2, 0, 7); ctx.fill();
    ctx.fillStyle = g.dead ? "#22262c" : "#5c6875";
    ctx.beginPath(); ctx.arc(gx, gy, g.w/2-7, 0, 7); ctx.fill();
    if(!g.dead){
      // 八根炮管（旋转）
      for(let k=0;k<8;k++){
        const ang = b.t*0.045 + k*Math.PI/4;
        const ex = gx + Math.cos(ang)*(g.w/2-1), ey = gy + Math.sin(ang)*(g.w/2-1);
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
        ctx.fillStyle="#1b2026"; ctx.fillRect(-10, -4, 14, 8);
        ctx.fillStyle="#39434e"; ctx.fillRect(-10, -4, 14, 2.6);
        ctx.fillStyle="#0b0e11"; ctx.fillRect(2, -3, 3, 6);
        if((g.t % 120 < 3 || (g.t % 120 > 57 && g.t % 120 < 63))){
          ctx.fillStyle="#ffe58a"; ctx.globalAlpha=.9;
          ctx.beginPath(); ctx.moveTo(4,-4); ctx.lineTo(13,-1); ctx.lineTo(4,2); ctx.closePath(); ctx.fill();
          ctx.globalAlpha=1;
        }
        ctx.restore();
      }
      // 中心红眼 + 装甲环
      ctx.strokeStyle="#6d7a89"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(gx, gy, g.w/2-10, 0, 7); ctx.stroke();
      const blink = (Math.floor(b.t/12)%2) ? "#ff5b3d" : "#7a1a10";
      ctx.fillStyle="#20272e"; ctx.beginPath(); ctx.arc(gx, gy, 9, 0, 7); ctx.fill();
      ctx.fillStyle=blink; ctx.beginPath(); ctx.arc(gx, gy, 6, 0, 7); ctx.fill();
      ctx.fillStyle="#ffe0c8"; ctx.beginPath(); ctx.arc(gx-1.6, gy-1.6, 2.2, 0, 7); ctx.fill();
    } else {
      // 废炮舱：焦黑破口 + 冒烟 + 火星
      ctx.fillStyle="#0e0f12";
      ctx.beginPath(); ctx.arc(gx-3, gy+2, 9, 0, 7); ctx.fill();
      ctx.fillStyle="#191c20";
      ctx.beginPath(); ctx.moveTo(gx-11,gy-6); ctx.lineTo(gx+10,gy-11); ctx.lineTo(gx+6,gy+3); ctx.closePath(); ctx.fill();
      for(let s=0;s<3;s++){
        const t2 = (perfNow/75 + s*12) % 36;
        ctx.globalAlpha = Math.max(0, .40 - t2*0.011);
        ctx.fillStyle="#6a6a72";
        ctx.beginPath(); ctx.arc(gx-6 + Math.sin(t2*0.3)*6, gy-16-t2*1.7, 5+t2*0.3, 0, 7); ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle="#ff7a3d"; ctx.beginPath(); ctx.arc(gx-4, gy+4, 2, 0, 7); ctx.fill();
    }
  }

  // ================= 特殊攻击：地面电弧波 / 激光扫射 / 厂房落锤 =================
  for(const s of (b.specials || [])){
    if(s.type === "arc"){
      const ax = s.x - cam, ay = s.gy;
      if(s.warn > 0){
        // ===== 蓄能预警：地面灼烧圈 + 电流火花 + 冲出方向箭头 =====
        const k = 1 - s.warn/50;                       // 0 → 1 越来越急
        ctx.globalAlpha = .30 + .35*Math.abs(Math.sin(s.t*0.7));
        ctx.fillStyle = "#ffb347";
        ctx.beginPath(); ctx.ellipse(ax, ay-3, 34 + k*16, 11 + k*5, 0, 0, 7); ctx.fill();
        ctx.globalAlpha = .85; ctx.fillStyle = "#ffe58a";
        ctx.beginPath(); ctx.ellipse(ax, ay-2, 18 + k*8, 6 + k*3, 0, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
        // 环绕电流（越接近冲出越亮）
        for(let k2=0;k2<5;k2++){
          const a = s.t*0.5 + k2*1.26;
          const rr = 20 - k*8;
          ctx.strokeStyle = "#fffbe0"; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(ax + Math.cos(a)*rr, ay-14 + Math.sin(a)*rr*0.5);
          ctx.lineTo(ax + Math.cos(a+0.9)*(rr+7), ay-14 + Math.sin(a+0.9)*(rr+7)*0.5);
          ctx.stroke();
        }
        // 冲出方向箭头（地面指示，提前告知往哪边窜）
        ctx.globalAlpha = .45 + .45*Math.abs(Math.sin(s.t*0.7));
        ctx.fillStyle = "#ff5b3d";
        for(let k3=0;k3<3;k3++){
          const bx = ax + s.dir*(44 + k3*22);
          ctx.beginPath();
          ctx.moveTo(bx + s.dir*9, ay-6);
          ctx.lineTo(bx - s.dir*4, ay-15);
          ctx.lineTo(bx - s.dir*4, ay+3);
          ctx.closePath(); ctx.fill();
        }
        ctx.globalAlpha = 1;
        continue;
      }
      // 地面灼烧光环 + 裂地辉光
      ctx.globalAlpha = .5; ctx.fillStyle = "#ffd76b";
      ctx.beginPath(); ctx.ellipse(ax, ay-2, 30, 9, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = .25; ctx.fillStyle = "#ff9b3d";
      ctx.beginPath(); ctx.ellipse(ax, ay-3, 52, 16, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      // 电弧主体：外橙光 + 内白芯（两遍描边，高度加大更醒目）
      for(const pass of [0,1]){
        ctx.strokeStyle = pass ? "#fffbe0" : "#ffb347";
        ctx.lineWidth = pass ? 4 : 11;
        ctx.globalAlpha = pass ? 1 : .4;
        ctx.beginPath(); ctx.moveTo(ax, ay);
        for(let k=1;k<=5;k++){
          const yy = ay - k*9.4, xx = ax + Math.sin(s.t*0.7 + k*2.3)*10;
          ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // 弧顶电球
      ctx.fillStyle = "#fff3a0";
      ctx.beginPath();
      ctx.arc(ax + Math.sin(s.t*0.7+11)*8, ay-48, 6.5 + Math.sin(s.t)*2, 0, 7);
      ctx.fill();
    } else if(s.type === "laser"){
      const ox = core.x - cam, oy = core.y + core.h*0.55;
      // 蓄力期：地面落点预警圈（告诉玩家激光会扫到哪）
      if(s.t <= 26){
        let ix = core.x, iy = core.y + core.h*0.55;
        for(let d = 26; d < 900; d += 10){
          const px = core.x - Math.cos(s.ang)*d, py = core.y + core.h*0.55 + Math.sin(s.ang)*d;
          const g2 = groundYAt(px);
          ix = px; iy = py;
          if(g2 < Infinity && py > g2 - 2){ iy = g2; break; }
        }
        ctx.globalAlpha = .30 + .40*Math.abs(Math.sin(s.t*0.55));
        ctx.strokeStyle="#ff3b1f"; ctx.lineWidth=2.6;
        ctx.beginPath(); ctx.ellipse(ix-cam, iy-3, 30, 9, 0, 0, 7); ctx.stroke();
        ctx.globalAlpha = .18 + .22*Math.abs(Math.sin(s.t*0.55));
        ctx.fillStyle="#ff5b3d";
        ctx.beginPath(); ctx.ellipse(ix-cam, iy-3, 30, 9, 0, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.save(); ctx.translate(ox, oy); ctx.rotate(-s.ang);
      if(s.t <= 26){
        // 蓄力：粗虚线预警 + 聚能球（给玩家反应时间）
        ctx.globalAlpha = .40 + .34*Math.abs(Math.sin(s.t*0.5));
        ctx.strokeStyle = "#ff5b3d"; ctx.lineWidth = 4;
        ctx.setLineDash([14, 10]);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-920,0); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = .95; ctx.fillStyle = "#fffbe0";
        ctx.beginPath(); ctx.arc(0, 0, 5 + s.t*0.40, 0, 7); ctx.fill();
        ctx.globalAlpha = .35; ctx.fillStyle = "#ffb347";
        ctx.beginPath(); ctx.arc(0, 0, 14 + s.t*0.55, 0, 7); ctx.fill();
      } else {
        const fade = Math.min(1, (26 + s.dur + 12 - s.t) / 12);
        ctx.globalAlpha = .26*fade; ctx.fillStyle = "#ff2d1a"; ctx.fillRect(-920, -24, 920, 48);
        ctx.globalAlpha = .72*fade; ctx.fillStyle = "#ff7a4d"; ctx.fillRect(-920, -12, 920, 24);
        ctx.globalAlpha = fade;     ctx.fillStyle = "#fffbe0"; ctx.fillRect(-920, -5, 920, 10);
        ctx.globalAlpha = .75*fade; ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(-920, 0, 15, 0, 7); ctx.fill();
      }
      ctx.restore(); ctx.globalAlpha = 1;
    } else if(s.type === "piston"){
      const px = s.x - cam, py = s.y;
      // 顶部导轨横梁
      ctx.fillStyle="#242c34"; ctx.fillRect(px-52, 0, 104, 15);
      ctx.fillStyle="#3c4752"; ctx.fillRect(px-52, 11, 104, 4);
      // 双液压杆
      const rodH = Math.max(0, py - 14);
      ctx.fillStyle="#4c5764"; ctx.fillRect(px-21, 14, 13, rodH); ctx.fillRect(px+8, 14, 13, rodH);
      ctx.fillStyle="#6f7d8c"; ctx.fillRect(px-19, 14, 4, rodH);  ctx.fillRect(px+10, 14, 4, rodH);
      // 锤头本体
      ctx.fillStyle="#2b333c"; ctx.fillRect(px-38, py, 76, 48);
      ctx.fillStyle="#414d59"; ctx.fillRect(px-34, py+4, 68, 11);
      ctx.fillStyle="#1b2128"; ctx.fillRect(px-38, py+41, 76, 7);
      ctx.fillStyle="#697585";
      for(let k=-28;k<=28;k+=14) ctx.fillRect(px+k, py+17, 3, 3);
      // 底面黄黑警示条
      ctx.fillStyle="#d8b23c"; ctx.fillRect(px-36, py+34, 72, 7);
      ctx.fillStyle="#1d2126";
      for(let k=-36;k<36;k+=12) ctx.fillRect(px+k, py+34, 5, 7);
      // 未落地：地面落点预警
      if(!s.hit){
        const gy2 = groundYAt(s.x);
        const fy = (gy2 === Infinity ? 440 : gy2);
        const blink = Math.floor(perfNow/110) % 2 === 0;
        ctx.globalAlpha = .30 + .30*Math.min(1, s.t/40);
        ctx.fillStyle = blink ? "#ff3b1f" : "#8a1c0c";
        ctx.beginPath(); ctx.ellipse(px, fy-4, 46, 12, 0, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---- 血条 / 状态 ----
  if(!b.dead){
    const alive = b.cannons.filter(g=>!g.dead).length;
    const bw = 360, bx = W/2-bw/2, by = 24;
    ctx.fillStyle="#000a"; ctx.fillRect(bx-4, by-4, bw+8, 26);
    ctx.fillStyle="#151a20"; ctx.fillRect(bx, by, bw, 18);
    const ratio = core.shielded ? alive/2 : Math.max(0, core.hp/core.maxHp);
    ctx.fillStyle = core.shielded ? "#5afff0" : (ratio > .35 ? "#ff5b3d" : "#ff2d1a");
    ctx.fillRect(bx+2, by+2, (bw-4)*ratio, 14);
    ctx.fillStyle="rgba(0,0,0,.45)";
    for(let s=1;s<12;s++) ctx.fillRect(bx + (bw/12)*s, by+2, 2, 14);
    ctx.fillStyle = core.shielded ? "#d8fffb" : "#ffd0b0";
    ctx.fillRect(bx+2, by+2, (bw-4)*ratio, 3);
    ctx.fillStyle="#fff"; ctx.font="bold 12px monospace"; ctx.textAlign="center";
    ctx.fillText(core.shielded
      ? "护 盾 力 场 — 先摧毁炮舱 (" + (2-alive) + "/2)"
      : "反 应 堆 核 心", W/2, by+34);
    ctx.textAlign="left";
  }
}
// 要塞瞭望台上的狙击兵（站 / 走位增援 / 阵亡倒计时三种状态）
function drawFortSniper(s, floorY){
  if(!s) return;
  const y = floorY, x = s.x - cam;
  if(s.st === "down"){
    // 阵亡：台上留下一顶尖盔和摔落的步枪，并显示增援倒计时
    ctx.fillStyle="#3c4a2b"; ctx.beginPath(); ctx.arc(x+6, y-6, 8, Math.PI, 0); ctx.fill();
    ctx.fillStyle="#2a3420"; ctx.fillRect(x-2, y-6, 16, 3);
    ctx.fillStyle="#232a2f"; ctx.fillRect(x-28, y-4, 26, 3.2);
    ctx.fillStyle="#39434a"; ctx.fillRect(x-6, y-5, 6, 2.4);
    if(s.respawnT > 0){
      ctx.globalAlpha = .85;
      ctx.fillStyle="#ff5b3d"; ctx.font="bold 10px monospace"; ctx.textAlign="center";
      ctx.fillText("增援 " + Math.ceil(s.respawnT/60) + "s", x, y-20);
      ctx.textAlign="left"; ctx.globalAlpha = 1;
    }
    return;
  }
  const walking = s.st === "walkin";
  const bob = walking ? Math.sin(s.animT*0.36)*1.6 : 0;
  const dir = s.face;
  // ---- 蓄势预警：红色瞄准激光直指主角 ----
  if(!walking && s.warn > 0 && !player.dead){
    const mx = s.x + dir*36 - cam, my = y - 26 + bob;
    const ex = player.x + player.w/2 - cam, ey = chestY();
    ctx.globalAlpha = .22 + .30*Math.abs(Math.sin(perfNow/70));
    ctx.strokeStyle = "#ff3b1f"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.globalAlpha = .95; ctx.fillStyle="#ff5b3d";
    ctx.beginPath(); ctx.arc(ex, ey, 3.4, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // ---- 身体（沿用旧版高塔狙击兵设计：迷彩作战服 + 钢盔护目镜 + 双手端长枪） ----
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(dir, 1);
  // 腿
  ctx.fillStyle="#2f3a26";
  if(walking){
    const lo = Math.sin(s.animT*0.36)*5;
    ctx.fillRect(-7, -16, 6, 16 + lo*0.5); ctx.fillRect(1, -16, 6, 16 - lo*0.5);
  } else { ctx.fillRect(-7, -16, 6, 16); ctx.fillRect(1, -16, 6, 16); }
  ctx.fillStyle="#191e1c"; ctx.fillRect(-8, -3.4, 8, 3.4); ctx.fillRect(0, -3.4, 8, 3.4);
  // 躯干：迷彩作战服 + 战术背心
  ctx.fillStyle="#55663a"; ctx.fillRect(-8, -30, 16, 16);
  ctx.fillStyle="#4a5a32"; ctx.fillRect(-8, -30, 16, 3);
  ctx.fillStyle="#2e3a22"; ctx.fillRect(-6, -26, 12, 9);
  ctx.fillStyle="#222b1c"; ctx.fillRect(-6, -22, 12, 2.4);
  // 头 + 护目镜
  ctx.fillStyle="#c9a17a"; ctx.fillRect(-5, -40, 10, 10);
  ctx.fillStyle="#8fa08c"; ctx.fillRect(-2, -36, 5, 2.6);
  // 钢盔（旧版样式）
  ctx.fillStyle="#3d4a26"; ctx.beginPath(); ctx.arc(0.5, -40, 8, Math.PI, 0); ctx.fill();
  ctx.fillRect(-8, -41, 17, 3);
  ctx.fillStyle="#2a3319"; ctx.fillRect(-8.4, -38.2, 17.4, 2);
  // 双手端着的长枪（固定端枪姿态，指向面朝方向）
  ctx.fillStyle="#20242a"; ctx.fillRect(2, -26, 30, 3.4);       // 枪身
  ctx.fillStyle="#3a424b"; ctx.fillRect(2, -26, 30, 1.2);       // 枪身高光
  ctx.fillStyle="#14171a"; ctx.fillRect(28, -27.4, 7, 2.6);     // 枪口制退器
  ctx.fillStyle="#2a2f36"; ctx.fillRect(8, -29.4, 9, 3.2);      // 瞄准镜
  ctx.fillStyle="#6ad0ff"; ctx.globalAlpha=.7; ctx.fillRect(15, -28.8, 2, 2); ctx.globalAlpha=1;
  // 前手托枪
  ctx.fillStyle="#55663a"; ctx.fillRect(4, -22.5, 9, 4);
  ctx.fillStyle="#c9a17a"; ctx.fillRect(10, -23.4, 4.4, 3.6);
  // 枪口焰
  if(s.flash > 0){
    ctx.globalAlpha = .95;
    ctx.fillStyle="#ffe58a";
    ctx.beginPath(); ctx.moveTo(35,-30.5); ctx.lineTo(52,-26.3); ctx.lineTo(35,-22); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#fffbe0"; ctx.beginPath(); ctx.arc(37,-26.3,5,0,7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
// 黑铁巨弹：漆黑的实心铁球（带旋转铆钉、滚动扬尘与投影）
function drawIronBalls(){
  for(const ball of ironBalls){
    const x = ball.x - cam, y = ball.y, r = ball.r;
    const gy = groundYAt(ball.x);
    if(gy < Infinity){
      const d = Math.max(0, Math.min(1, (gy - (y + r)) / 280));
      ctx.globalAlpha = 0.34 * (1 - d*0.6);
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.ellipse(x, gy-3, r*(1 - d*0.22), 6*(1 - d*0.22), 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 滚动时的热浪残影
    if(ball.rolling && Math.floor(perfNow/70)%2===0){
      ctx.globalAlpha = .16; ctx.fillStyle="#ff9b4d";
      ctx.beginPath(); ctx.arc(x - Math.sign(ball.vx)*r*1.4, y, r*0.92, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.save(); ctx.translate(x, y);
    const g = ctx.createRadialGradient(-r*0.35, -r*0.42, r*0.12, 0, 0, r*1.12);
    g.addColorStop(0, "#5c5c68"); g.addColorStop(.42, "#2a2a32"); g.addColorStop(1, "#07070b");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    // 随滚动旋转的焊缝 + 铆钉（一眼看出它在滚）
    ctx.save(); ctx.rotate(ball.spin);
    ctx.strokeStyle = "rgba(126,126,146,.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r*0.72, 0, 7); ctx.stroke();
    ctx.fillStyle = "#7b7b8e";
    for(let k=0;k<4;k++){
      const a = k*Math.PI/2 + Math.PI/4;
      ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.72, Math.sin(a)*r*0.72, 2.6, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "rgba(150,150,170,.32)"; ctx.fillRect(-r, -1.4, r*2, 2.8);
    ctx.restore();
    // 金属高光 + 边缘反光
    ctx.fillStyle = "rgba(232,232,255,.17)";
    ctx.beginPath(); ctx.arc(-r*0.36, -r*0.42, r*0.34, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(120,130,150,.45)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, r-1.2, 0.5, 2.6); ctx.stroke();
    if(ball.flash > 0){
      ctx.globalAlpha = ball.flash/6*0.6; ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}
// ============ 第五~八关 Boss：母舰核心 ============
function drawCarrierBoss(){
  const b = boss;
  const P = THEMES[b.tint] || THEMES.alien;
  const wx = b.wallX - cam;
  if(wx > W + 240) return;
  const core = b.core, cx = core.x - cam, cy = core.y;
  const pulse = 0.5 + 0.5*Math.sin(perfNow*0.003);
  const rage = b.phase === 2;

  // ---- 舱壁：装甲板 + 发光脉络 + 骨刺 ----
  ctx.fillStyle = P.wall0; ctx.fillRect(wx, 0, W - wx + 240, H);
  for(let sy = 0; sy < H; sy += 64){
    ctx.fillStyle = ((sy/64)|0) % 2 ? P.wall1 : P.wall0;
    ctx.fillRect(wx, sy, W - wx + 240, 62);
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(wx, sy+61, W - wx + 240, 3);
  }
  ctx.strokeStyle = P.vein; ctx.lineWidth = 2;
  for(let sy = 22; sy < H; sy += 64){
    ctx.beginPath();
    ctx.moveTo(wx, sy);
    for(let x = wx; x < W + 120; x += 44) ctx.lineTo(x, sy + Math.sin((x + perfNow*0.03)*0.02)*5);
    ctx.stroke();
  }
  ctx.fillStyle = P.spike;
  for(let sy = 26; sy < H; sy += 92){
    ctx.beginPath(); ctx.moveTo(wx, sy); ctx.lineTo(wx+30, sy+11); ctx.lineTo(wx, sy+24); ctx.closePath(); ctx.fill();
  }

  // ---- 舰体主结构（核心外围的重甲环）----
  ctx.fillStyle = P.wall1;
  ctx.beginPath(); ctx.ellipse(cx + 54, cy + core.h/2, 150, core.h*0.78, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = P.top; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(cx + 54, cy + core.h/2, 150, core.h*0.78, 0, 0, 6.283); ctx.stroke();
  // 环上的铆钉
  for(let k=0;k<12;k++){
    const a = k*Math.PI/6;
    ctx.fillStyle = P.rivet;
    ctx.fillRect(cx + 54 + Math.cos(a)*146 - 2, cy + core.h/2 + Math.sin(a)*core.h*0.76 - 2, 4, 4);
  }

  // ---- 核心：护盾 / 内核 ----
  if(!core.dead){
    const cxp = cx + core.w/2, cyp = cy + core.h/2;
    const rad = 62;
    // 内核光
    const g = ctx.createRadialGradient(cxp, cyp, 6, cxp, cyp, rad + 26);
    g.addColorStop(0, rage ? "#fff0f6" : "#f4ffff");
    g.addColorStop(.35, P.accent);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.55 + 0.35*pulse;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cxp, cyp, rad + 26, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
    // 内部机械虹膜
    ctx.fillStyle = "#0a0812";
    ctx.beginPath(); ctx.arc(cxp, cyp, rad*0.72, 0, 6.283); ctx.fill();
    ctx.fillStyle = rage ? "#ff5b8a" : P.accent;
    ctx.beginPath(); ctx.arc(cxp, cyp, rad*0.5 + Math.sin(perfNow*0.004)*3, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#0a0812";
    ctx.beginPath(); ctx.arc(cxp, cyp, rad*0.26, 0, 6.283); ctx.fill();
    ctx.strokeStyle = P.top; ctx.lineWidth = 3;
    for(let k=0;k<6;k++){
      const a = k*Math.PI/3 + perfNow*0.0008;
      ctx.beginPath();
      ctx.moveTo(cxp + Math.cos(a)*rad*0.3, cyp + Math.sin(a)*rad*0.3);
      ctx.lineTo(cxp + Math.cos(a)*rad*0.66, cyp + Math.sin(a)*rad*0.66);
      ctx.stroke();
    }
    // 护盾：六边形格纹罩
    if(core.shielded){
      ctx.globalAlpha = 0.16 + 0.10*pulse;
      ctx.fillStyle = P.accent;
      ctx.beginPath(); ctx.arc(cxp, cyp, rad + 24, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = P.accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cxp, cyp, rad + 24, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
      // 受击闪白
      if(core.flash > 0){
        ctx.globalAlpha = .3; ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(cxp, cyp, rad + 26, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  } else {
    // 核心被打爆：黑洞 + 余烬
    const cxp = cx + core.w/2, cyp = cy + core.h/2;
    ctx.fillStyle = "#05030a";
    ctx.beginPath(); ctx.arc(cxp, cyp, 68, 0, 6.283); ctx.fill();
    for(let k=0;k<10;k++){
      ctx.fillStyle = "rgba(255," + (90+k*10) + ",40," + (0.15 + 0.2*Math.sin(perfNow*0.01 + k)) + ")";
      ctx.fillRect(cxp - 30 + (k*13)%60, cyp - 30 + (k*23)%60, 3, 3);
    }
  }

  // ---- 节点荚：核心与舱壁之间的能量荚 ----
  for(const c of b.cannons){
    const ex = c.x - cam + c.w/2, ey = c.y + c.h/2;
    const charging = c.warnT > 0;
    const recoil = c.burst > 0 ? 1 : 0;
    // 连接管线（核心 ← 节点）
    ctx.strokeStyle = c.dead ? "rgba(60,40,40,.5)" : P.vein;
    ctx.lineWidth = c.dead ? 3 : 5;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.quadraticCurveTo(ex + 46, ey + Math.sin(perfNow*0.002 + c.idx)*10, cx + core.w/2, cy + core.h/2);
    ctx.stroke();
    if(c.dead){
      ctx.fillStyle = "#06040a";
      ctx.beginPath(); ctx.arc(ex, ey, 22, 0, 6.283); ctx.fill();
      ctx.strokeStyle = "#3a2028"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ex, ey, 22, 0, 6.283); ctx.stroke();
      for(let k=0;k<3;k++){
        ctx.fillStyle = "rgba(255,110,60," + (0.2 + 0.2*Math.sin(perfNow*0.01 + k)) + ")";
        ctx.fillRect(ex - 9 + k*8, ey - 3 + (k%2)*6, 3, 3);
      }
      continue;
    }
    // 外荚
    ctx.fillStyle = "#0b0a14";
    ctx.beginPath(); ctx.arc(ex, ey, 24 + recoil, 0, 6.283); ctx.fill();
    ctx.strokeStyle = charging ? "#ff2f14" : P.top; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ex, ey, 24 + recoil, 0, 6.283); ctx.stroke();
    // 内核（蓄力时收缩成红点）
    const r2 = charging ? 6 + c.warnT*0.25 : 13 + Math.sin(perfNow*0.005 + c.idx)*1.6;
    const gg = ctx.createRadialGradient(ex, ey, 1, ex, ey, r2 + 8);
    gg.addColorStop(0, charging ? "#fff2ea" : "#ffffff");
    gg.addColorStop(.5, charging ? "#ff2f14" : P.accent);
    gg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(ex, ey, r2 + 8, 0, 6.283); ctx.fill();
    // 预警时向主角方向探出细瞄准线
    if(charging){
      ctx.globalAlpha = .5;
      ctx.strokeStyle = "#ff2f14"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(ex, ey);
      ctx.lineTo(ex + Math.cos(c.gunA)*460, ey + Math.sin(c.gunA)*460);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---- 主题杀招的视觉 ----
  for(const s of b.specials){
    if(s.type === "bolt"){
      const gy = groundYAt(s.x);
      const floor = gy < Infinity ? gy : GROUND_Y;
      const sx = s.x - cam;
      if(s.warn > 0){
        const k = 1 - s.warn/44;
        ctx.globalAlpha = .18 + .4*k;
        ctx.fillStyle = "#8fe6ff";
        ctx.fillRect(sx - 22, 0, 44, floor);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "#d8faff"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(sx, floor - 2, 34 + Math.sin(perfNow*0.01)*6, 9, 0, 0, 6.283); ctx.stroke();
      } else if(s.beam > 0){
        ctx.globalAlpha = .9;
        ctx.fillStyle = "#eafcff";
        ctx.fillRect(sx - 14, 0, 28, floor);
        ctx.globalAlpha = .5;
        ctx.fillStyle = "#5cd8ff";
        ctx.fillRect(sx - 34, 0, 68, floor);
        ctx.globalAlpha = 1;
      }
    } else if(s.type === "spike"){
      const gy = groundYAt(s.x);
      const floor = gy < Infinity ? gy : GROUND_Y;
      const sx = s.x - cam;
      if(s.warn > 0){
        ctx.globalAlpha = .25 + .35*Math.abs(Math.sin(perfNow*0.02));
        ctx.fillStyle = "#ff2f14";
        ctx.beginPath(); ctx.ellipse(sx, floor - 2, 30, 8, 0, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
      } else if(s.up > 0){
        const h = 100*s.up;
        ctx.fillStyle = "#6b4a24";
        for(let k=-1;k<=1;k++){
          ctx.beginPath();
          ctx.moveTo(sx + k*15 - 9, floor);
          ctx.lineTo(sx + k*15, floor - h*(1 - Math.abs(k)*0.28));
          ctx.lineTo(sx + k*15 + 9, floor);
          ctx.closePath(); ctx.fill();
        }
        ctx.strokeStyle = "#ffc85c"; ctx.lineWidth = 2; ctx.stroke();
      }
    } else if(s.type === "ice"){
      const sx = s.x - cam;
      if(s.warn > 0){
        const gy = groundYAt(s.x);
        const floor = gy < Infinity ? gy : GROUND_Y;
        ctx.globalAlpha = .3 + .35*Math.abs(Math.sin(perfNow*0.02));
        ctx.strokeStyle = "#bfe9ff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(sx, floor - 2, 26, 7, 0, 0, 6.283); ctx.stroke();
        ctx.globalAlpha = 1;
      } else if(!s.dead){
        ctx.fillStyle = "#d8f7ff";
        ctx.beginPath();
        ctx.moveTo(sx, s.y - 26); ctx.lineTo(sx + 13, s.y + 8); ctx.lineTo(sx, s.y + 22);
        ctx.lineTo(sx - 13, s.y + 8); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#7fc8e0"; ctx.lineWidth = 2; ctx.stroke();
      }
    } else if(s.type === "rail"){
      const sy = core.y + core.h/2;
      if(s.warn > 0){
        const k = 1 - s.warn/56;
        ctx.globalAlpha = .18 + .5*k;
        ctx.strokeStyle = "#ff7ad0"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, s.y1); ctx.lineTo(0, s.y1); ctx.stroke();
        ctx.globalAlpha = .3 + .4*k;
        const g = ctx.createRadialGradient(cx, sy, 4, cx, sy, 90);
        g.addColorStop(0,"#ffffff"); g.addColorStop(.4,"#ff7ad0"); g.addColorStop(1,"rgba(255,122,208,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, sy, 90, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
      } else if(s.fire > 0){
        const k = 1 - s.fire/84;
        const y = s.y0 + (s.y1 - s.y0)*Math.min(1, k*1.35);
        ctx.globalAlpha = .95;
        ctx.fillStyle = "#fff2fb";
        ctx.fillRect(0, y - 9, cx, 18);
        ctx.globalAlpha = .5;
        ctx.fillStyle = "#ff7ad0";
        ctx.fillRect(0, y - 26, cx, 52);
        ctx.globalAlpha = 1;
      }
    }
  }

  // 二阶段：舱壁渗出的红光
  if(rage){
    ctx.globalAlpha = .10 + .07*Math.sin(perfNow*0.005);
    ctx.fillStyle = "#ff2f14";
    ctx.fillRect(wx, 0, W - wx + 240, H);
    ctx.globalAlpha = 1;
  }

  // ===== 血条 / 节点状态 =====
  if(!b.dead){
    const alive = b.cannons.filter(c => !c.dead).length;
    const bw = 520, bx = W/2 - bw/2, by = 86;
    ctx.fillStyle = "#000a"; ctx.fillRect(bx-4, by-24, bw+8, 32);
    ctx.fillStyle = "#20172c"; ctx.fillRect(bx, by, bw, 14);
    const k = Math.max(0, core.hp / core.maxHp);
    const hg = ctx.createLinearGradient(bx, 0, bx+bw, 0);
    hg.addColorStop(0, P.accent); hg.addColorStop(1, rage ? "#ff2f14" : "#ffb347");
    ctx.fillStyle = hg; ctx.fillRect(bx, by, bw*k, 14);
    ctx.fillStyle = "#e8f4ff"; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
    ctx.fillText(core.shielded
      ? b.name + " · 先打掉能量节点 (" + alive + "/" + b.cannons.length + ")"
      : b.name + " · 核心暴露！" + (rage ? " · 狂暴" : ""), W/2, by - 8);
    ctx.textAlign = "left";
    // 节点状态灯
    for(let i=0;i<b.cannons.length;i++){
      const c = b.cannons[i];
      ctx.fillStyle = c.dead ? "#3a2a52" : P.accent;
      ctx.beginPath(); ctx.arc(bx + i*16, by + 24, 4.5, 0, 6.283); ctx.fill();
    }
  }
}
function drawBoss(){

  if(boss.kind === "reactor") return drawReactor();
  if(boss.kind === "alien")   return drawAlienBoss();
  if(boss.kind === "carrier") return drawCarrierBoss();

  if(wx > W + 100) return;

  const dmg = 1 - core.hp/core.maxHp;

  ctx.fillStyle="#3f3a36"; ctx.fillRect(wx, 0, wallW, GROUND_Y);

    ctx.fillStyle = ((sy/76)|0)%2 ? "#463f3a" : "#3a3531";

  for(let px=wx; px<wx+wallW; px+=96) ctx.fillRect(px, 0, 3, GROUND_Y);

  ctx.fillStyle="#565049"; ctx.fillRect(wx, 86, wallW, 12);
  ctx.fillStyle="#6b645c"; ctx.fillRect(wx, 86, wallW, 3);
  ctx.fillStyle="#565049"; ctx.fillRect(wx, 318, wallW, 12);
  ctx.fillStyle="#6b645c"; ctx.fillRect(wx, 318, wallW, 3);
  ctx.fillStyle="#8a8177";
  for(let px=wx+14; px<wx+wallW; px+=36){
    ctx.fillRect(px, 90, 5, 5); ctx.fillRect(px, 322, 5, 5);
  }
  // 通风百叶（左侧墙面细节）
  for(let k=0;k<2;k++){
    const vx = wx + 92 + k*54, vy = 150;
    ctx.fillStyle="#23272b"; ctx.fillRect(vx, vy, 40, 46);
    ctx.fillStyle="#4d565e";
    for(let s=0;s<6;s++) ctx.fillRect(vx+3, vy+4+s*7, 34, 3.4);

  }
  // 顶部探照灯 + 光锥（朝主角方向扫）
  const lampX = wx + 44, lampY = 28;
  const la = Math.atan2(chestY()-lampY, (player.x - cam + player.w/2) - lampX);
  ctx.save(); ctx.translate(lampX, lampY); ctx.rotate(Math.max(0.55, Math.min(1.4, la)));
  ctx.globalAlpha=.08; ctx.fillStyle="#ffeaa0";
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(340,-70); ctx.lineTo(340,90); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle="#2b2f34"; ctx.fillRect(-8,-9,18,18);
  ctx.fillStyle="#ffeaa0"; ctx.fillRect(8,-7,4,14);
  ctx.restore();
  // 顶部警示灯排
  for(let px=wx+10; px<wx+wallW; px+=58){
    const on = Math.floor((perfNow/400) + px/58) % 2 === 0;
    ctx.fillStyle = on ? "#ff3b1f" : "#4a1004";
    ctx.fillRect(px, 8, 10, 6);
  }
  // 铁蒺藜网（墙根）
  ctx.strokeStyle="#6d6a63"; ctx.lineWidth=1.6;
  for(let px=wx; px<wx+wallW; px+=34){
    ctx.beginPath();
    ctx.arc(px+12, GROUND_Y-14, 12, Math.PI*0.15, Math.PI*0.85, true);
    ctx.stroke();
  }

  // ================= 高处瞭望台（悬挑装甲栈台 + 狙击兵驻守） =================
  const twX = wx - 190, twY = 150, twW = 262;
  // 悬挑斜撑
  ctx.strokeStyle="#2b3138"; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(twX+42, twY+12); ctx.lineTo(twX+120, twY+108); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(twX+twW-10, twY+12); ctx.lineTo(twX+twW-70, twY+108); ctx.stroke();
  ctx.strokeStyle="#454e58"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(twX+42, twY+13); ctx.lineTo(twX+120, twY+108); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(twX+twW-10, twY+13); ctx.lineTo(twX+twW-70, twY+108); ctx.stroke();
  // 台底桁架 + 台面钢板
  ctx.fillStyle="#20262c"; ctx.fillRect(twX, twY+18, twW, 5);
  ctx.fillStyle="#31383f"; ctx.fillRect(twX, twY+6, twW, 13);
  ctx.fillStyle="#4b545e"; ctx.fillRect(twX, twY, twW, 7);
  ctx.fillStyle="#5f6a76"; ctx.fillRect(twX, twY, twW, 2);
  ctx.fillStyle="#242a30";
  for(let s=4; s<twW-4; s+=11) ctx.fillRect(twX+s, twY+9, 6, 2);
  // 悬挑端警示灯
  ctx.fillStyle = Math.floor(perfNow/380)%2===0 ? "#ff3b1f" : "#4a1004";
  ctx.fillRect(twX+3, twY-7, 6, 5);
  // 右侧爬梯（从台面下到墙里）
  ctx.fillStyle="#2d343b";
  ctx.fillRect(twX+twW-26, twY+24, 3, GROUND_Y-twY-24);

  ctx.fillStyle="#7a7054";
  for(let s=6; s<88; s+=22){ ctx.fillRect(twX+s, twY-11, 20, 3); }

  // ================= 中央大门（核心） =================
  // 门洞（背后是黑）
  ctx.fillStyle="#0c0e10"; ctx.fillRect(cx-6, cy-10, core.w+12, core.h+10);
  // 门被摧毁后：门后透出通路光
  if(core.dead){

  }
  // 两扇钢制大门（核心毁坏后向两侧滑开）
  const doorW = core.w/2, slide = core.dead ? doorW*0.95 : 0;
  const door=(dx)=>{
    ctx.fillStyle="#4b535c"; ctx.fillRect(dx, cy, doorW, core.h);
    ctx.fillStyle="#5d6773"; ctx.fillRect(dx, cy, doorW, 7);
    ctx.fillStyle="#2f363d";
    for(let sy=cy+14; sy<cy+core.h; sy+=22) ctx.fillRect(dx, sy, doorW, 3);
    // 斜向加强筋
    ctx.strokeStyle="#39414a"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(dx+3, cy+8); ctx.lineTo(dx+doorW-3, cy+core.h-6); ctx.stroke();

    ctx.save(); ctx.beginPath(); ctx.rect(dx, cy+core.h-20, doorW, 20); ctx.clip();
    ctx.fillStyle="#e8c24a"; ctx.fillRect(dx, cy+core.h-20, doorW, 20);
    ctx.fillStyle="#22262a";
    for(let s=-20; s<doorW+20; s+=16){

  };
  door(cx - slide);
  door(cx + doorW + slide);
  // 门框（角钢 + 铆钉 + 警示漆）
  ctx.fillStyle="#33383f";
  ctx.fillRect(cx-24, cy-34, 24, core.h+34);
  ctx.fillRect(cx+core.w, cy-34, 24, core.h+34);
  ctx.fillRect(cx-24, cy-34, core.w+48, 24);
  ctx.fillStyle="#4a515a";
  ctx.fillRect(cx-22, cy-32, 20, core.h+30);
  ctx.fillRect(cx+core.w+2, cy-32, 20, core.h+30);
  ctx.fillRect(cx-22, cy-32, core.w+44, 20);
  ctx.fillStyle="#e8c24a"; ctx.fillRect(cx-22, cy-32, core.w+44, 5);
  ctx.fillStyle="#22262a";
  for(let s=0; s<core.w+44; s+=18) ctx.fillRect(cx-22+s, cy-32, 9, 5);
  // 门框铆钉
  ctx.fillStyle="#7b828b";
  for(let sy=cy-24; sy<cy+core.h; sy+=26){
    ctx.fillRect(cx-18, sy, 4, 4); ctx.fillRect(cx+core.w+14, sy, 4, 4);

  if(!core.dead){
    // ---- 核心反应眼：多层同心环 + 四爪压环 + 脉冲 ----

    const pulse = 0.5 + 0.5*Math.sin(perfNow/180);
    // 外壳
    ctx.fillStyle="#20252a"; ctx.beginPath(); ctx.arc(ex, ey, 30, 0, 7); ctx.fill();
    ctx.fillStyle="#3c444d"; ctx.beginPath(); ctx.arc(ex, ey, 26, 0, 7); ctx.fill();
    // 四爪压环
    ctx.fillStyle="#5a636d";
    for(let k=0;k<4;k++){
      const a = k*Math.PI/2 + Math.PI/4;
      ctx.save(); ctx.translate(ex+Math.cos(a)*27, ey+Math.sin(a)*27); ctx.rotate(a);
      ctx.fillRect(-4, -6, 12, 12); ctx.restore();
    }
    // 发光核心
    const eg = ctx.createRadialGradient(ex-4, ey-5, 2, ex, ey, 22);
    eg.addColorStop(0, "#fffbe6");
    eg.addColorStop(.42, pulse>.5 ? "#ff9b4d" : "#ff6a3d");
    eg.addColorStop(1, "#6a1204");
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(ex, ey, 21, 0, 7); ctx.fill();
    // 能量环
    ctx.strokeStyle="rgba(255,220,150,.85)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(ex, ey, 15 + pulse*3, perfNow/420, perfNow/420 + 4.2); ctx.stroke();

    ctx.fillStyle="rgba(255,255,235,.8)";
    ctx.fillRect(ex-1.6, ey-12, 3.2, 24);
  }
  // 受损：裂缝与火星

  // ================= 上下两座火炮 =================
  for(const g of b.cannons){
