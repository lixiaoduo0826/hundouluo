function fit(){
  const s = Math.min(window.innerWidth / W, (window.innerHeight - 40) / H, 1.2);
  cvs.style.width  = (W * s) + "px";
  cvs.style.height = (H * s) + "px";
}

// ---------- 音效（WebAudio 简易合成） ----------
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function sfx(freq, dur, type="square", vol=0.08, slide=0){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), a.currentTime+dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}

    if(userBgm){

    } else {
      this.timer = setInterval(()=>this.tick(), 168); // ~178 BPM 八分音符

  },
  stop(){ this.on=false; if(this.timer){ clearInterval(this.timer); this.timer=null; }
          if(userBgm){ userBgm.pause(); try{ userBgm.currentTime = 0; }catch(e){} } },
  tick(){
    if(!this.on || this.muted) { this.step++; return; }
    const i = this.step % 64;
    const L = this.lead[i], B = this.bass[i];
    if(L) sfx(midi(L), .16, "square", .04);

    if(i%8===4) sfx(180, .06, "sawtooth", .05);   // 低音鼓点
    this.step++;
  }
};

  player.face = dir;
  player.aimLatch = 90;
  player.aimAng = -0.61;
  tryShoot(true);
}

  }

// ---------- 工具 ----------
const aabb = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
// 玩家受击碰撞盒：站立时为全身；蹲下/滑铲时压低到下半身（子弹从头顶飞过）
function hitbox(){
  const p = player;
  if(p.slideT > 0) return {x:p.x-6, y:p.y+24, w:p.w+12, h:p.h-24};
  return p.crouch ? {x:p.x, y:p.y+22, w:p.w, h:p.h-22} : {x:p.x, y:p.y, w:p.w, h:p.h};
}
// 敌方瞄准点：固定瞄准站立时的胸口高度——蹲下即可让子弹从头顶飞过
function chestY(){ return player.y + 14; }
function explode(x,y,color,n=10,spd=4){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=Math.random()*spd+1;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:20+Math.random()*20,color});
  }
}

// ---------- 更新逻辑 ----------
// 直升机位置（开场索降演出）
function heliPos(t){
  let x, y=110;
  if(t<90){ const k=t/90; x = (W+150) - (W+150-270)*(1-Math.pow(1-k,2)); }
  else if(t<270){ x=270; }
  else { x = 270 + (t-270)*(t-270)*0.35; y = 110 - (t-270)*0.25; }
  return {x,y};
}
function update(){
  // ----- 开场：直升机索降插入 -----
  if(state==="insert"){
    stateTimer++;
    const t = stateTimer, hp2 = heliPos(t);
    const ground38 = groundYAt(260) - 38;
    player.crouch=false; player.vx=0; player.vy=0; player.face=1; player.inv=0;
    if(t<110){          // 挂在直升机下随其飞入
      player.x = hp2.x - 4; player.y = hp2.y + 26;
    } else if(t<235){   // 沿绳索滑降（先慢后快）
      const k=(t-110)/125;
      player.x = 259;
      player.y = (hp2.y+26) + (ground38-(hp2.y+26))*k*k;
    } else {            // 落地
      player.x = 259; player.y = ground38; player.onGround = true;
    }
    if(t>=335){ state="play"; stateTimer=0; BGM.start(); }
    if(shake>0)shake--;
    return;
  }
  if(state!=="play" && state!=="walkin"){ stateTimer++; if(shake>0)shake--; return; }
  // ----- 通关后自动走进要塞大门 -----
  if(state==="walkin"){
    keys["ArrowRight"]=true; keys["Digit1"]=false; keys["Digit2"]=false;
  }
  if(shake>0)shake--;
  if(bannerT>0) bannerT--;
  const p = player;
  p.animT++;
  if(p.inv>0) p.inv--;
  const spd = 3.2;
  // 蹲下：仅地面可蹲，蹲下时不能移动
  p.crouch = !!(kDown() && p.onGround) || p.slideT > 0;
  if(p.slideCd > 0) p.slideCd--;
  p.vx = 0;
  if(p.crouch){
    // ----- 滑铲：地面蹲下时按 ← / → 触发 -----
    if(p.slideT > 0){
      const dir = p.slideDir;
      const gyNow   = groundYAt(p.x + p.w/2);
      const gyAhead = groundYAt(p.x + p.w/2 + dir*34);
      let slope = 0;
      if(gyNow < Infinity && gyAhead < Infinity) slope = gyAhead - gyNow; // >0 前方更低=下坡
      // 上坡阻力大（滑距≈平地一半）；下坡几乎无阻力且顺坡加速，可以一路滑到坡底
      let fric = 0.26, acc = 0;
      if(slope > 3){ fric = 0.07; acc = 0.13; }
      else if(slope < -3){ fric = 0.26; acc = -0.30; }
      p.slideV += acc - fric;
      p.slideAge = (p.slideAge||0) + 1;
      if(!p.onGround || p.slideV < 1.3 || p.slideAge > 110) p.slideT = 0;
      else {
        p.vx = dir * p.slideV; p.face = dir; p.slideT--;
        // 长下坡：滑势未衰就继续滑（不刷时间上限，但有 slideAge 兜底）
        if(slope > 3 && p.slideV > 3.2 && p.slideT < 6) p.slideT = 6;
      }
      if(p.slideT === 0) p.slideCd = 20;       // 铲完稍作停顿，不能连按刷距离
    } else if(p.onGround && p.slideCd <= 0 && ((kLeft() && !p.prevL) || (kRight() && !p.prevR))){
      // 起铲（需重新按方向键触发，按住不放不会连铲）
      p.slideDir = kLeft() ? -1 : 1;
      p.slideV = 8.4; p.slideT = 34; p.slideAge = 0; p.face = p.slideDir;
      p.vx = p.slideDir * p.slideV;
      sfx(220,.18,"sawtooth",.05,-120);
      for(let i=0;i<6;i++) particles.push({x:p.x+p.w/2-p.slideDir*8, y:p.y+p.h-4,
        vx:-p.slideDir*(1+Math.random()*1.6), vy:-Math.random()*1.4, life:16, color:"#c9c2a8"});
    }
  }
  if(!p.crouch && p.slideT<=0){
    if(kLeft()) { p.vx=-spd; p.face=-1; }
    if(kRight()){ p.vx= spd; p.face= 1; }
  }
  p.prevL = kLeft(); p.prevR = kRight();
  // 跳跃（恢复原版手感：跳得高、滞空长）
  if(kJumpDown() && p.onGround && p.slideT<=0){ p.vy=-12.6; p.onGround=false; S.jump(); }
  p.vy += 0.55; if(p.vy>14)p.vy=14;
  p.x += p.vx; p.y += p.vy;
  p.x = Math.max(0, Math.min(p.x, LEVEL_W - p.w));
  // Boss 墙体：战斗中挡在墙前（通关演出时允许跨过门槛进门）
  if(state === "play" && boss && boss.wallX && p.x + p.w > boss.wallX) p.x = boss.wallX - p.w;

  // 木箱：水平阻挡（跳到箱顶上方则不阻挡，可站上去当掩体）
  for(const c of crates){
    if(c.dead) continue;
    if(aabb(p,c) && p.y + p.h > c.y + 8){
      p.x = (p.x + p.w/2 < c.x + c.w/2) ? c.x - p.w : c.x + c.w;
    }
  }

  // 平台 / 坡面地形碰撞（扫掠式：上一帧脚在表面上方、这一帧越过即落地；走路时贴合坡面）
  let landed = false;
  const feetPrev = p.y + p.h - p.vy;
  // 脚部碰撞区间：脚的任何一部分踩到支撑面都算站立（放宽接触判定）
  const footL = p.x + 2, footR = p.x + p.w - 2;
  if(p.vy >= 0){
    for(const pl of platforms.concat(crates)){
      if(pl.dead) continue;
      if(footR > pl.x && footL < pl.x + pl.w &&
         feetPrev <= pl.y + 2 && p.y + p.h >= pl.y){
        p.y = pl.y - p.h; p.vy = 0; landed = true; break;
      }
    }
    if(!landed){
      const gy = groundYAt(p.x + p.w/2);
      if(gy < Infinity){
        const feet = p.y + p.h;
        if((feetPrev <= gy + 2 && feet >= gy) ||
           (p.onGround && feet >= gy - 1 && feet <= gy + 14)){ // 贴地走坡
          p.y = gy - p.h; p.vy = 0; landed = true;
        }
      }
    }
  }
  p.onGround = landed;

  // 掉进水坑 / 掉出屏幕
  if(p.y > H + 60){ hurtPlayer(true); }

  // 瞄准方向：↑ 按住或 1.5 秒内按过（锁定），单 ↑ 正上，配合方向键斜上 35°
  // 锁定机制可避开部分键盘"三键同按冲突"：先点一下 ↑，再按住 方向 + 1 即可斜射
  if(kUp()) p.aimLatch = 90;
  else if(p.aimLatch > 0) p.aimLatch--;
  const aimingUp = p.aimLatch > 0 && !p.crouch;
  const movingH = kLeft() || kRight();
  p.aimAng = aimingUp ? (movingH ? -0.61 : -Math.PI/2) : 0;
  // 空中按住 ↓：枪口朝正下方（可对脚下开火，带朝下瞄准动画）
  if(!p.onGround && kDown()) p.aimAng = Math.PI/2;

  // 射击（数字 1 键；一键斜射走 tryShoot 强制通道）
  if(p.fireCd>0) p.fireCd--;
  if(kShoot() && p.slideT<=0) tryShoot(false);   // 滑铲中不能开火

  // 道具拾取：同类武器包 = 升级（最高 Lv2），不同类 = 换枪
  for(const pu of powerups){
    pu.bob += 0.08;
    if(!pu.taken && aabb(p, {x:pu.x,y:pu.y+Math.sin(pu.bob)*5,w:pu.w,h:pu.h})){
      pu.taken = true; score += 500; S.power();
      explode(pu.x+17, pu.y+13, "#ffd34d", 14, 3);
      if(p.weapon === pu.type){
        const lv = Math.min(2, (p.wlv[pu.type]||0) + 1);
        p.wlv[pu.type] = lv;
        score += 500 * lv; // 升级奖励更高
        explode(p.x+p.w/2, p.y+10, "#5afff0", 20, 5);
      } else {
        p.weapon = pu.type;
      }
    }
  }

  // 勋章拾取：+1 条命
  for(const m of medals){
    m.bob += 0.06;
    if(!m.taken && aabb(p, {x:m.x, y:m.y+Math.sin(m.bob)*5, w:26, h:26})){
      m.taken = true; lives++; score += 300; S.power();
      explode(m.x+13, m.y+13, "#ffd34d", 18, 4);
    }
  }

  // ----- 相机 -----
  const targetCam = Math.max(0, Math.min(p.x - W*0.38, LEVEL_W - W));
  cam = boss.active ? Math.min(cam+6, LEVEL_W - W) : cam + (targetCam - cam)*0.12;

  // ----- 触发生成（通关演出阶段不再刷兵）-----
  if(state==="play"){
  for(let i=0;i<triggers.length;i++){
    const t = triggers[i];
    if(!usedTriggers.has(i) && cam + W*0.85 > t.x){
      usedTriggers.add(i);
      if(t.type==="runner") spawnRunner();
      if(t.type==="bomber"){
        const by = groundYAt(cam+W+40);
        enemies.push(makeSoldier(cam+W+40, by<Infinity ? by-40 : 300, "bomber"));
      }
      if(t.type==="sniper"){
        // 狙击手按地形坡面高度落位（杜绝浮空）
        const gy = groundYAt(t.px);
        enemies.push(makeSoldier(t.px, gy<Infinity ? gy-40 : 300, "sniper"));
      }
      if(t.type==="turret"){
        // 炮台同样按坡面高度落位
        const gy = groundYAt(t.px);
        enemies.push(makeTurret(t.px, gy<Infinity ? gy-40 : 300, t.sp));
      }
      if(t.type==="trencher" || t.type==="towerSniper" || t.type==="camper"){
        enemies.push(makeFort(t.px, t.type==="towerSniper" ? "tower" : t.type));
      }
      if(t.type==="drone") enemies.push(makeDrone(t.px, t.py));
    }
  }
  }

  // 自动补兵
  if(state==="play"){
    autoSpawnT++;
    if(autoSpawnT > 150 && enemies.filter(e=>e.kind==="soldier"&&e.mode==="runner").length < 3){
      autoSpawnT = 0; spawnRunner();
    }
  }

  // ----- 敌人 -----
  for(const e of enemies){
    if(e.kind==="turret"){
      e.cd--;
      const dx = (p.x+p.w/2) - (e.x+e.w/2), dy = chestY() - (e.y+8);
      if(e.sp){
        // 特殊炮台：单发瞄准、节奏慢、无散射
        if(!e.dead && Math.abs(dx)<560 && e.cd<=0){
          e.cd = 170;
          const d = Math.hypot(dx,dy)||1;
          ebullets.push({x:e.x+e.w/2, y:e.y+8, w:7, h:7, vx:dx/d*4.2, vy:dy/d*4.2, life:160});
          S.shoot();
        }
      } else {
        if(!e.dead && Math.abs(dx)<560 && e.cd<=0){
          e.cd = 130; e.burst = 3;
        }
        if(e.burst>0){
          e.bt = (e.bt||0)+1;
          if(e.bt%18===1){
            // 三连单发瞄准（无散射），一轮只打 3 发
            const d = Math.hypot(dx,dy)||1;
            ebullets.push({x:e.x+e.w/2, y:e.y+8, w:7, h:7, vx:dx/d*4.8, vy:dy/d*4.8, life:160});
            S.shoot(); e.burst--;
          }
        }
      }
    } else if(e.kind==="drone"){
      // 巡逻无人机：在玩家上方漂移悬停，周期性单发瞄准射击
      e.t = (e.t||0) + 1; e.animT += 0.5;
      const homeX = p.x + e.side*150;
      e.x += (homeX - e.x) * 0.010;
      e.y = e.baseY + Math.sin(e.t*0.035)*24;
      e.cd--;
      if(!e.dead && e.cd<=0 && Math.abs((p.x+p.w/2)-(e.x+e.w/2))<540){
        e.cd = 95;
        const dx=(p.x+p.w/2)-(e.x+e.w/2), dy=chestY()-(e.y+e.h-4), d=Math.hypot(dx,dy)||1;
        ebullets.push({x:e.x+e.w/2, y:e.y+e.h-4, w:7, h:7, vx:dx/d*4.6, vy:dy/d*4.6, life:180});
        S.shoot();
      }
    } else if(e.kind==="fort"){ // 工事类：战壕兵 / 高塔狙击 / 草丛伏兵
      e.t++;
      if(e.mode==="trencher"){
        // 周期性抬头射击再蹲下；蹲下时不可被击中
        e.cd--;
        if(e.cd<=0){ e.up = 120; e.cd = 250 + Math.random()*60; }
        if(e.up>0){
          e.up--;
          if(e.up===105 || e.up===65){
            const dx=(p.x+p.w/2)-(e.x+26), dy=chestY()-(e.y-24), d=Math.hypot(dx,dy)||1;
            ebullets.push({x:e.x+26, y:e.y-20, w:6, h:6, vx:dx/d*4.6, vy:dy/d*4.6, life:160});
            S.shoot();
          }
        }
      } else if(e.mode==="tower"){
        // 高处狙击：射程更远、弹速更快
        e.cd--;
        if(!e.dead && e.cd<=0 && Math.abs(p.x-e.x)<720){
          e.cd = 140;
          const dx=(p.x+p.w/2)-(e.x+23), dy=chestY()-(e.y-170), d=Math.hypot(dx,dy)||1;
          ebullets.push({x:e.x+23, y:e.y-170, w:6, h:6, vx:dx/d*5.4, vy:dy/d*5.4, life:200});
          S.shoot();
        }
      } else { // camper：藏在草丛，玩家靠近才现身开火
        if(!e.revealed && Math.abs((p.x+p.w/2)-(e.x+20))<240){ e.revealed = true; e.cd = 30; }
        if(e.revealed){
          e.cd--;
          if(e.cd<=0){
            e.cd = 110;
            const dx=(p.x+p.w/2)-(e.x+20), dy=chestY()-(e.y-30), d=Math.hypot(dx,dy)||1;
            ebullets.push({x:e.x+20, y:e.y-30, w:6, h:6, vx:dx/d*4.8, vy:dy/d*4.8, life:160});
            S.shoot();
          }
        }
      }
    } else { // soldier
      if(e.mode==="sniper"){
        // 狙击手不移动，但同样受重力，确保始终贴在支撑面上
        const feetPrevS = e.y + e.h;
        e.vy = Math.min(e.vy + 0.55, 14); e.y += e.vy;
        if(e.vy >= 0){
          const footL = e.x + 2, footR = e.x + e.w - 2;
          for(const pl of platforms.concat(crates)){
            if(pl.dead) continue;
            if(footR > pl.x && footL < pl.x + pl.w &&
               feetPrevS <= pl.y + 2 && e.y + e.h >= pl.y){ e.y = pl.y - e.h; e.vy = 0; break; }
          }
          if(e.vy > 0){
            const gy = groundYAt(e.x + e.w/2);
            if(gy < Infinity && feetPrevS <= gy + 2 && e.y + e.h >= gy){
              e.y = gy - e.h; e.vy = 0;
            }
          }
        }
        e.cd--;
        if(!e.dead && e.cd<=0){
          e.cd = 110;
          const dx=(p.x+p.w/2)-(e.x+e.w/2), dy=chestY()-(e.y+10), d=Math.hypot(dx,dy)||1;
          ebullets.push({x:e.x+e.w/2,y:e.y+10,w:6,h:6,vx:dx/d*4.6,vy:dy/d*4.6,life:160});
          S.shoot();
        }
      } else { // runner / bomber：冲向玩家
        const dir = p.x > e.x ? 1 : -1;
        e.vx = dir * (e.mode==="bomber" ? 2.9 : 2.1);
        e.x += e.vx;
        // 木箱阻挡冲锋兵：被挡时尝试跳过去
        for(const c of crates){
          if(!c.dead && aabb(e,c) && e.y + e.h > c.y + 8){
            e.x = e.vx > 0 ? c.x - e.w : c.x + c.w;
            if(e.onGroundPrev && Math.random() < 0.25) e.vy = -9;
          }
        }
        const feetPrevE = e.y + e.h;
        e.vy = Math.min(e.vy + 0.55, 14); e.y += e.vy;
        // 扫掠式落地：平台或地面，脚部任一部分接触即站立
        if(e.vy >= 0){
          const footL = e.x + 2, footR = e.x + e.w - 2;
          let ok = false;
          for(const pl of platforms.concat(crates)){
            if(pl.dead) continue;
            if(footR > pl.x && footL < pl.x + pl.w &&
               feetPrevE <= pl.y + 2 && e.y + e.h >= pl.y){
              e.y = pl.y - e.h; e.vy = 0; ok = true; break;
            }
          }
          if(!ok){
            const gy = groundYAt(e.x + e.w/2);
            const feet = e.y + e.h;
            if(gy < Infinity &&
               ((feetPrevE <= gy + 2 && feet >= gy) ||
                (e.onGroundPrev && feet >= gy - 1 && feet <= gy + 14))){ // 贴地跑坡
              e.y = gy - e.h; e.vy = 0; ok = true;
            }
          }
          e.onGroundPrev = ok;
          // 站在地面边缘前方是悬崖时，起跳跨过去
          if(ok && groundYAt(e.x + e.w/2 + e.vx*22) === Infinity && Math.random() < 0.5){
            e.vy = -10; e.onGroundPrev = false;
          }
        }
      }
    }
    // 敌人撞到玩家（自爆兵撞击即自爆）
    if(!e.dead && !p.dead && p.inv<=0 && aabb(hitbox(),ebox(e))){
      hurtPlayer();
      if(e.mode==="bomber") e.dead = true;
    }
  }
  // 自爆兵死亡：向四周抛出 14 颗红色球弹（带抛物线，落地再炸开）
  for(const e of enemies){
    if(e.dead && e.mode==="bomber" && !e.bombed){
      e.bombed = true;
      for(let k=0;k<14;k++){
        const a = -Math.PI/2 + (k-6.5)*0.24 + Math.random()*0.12; // 以上半圈为主抛出
        const v = 2.6 + Math.random()*2.2;
        ebullets.push({x:e.x+e.w/2, y:e.y+e.h/2, w:12, h:12, r:6.5,
                       vx:Math.cos(a)*v, vy:Math.sin(a)*v - 3.5, g:true, life:220});
      }
      explode(e.x+e.w/2, e.y+e.h/2, "#ff5b3d", 24, 5.5);
      sfx(120,.4,"sawtooth",.12,-60); shake = Math.max(shake,6);
    }
  }
  // 死亡的敌人立即移除；出界/坠落的也移除
  enemies = enemies.filter(e => !e.dead && e.x > cam - 200 && e.x < cam + W + 400 && e.y < H + 80);

  // ----- Boss -----
  const b = boss;
  if(!b.dead){
    if(!b.active && p.x > LEVEL_W - 1000){ b.active = true; }
    if(b.active){
      b.t++;
      cam = Math.min(cam+6, LEVEL_W - W);
      if(b.kind === "reactor"){
        // 第二关：反应堆核心（上下两座旋转炮舱 + 护盾核心）
        b.core.shielded = b.cannons.some(c => !c.dead);
        if(b.t % 170 === 0) spawnRunner(true);
        for(const c of b.cannons){
          if(c.dead) continue;
          c.t++;
          if(c.t % 120 === 0){                       // 旋转八向弹幕
            for(let k=0;k<8;k++){
              const ang = b.t*0.045 + k*Math.PI/4;
              ebullets.push({x:c.x+c.w/2, y:c.y+c.h/2, w:9, h:9, r:5,
                             vx:Math.cos(ang)*3.4, vy:Math.sin(ang)*3.4, life:230});
            }
            S.shoot();
          }
          if(c.t % 120 === 60){                      // 三连瞄准（带 0.18 弧度微散）
            const dx=(p.x+p.w/2)-(c.x+c.w/2), dy=chestY()-(c.y+c.h/2), base=Math.atan2(dy,dx);
            for(let k=-1;k<=1;k++){
              const ang = base + k*0.18;
              ebullets.push({x:c.x+c.w/2, y:c.y+c.h/2, w:8, h:8, vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, life:220});
            }
            S.shoot();
          }
          if(aabb(hitbox(), c) && p.inv<=0) hurtPlayer();
        }
        const core = b.core;
        if(!core.dead){
          if(b.t % 210 === 40){                      // 环形弹幕（护盾期节奏更快）
            const n = core.shielded ? 8 : 12;
            for(let k=0;k<n;k++){
              const ang = b.t*0.06 + k*Math.PI*2/n;
              ebullets.push({x:core.x+core.w/2, y:core.y+core.h/2, w:8, h:8, r:4.6,
                             vx:Math.cos(ang)*4.2, vy:Math.sin(ang)*4.2, life:240});
            }
            S.shoot();
          }
          if(aabb(hitbox(), core) && p.inv<=0) hurtPlayer();
        }
      } else {
        if(b.t % 140 === 0) spawnRunner(true); // 要塞召唤小兵
        // 火炮：交替三向扇形散射
        for(const c of b.cannons){
          if(c.dead) continue;
          c.t++;
          if(c.t % 150 === 0){
            const dx=(p.x+p.w/2)-(c.x), dy=chestY()-(c.y+c.h/2), base=Math.atan2(dy,dx);
            for(let k=-1;k<=1;k++){
              const ang = base + k*0.3;
              ebullets.push({x:c.x, y:c.y+c.h/2, w:8, h:8, vx:Math.cos(ang)*5, vy:Math.sin(ang)*5, life:220});
            }
            S.shoot();
          }
          if(aabb(hitbox(),c) && p.inv<=0) hurtPlayer();
        }
        // 核心：旋转环形弹幕
        const core = b.core;
        if(!core.dead && b.t % 170 === 30){
          for(let k=0;k<6;k++){
            const ang = (b.t*0.05) + k*Math.PI/3;
            ebullets.push({x:core.x, y:core.y+core.h/2, w:8, h:8, vx:Math.cos(ang)*4.2, vy:Math.sin(ang)*4.2, life:220});
          }
          S.shoot();
        }
        if(!core.dead && aabb(hitbox(),core) && p.inv<=0) hurtPlayer();
      }
    }
  }

  // ----- 子弹 -----
  for(const bl of bullets){
    // 抛物线炸弹：命中敌人/落地/超时即爆炸（范围杀伤 85px，-3 血）
    if(bl.bomb){
      // 追踪修正：锁定目标仍存活时，每帧重新解算水平速度指向目标当前位置
      if(bl.tref && !bl.tref.dead){
        bl.T = Math.max(6, bl.T - 1);
        bl.vx = ((bl.tref.x + bl.tref.w/2) - (bl.x+7)) / bl.T;
        if(Math.hypot((bl.tref.x+bl.tref.w/2)-(bl.x+7), (bl.tref.y+bl.tref.h/2)-(bl.y+7)) < 28) bl.life = 1; // 近距引爆
      }
      bl.vy += BOMB_G; bl.x += bl.vx; bl.y += bl.vy; bl.life--;
      if(bl.life%4===0) particles.push({x:bl.x+4, y:bl.y+4, vx:-bl.vx*0.1, vy:-0.3, life:14, color:"#9aa0a8"});
      const gy = groundYAt(bl.x + bl.w/2);
      let boom = bl.life<=0 || bl.y+bl.h >= (gy===Infinity ? H+60 : gy);
      if(!boom) for(const e of enemies){ if(!e.dead && aabb(bl,e)){ boom=true; break; } }
      if(boom){
        bl.life = 0;
        explode(bl.x+7, bl.y+7, "#ffb347", 30, 6);
        explode(bl.x+7, bl.y+7, "#ff5b3d", 20, 4);
        shake = Math.max(shake, 10);
        sfx(90,.5,"sawtooth",.14,-40);
        for(const e of enemies){
          if(e.dead) continue;
          const d = Math.hypot((e.x+e.w/2)-(bl.x+7), (e.y+e.h/2)-(bl.y+7));
          if(d<85) damageEnemy(e, 3);
        }
        if(boss.active && !boss.dead){
          for(const c of boss.cannons){
            if(c.dead) continue;
            if(Math.hypot((c.x+c.w/2)-(bl.x+7), (c.y+c.h/2)-(bl.y+7))<90){
              c.hp-=3; explode(c.x+c.w/2,c.y+c.h/2,"#ff9b4d",16,5);
              if(c.hp<=0){ c.dead=true; score+=800; shake=10; S.hitE(); }
            }
          }
          const core = boss.core;
          if(!core.dead && Math.hypot((core.x+core.w/2)-(bl.x+7), (core.y+core.h/2)-(bl.y+7))<95){
            if(core.shielded){ explode(core.x+core.w/2, core.y+core.h/2, "#5afff0", 12, 4); }
            else { core.hp-=3; if(core.hp<=0) killCore(); }
          }
        }
      }
      continue;
    }
    // 镭射光束：静止贯穿，对路径上所有目标造成一次伤害
    if(bl.beam){
      bl.life--;
      const LEN = 950;
      const hitTest = (r)=>{
        for(let s=0;s<=LEN;s+=12){
          const px=bl.x+bl.dx*s, py=bl.y+bl.dy*s;
          if(px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h) return true;
        }
        return false;
      };
      for(const e of enemies){
        if(!e.dead && !bl.hit.has(e) && hitTest(ebox(e))){
          bl.hit.add(e); e.hp-=3;
          if(e.hp<=0){
            e.dead=true; killCount++;
            score += scoreFor(e);
            explode(e.x+e.w/2,e.y+e.h/2,"#ff9b4d",14,4); S.hitE();
          }
        }
      }
      if(boss.active && !boss.dead){
        for(const c of boss.cannons){
          if(!c.dead && !bl.hit.has(c) && hitTest(c)){
            bl.hit.add(c); c.hp-=3;
            if(c.hp<=0){ c.dead=true; score+=800; explode(c.x+c.w/2,c.y+c.h/2,"#ff9b4d",20,5); shake=8; S.hitE(); }
          }
        }
        const core = boss.core;
        if(!core.dead && !bl.hit.has(core) && hitTest(core)){
          bl.hit.add(core);
          if(core.shielded){ explode(core.x+core.w/2, core.y+core.h/2, "#5afff0", 10, 3); }
          else { core.hp-=3; if(core.hp<=0) killCore(); }
        }
      }
      continue;
    }
    bl.x+=bl.vx; bl.y+=bl.vy; bl.life--;
    // 打木箱（可破坏，打碎得分）
    for(const c of crates){
      if(bl.life>0 && !c.dead && aabb(bl,c)){
        bl.life=0; c.hp--; c.flash=6; explode(bl.x,bl.y,"#c9a17a",4,2); S.hitE();
        if(c.hp<=0){
          c.dead=true; score+=50;
          explode(c.x+c.w/2, c.y+c.h/2, "#8a6a3a", 16, 4);
          sfx(110,.3,"sawtooth",.1,-60);
        }
        break;
      }
    }
    // 打敌人
    for(const e of enemies){
      if(!e.dead && aabb(bl,ebox(e))){
        bl.life=0; e.hp-=bl.dmg||1; explode(bl.x,bl.y,"#fff3a0",5,2.5);
        if(e.hp<=0){
          e.dead=true; killCount++;
          score += scoreFor(e);
          explode(e.x+e.w/2,e.y+e.h/2,"#ff9b4d",14,4); S.hitE();
        }
        break;
      }
    }
    // 打 Boss：先炮台后核心
    if(bl.life>0 && boss.active && !boss.dead){
      for(const c of boss.cannons){
        if(!c.dead && aabb(bl,c)){
          bl.life=0; c.hp-=bl.dmg||1; explode(bl.x,bl.y,"#fff3a0",6,3); S.hitE();
          if(c.hp<=0){ c.dead=true; score+=800; explode(c.x+c.w/2,c.y+c.h/2,"#ff9b4d",20,5); shake=8; }
          break;
        }
      }
      const core = boss.core;
      if(bl.life>0 && !core.dead && aabb(bl,core)){
        bl.life=0;
        if(core.shielded){ explode(bl.x,bl.y,"#5afff0",6,3); }
        else {
          core.hp-=bl.dmg||1; explode(bl.x,bl.y,"#fff3a0",6,3); S.hitE();
          if(core.hp<=0) killCore();
        }
      }
    }
  }
  bullets = bullets.filter(b=>b.life>0 && b.x>cam-40 && b.x<cam+W+40 && b.y>-40 && b.y<H+40);

  for(const bl of ebullets){
    // 自爆兵抛物线炸弹：受重力下坠，落地/超时炸开（近身范围伤害）
    if(bl.g){
      bl.vy += 0.28; bl.x += bl.vx; bl.y += bl.vy; bl.life--;
      const gy = groundYAt(bl.x);
      if(bl.y + bl.r >= (gy===Infinity ? H+60 : gy) || bl.life<=0){
        bl.life = 0;
        explode(bl.x, bl.y, "#ff5b3d", 14, 4.5);
        explode(bl.x, bl.y, "#ffb347", 8, 3);
        sfx(150,.22,"sawtooth",.07,-90);
        if(p.inv<=0 && !p.dead && Math.hypot((p.x+p.w/2)-bl.x, (p.y+p.h/2)-bl.y) < 52) hurtPlayer();
      } else if(p.inv<=0 && !p.dead && aabb(hitbox(),bl)){
        bl.life = 0; hurtPlayer();
        explode(bl.x, bl.y, "#ff5b3d", 14, 4.5);
      }
      continue;
    }
    bl.x+=bl.vx; bl.y+=bl.vy; bl.life--;
    // 敌弹被木箱挡下（木箱=玩家的掩体）
    for(const c of crates){
      if(bl.life>0 && !c.dead && aabb(bl,c)){
        bl.life=0; c.flash=6; explode(bl.x,bl.y,"#c9a17a",4,2);
        break;
      }
    }
    if(bl.life>0 && p.inv<=0 && !p.dead && aabb(hitbox(),bl)){ bl.life=0; hurtPlayer(); }
  }
  ebullets = ebullets.filter(b=>b.life>0);

  // 粒子
  for(const q of particles){ q.x+=q.vx; q.y+=q.vy; q.vy+=0.25; q.life--; }
  particles = particles.filter(q=>q.life>0);
  for(const c of crates) if(c.flash>0) c.flash--;

  // 通关演出：主角走进基地大门 → 过关结算
  if(state==="walkin" && p.x >= boss.core.x - 30){
    state="win"; stateTimer=0; keys["ArrowRight"]=false;
    BGM.stop(); S.clear();
  }
}

function spawnRunner(fromBoss){
  const fromRight = !fromBoss ? true : (Math.random()<0.6);
  const x = fromRight ? cam+W+30 : cam-30;
  const gy = groundYAt(x);
  enemies.push(makeSoldier(x, gy<Infinity ? gy-40 : 300, "runner"));
}
function makeSoldier(x,y,mode){ return {kind:"soldier",mode,x,y,w:24,h:40,vx:0,vy:0,hp:1,dead:false,cd:60+Math.random()*80,onGroundPrev:false,animT:Math.random()*100}; }
function makeTurret(x,y,sp){ return {kind:"turret",x,y,w:44,h:40,hp:3,dead:false,cd:90,burst:0,bt:0,sp:!!sp}; }
// 巡逻无人机（第二关新增）：悬停漂移、单发瞄准，被击落后爆炸
function makeDrone(px, py){
  return {kind:"drone", x:px, y:py||240, baseY:py||240, w:40, h:26, hp:2, dead:false,
          cd:70+Math.random()*60, t:Math.random()*100, side: Math.random()<0.5?-1:1, animT:0};
}
// 工事类敌人：trencher 战壕兵 / tower 高塔狙击 / camper 草丛伏兵（y 记录地表高度）
function makeFort(px, mode){
  const gy = groundYAt(px);
  return {kind:"fort", mode, x:px, y:(gy<Infinity?gy:GROUND_Y),
          w: mode==="tower"?46 : (mode==="trencher"?52:40), h:0,
          hp: mode==="tower"?2:1, dead:false,
          cd: 70+Math.random()*70, up:0, revealed:false, t:0, animT:0};
}
// 工事敌人的受击盒（隐藏时为空盒=不可被打）
function ebox(e){
  if(e.kind!=="fort") return e;
  if(e.mode==="tower")    return {x:e.x+8,  y:e.y-184, w:30, h:34};
  if(e.mode==="trencher") return e.up>0 ? {x:e.x+12, y:e.y-30, w:28, h:30} : {x:-9999,y:-9999,w:0,h:0};
  return e.revealed ? {x:e.x+6, y:e.y-38, w:28, h:38} : {x:-9999,y:-9999,w:0,h:0}; // camper
}
function scoreFor(e){
  if(e.kind==="turret") return 500;
  if(e.kind==="drone")  return 300;
  if(e.kind==="fort")   return e.mode==="tower"?400 : e.mode==="camper"?250 : 150;
  return e.mode==="sniper" ? 200 : 100;
}

const BOMB_G = 0.35; // 炸弹抛物线重力
// 统一开火入口：force=true 时无视冷却（用于 ↑+方向 一键斜射）
function tryShoot(force){
  const p = player;
  if(!p || p.dead) return;
  if(p.fireCd>0 && !force) return;
  const mvx = Math.cos(p.aimAng), mvy = Math.sin(p.aimAng); // 局部坐标：+x 为面朝方向
  const downAim = p.aimAng === Math.PI/2;                   // 空中朝下射击
  const bx = p.x + p.w/2 + (p.crouch ? 0 : p.face*mvx*8);
  const by = downAim ? p.y + p.h - 4 : (p.crouch ? p.y+28 : p.y+12+mvy*8);
  const mk = (vx,vy,dmg=1,yoff=0)=>bullets.push({x:bx,y:by+yoff,w:6,h:6,vx,vy,life:70,dmg});
  // 斜上/正上瞄准增强：伤害 2、弹速更快
  const boost = p.aimAng !== 0 ? 1.15 : 1;
  const dmg   = p.aimAng !== 0 ? 2 : 1;
  const lv = p.wlv && p.wlv[p.weapon] || 0; // 武器等级（吃同类包升级，最高 2）
  if(p.weapon==="B"){ // 炸弹：自动锁定面前最近的敌人，投出抛物线炸弹；Lv+ 双弹齐投
    p.fireCd = lv>=1 ? 40 : 32;
    // 收集面朝方向按距离排序的敌人
    const cands = enemies.filter(e=>!e.dead && Math.sign((e.x+e.w/2)-bx)===p.face)
                         .sort((a,b)=>Math.abs(a.x-bx)-Math.abs(b.x-bx));
    const throwBomb = (tgt, extraT)=>{
      let vx, vy, T;
      if(tgt){
        const tx=tgt.x+tgt.w/2, ty=tgt.y+tgt.h/2;
        T = Math.max(26, Math.abs(tx-bx)/7) + extraT;
        vx=(tx-bx)/T; vy=(ty-by-0.5*BOMB_G*T*T)/T;
      } else { vx=p.face*6; vy=-7; T=90; }
      bullets.push({bomb:true, x:bx, y:by, w:14, h:14, tref:tgt, T, vx, vy, life:150});
    };
    throwBomb(cands[0]||null, 0);
    if(lv>=1){
      // 第二颗：锁定次近目标；无次近目标则错开时间砸向同一目标
      throwBomb(cands[1]||cands[0]||null, cands[1] ? 0 : 10);
    }
    sfx(300,.2,"triangle",.08,-160);
  } else if(p.weapon==="L"){ // 镭射枪：贯穿光束；Lv+ 光束变粗、威力提升
    p.fireCd = 45;
    bullets.push({beam:true, x:bx, y:by, dx:p.face*mvx, dy:mvy, life:14, hit:new Set(),
                  bw: 7 + lv*5, bd: 3 + lv});
    sfx(1200,.25,"sawtooth",.09,-900);
  } else if(p.weapon==="M"){ // 机枪：高射速连发；Lv+ 双排子弹
    p.fireCd = 5;
    mk(p.face*mvx*12*boost, mvy*12*boost, dmg, -6);
    if(lv>=1) mk(p.face*mvx*12*boost, mvy*12*boost, dmg, 6);
    S.shoot();
  } else if(p.weapon==="S"){ // 散弹枪：三向扇形；Lv+ 二次散射成五向
    p.fireCd = lv>=1 ? 20 : 16;
    const n = lv>=1 ? 5 : 3;
    for(let k=0;k<n;k++){
      const ang = p.aimAng + (k-(n-1)/2)*0.32;
      mk(p.face*Math.cos(ang)*10.5*boost, Math.sin(ang)*10.5*boost, dmg);
    }
    S.shoot();
  } else { // 普通步枪
    p.fireCd = 10;
    mk(p.face*mvx*10.5*boost, mvy*10.5*boost, dmg);
    S.shoot();
  }
}
// 敌人受击通用处理
function damageEnemy(e, dmg){
  e.hp -= dmg;
  if(e.hp<=0 && !e.dead){
    e.dead=true; killCount++;
    score += scoreFor(e);
    explode(e.x+e.w/2,e.y+e.h/2,"#ff9b4d",14,4); S.hitE();
  }
}
// Boss 核心击破
function killCore(){
  const core = boss.core;
  core.dead=true; boss.dead=true; score+=5000; S.bossDown();
  explode(core.x+core.w/2, core.y+core.h/2, "#ff5b3d", 40, 7); shake=30;
  setTimeout(()=>{ state="walkin"; stateTimer=0; }, 1600); // 爆炸过后主角自动走向大门
}

function hurtPlayer(fell){  const p = player;
  if(!fell && p.inv>0) return;
  lives--; S.hurt(); shake=12;
  explode(p.x+p.w/2, p.y+p.h/2, "#ff5b3d", 18, 5);
  if(lives < 0){ state = "over"; stateTimer=0; BGM.stop(); return; }
  // 找最近的检查点
  let cp = 0;
  for(const c of checkpoints) if(c <= p.x+50) cp = Math.max(cp,c);
  checkpoint = cp;
  // Boss 战中阵亡：解除镜头锁定，重新靠近后 Boss 再次激活
  if(boss && !boss.dead) boss.active = false;
  resetPlayer(checkpoint + 20);
  // 清掉玩家身边子弹，防止连续受伤
  ebullets = ebullets.filter(b => Math.abs(b.x - p.x) > 150);
}

// 一棵丛林树：树干 + 三团树冠 + 底部根须
function drawTree(x, baseY, s, canopy, trunk){
  ctx.fillStyle = trunk;
  ctx.fillRect(x-4*s, baseY-92*s, 8*s, 92*s);                       // 树干
  ctx.beginPath();                                                  // 根须
  ctx.moveTo(x-4*s, baseY-36*s); ctx.lineTo(x-13*s, baseY); ctx.lineTo(x-1*s, baseY); ctx.closePath(); ctx.fill();
  ctx.fillStyle = canopy;
  ctx.beginPath();                                                  // 层叠树冠
  ctx.arc(x,        baseY-100*s, 32*s, 0, 7);
  ctx.arc(x-26*s,   baseY-78*s,  22*s, 0, 7);
  ctx.arc(x+26*s,   baseY-78*s,  22*s, 0, 7);
  ctx.arc(x+8*s,    baseY-62*s,  18*s, 0, 7);
  ctx.fill();
}

function drawTerrain2(){
  // 深坑：底部熔炉式能量池（发光脉动）
  const heat = .55 + .45*Math.sin(perfNow/420);
  const pit = ctx.createLinearGradient(0,470,0,H+20);
  pit.addColorStop(0,"#7a2a08"); pit.addColorStop(.45,"#ff6a1a"); pit.addColorStop(1,"#ffd24a");
  ctx.fillStyle = pit; ctx.globalAlpha = .55 + .25*heat;
  ctx.fillRect(cam-20, 470, W+40, H-470+20);
  ctx.globalAlpha = 1;
  // 气泡
  for(let i=0;i<14;i++){
    const bx = ((i*137 + Math.sin((perfNow/900)+i)*30) % (W+60));
    ctx.fillStyle = "rgba(255,240,180,"+(.25+.35*Math.abs(Math.sin(perfNow/300+i)))+")";
    ctx.beginPath(); ctx.arc(cam+bx-20, 495+((i*13)%30), 2+((i%3)), 0, 7); ctx.fill();
  }
  // 地板：金属平台（顶面高光 + 铆钉 + 承重梁）
  for(const pc of terrainPieces){
    const pts = pc.pts;
    if(pts[pts.length-1][0] < cam-20 || pts[0][0] > cam+W+20) continue;
    ctx.fillStyle="#242b34";
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]-cam, pts[i][1]);
    ctx.lineTo(pts[pts.length-1][0]-cam, H+20);
    ctx.lineTo(pts[0][0]-cam, H+20);
    ctx.closePath(); ctx.fill();
    // 承重梁纹理
    ctx.fillStyle="#1b222b";
    for(let i=0;i<pts.length-1;i++){
      const [ax,ay]=pts[i], [bx2,by]=pts[i+1];
      const steps = Math.max(1, Math.floor((bx2-ax)/64));
      for(let s=0;s<steps;s++){
        const t=(s+0.5)/steps, tx=ax+(bx2-ax)*t, ty=ay+(by-ay)*t;
        ctx.fillRect(tx-cam-3, ty+26, 6, H-ty);
      }
    }
    // 顶面钢板高光
    ctx.strokeStyle="#6d7b8c"; ctx.lineWidth=5; ctx.lineCap="butt";
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]-cam, pts[i][1]);
    ctx.stroke();
    // 警示黄条（地板边缘）
    ctx.strokeStyle="#c8a02a"; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]+7);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]-cam, pts[i][1]+7);
    ctx.stroke();
    // 铆钉
    ctx.fillStyle="#8794a3";
    for(let i=0;i<pts.length-1;i++){
      const [ax,ay]=pts[i], [bx2,by]=pts[i+1];
      const step=(bx2-ax);
      const steps = Math.max(1, Math.floor(step/56));
      for(let s=0;s<=steps;s++){
        const t=s/steps, tx=ax+(bx2-ax)*t, ty=ay+(by-ay)*t;
        ctx.fillRect(tx-cam-1, ty+3, 3, 3);
      }
    }
    // 断口（深坑）侧壁发光
    ctx.strokeStyle="rgba(255,120,30,.5)"; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(pts[0][0]-cam, pts[0][1]); ctx.lineTo(pts[0][0]-cam, H+20);
    ctx.moveTo(pts[pts.length-1][0]-cam, pts[pts.length-1][1]); ctx.lineTo(pts[pts.length-1][0]-cam, H+20);
    ctx.stroke();
  }
  // 平台（钢制栈桥：格栅 + 侧梁 + 警示边）
  for(const pl of platforms){
    if(pl.x+pl.w<cam || pl.x>cam+W) continue;
    ctx.fillStyle="#2f3843"; ctx.fillRect(pl.x-cam, pl.y, pl.w, pl.h);
    ctx.fillStyle="#6d7b8c"; ctx.fillRect(pl.x-cam, pl.y, pl.w, 4);
    ctx.fillStyle="#1c232b"; ctx.fillRect(pl.x-cam, pl.y+pl.h-4, pl.w, 4);
    // 格栅
    ctx.strokeStyle="#202932"; ctx.lineWidth=2;
    for(let gx=pl.x+8; gx<pl.x+pl.w-6; gx+=16){
      ctx.beginPath(); ctx.moveTo(gx-cam, pl.y+4); ctx.lineTo(gx-cam, pl.y+pl.h-4); ctx.stroke();
    }
    // 两端吊索
    ctx.strokeStyle="#48545f"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(pl.x-cam+6, pl.y); ctx.lineTo(pl.x-cam+6, pl.y-14);
    ctx.moveTo(pl.x-cam+pl.w-6, pl.y); ctx.lineTo(pl.x-cam+pl.w-6, pl.y-14); ctx.stroke();
  }
}

// 开场演出：直升机 + 绳索
function drawInsert(){
  const t = stateTimer, hp2 = heliPos(t);
  const hx = hp2.x-cam, hy = hp2.y;
  // 绳索（放下→滑降→收回）
  let ropeLen = 0;
  const Rmax = groundYAt(260) - (hp2.y+30);
  if(t>=95 && t<135)      ropeLen = (t-95)/40 * Rmax;
  else if(t>=135 && t<235) ropeLen = Rmax;
  else if(t>=235 && t<275) ropeLen = (1-(t-235)/40) * Rmax;
  if(ropeLen>0){
    ctx.strokeStyle="#d8d2c0"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(hx+12, hy+22); ctx.lineTo(hx+12, hy+22+ropeLen); ctx.stroke();
  }
  // 直升机（像素风：机身+座舱+尾梁+旋翼）
  ctx.save(); ctx.translate(hx, hy);
  const dirF = t<270 ? -1 : 1; // 来时朝左，离场朝右
  ctx.scale(dirF,1);
  ctx.fillStyle="#2f4a2f";                                        // 机身
  ctx.fillRect(-26, 0, 46, 20);
  ctx.fillStyle="#3d5f3d"; ctx.fillRect(-22, 3, 38, 8);
  ctx.fillStyle="#7ab0d8"; ctx.fillRect(8, 4, 12, 10);            // 座舱玻璃
  ctx.fillStyle="#2f4a2f"; ctx.fillRect(-58, 4, 34, 7);           // 尾梁
  ctx.fillRect(-62, -2, 6, 18);                                   // 尾鳍
  ctx.fillStyle="#c9d4e0";                                        // 尾桨
  const tr2 = Math.floor(perfNow/60)%2 ? 16 : 2;
  ctx.fillRect(-64, 6-tr2/2, 2, tr2);
  ctx.fillStyle="#22262c"; ctx.fillRect(-8, -6, 10, 7);           // 旋翼座
  ctx.strokeStyle="#22262c"; ctx.lineWidth=3;                     // 主旋翼（旋转 illusion）
  const rw = Math.cos(perfNow/45)*46;
  ctx.beginPath(); ctx.moveTo(-rw, -8); ctx.lineTo(rw, -8); ctx.stroke();
  ctx.strokeStyle="#555c66"; ctx.lineWidth=1.5;
  const rw2 = Math.sin(perfNow/45)*40;
  ctx.beginPath(); ctx.moveTo(-rw2, -6); ctx.lineTo(rw2, -6); ctx.stroke();
  ctx.restore();
  // 绳索末端把手
  if(ropeLen>0){ ctx.fillStyle="#8a6a3a"; ctx.fillRect(hx+7, hy+22+ropeLen-4, 10, 5); }
}

  // 枪（跟随瞄准方向旋转）+ 瞄准指示箭头
  ctx.fillStyle="#444";
  ctx.save(); ctx.translate(13,18); ctx.rotate(p.aimAng||0); ctx.fillRect(0,-2,14,4); ctx.restore();
  if(p.aimAng){
    const ang=p.aimAng, mx=13+Math.cos(ang)*20, my=18+Math.sin(ang)*20;
    ctx.fillStyle="#ffd34d";
    ctx.save(); ctx.translate(mx,my); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-2,-6); ctx.lineTo(-2,6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawDrone(e, x, y){
  const w = e.w, h = e.h;
  // 旋翼（高速旋转的虚影）
  const rw = 22 + Math.sin(e.animT*2.4)*3;
  ctx.strokeStyle="#8f9aa8"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+w/2-rw, y-4); ctx.lineTo(x+w/2+rw, y-4); ctx.stroke();
  ctx.globalAlpha=.5;
  ctx.beginPath(); ctx.moveTo(x+w/2-rw*0.7, y-7); ctx.lineTo(x+w/2+rw*0.7, y-7); ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle="#3a4048"; ctx.fillRect(x+w/2-3, y-8, 6, 6);     // 旋翼轴
  // 机体（金属球壳）
  ctx.fillStyle="#4a525c";
  ctx.beginPath(); ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, 7); ctx.fill();
  ctx.fillStyle="#5d6874";
  ctx.beginPath(); ctx.ellipse(x+w/2, y+h/2-3, w/2-6, h/2-6, 0, 0, 7); ctx.fill();
  // 侧翼喷口
  ctx.fillStyle="#2b3138";
  ctx.fillRect(x-4, y+h/2-3, 8, 6); ctx.fillRect(x+w-4, y+h/2-3, 8, 6);
  // 红色单眼（瞄准时变亮）
  const hot = e.cd < 25;
  ctx.fillStyle = hot ? "#ff3b1f" : "#c03018";
  ctx.beginPath(); ctx.arc(x+w/2+4, y+h/2+1, 4.5, 0, 7); ctx.fill();
  if(hot){ ctx.globalAlpha=.35; ctx.fillStyle="#ff3b1f";
    ctx.beginPath(); ctx.arc(x+w/2+4, y+h/2+1, 9, 0, 7); ctx.fill(); ctx.globalAlpha=1; }
  // 挂载炮管
  ctx.fillStyle="#20262c"; ctx.fillRect(x+w/2-2, y+h-6, 6, 7);
}
function drawSoldier(e){
  const x=e.x-cam, y=e.y, t=(e.animT+=0.3);
  // ----- 巡逻无人机 -----
  if(e.kind==="drone"){ drawDrone(e, x, y); return; }
  // ----- 工事类 -----
  if(e.kind==="fort"){
    if(e.mode==="trencher"){
      // 战壕：深沟 + 沙袋垒边
      ctx.fillStyle="#1a2416"; ctx.fillRect(x, y-4, e.w, 16);           // 沟体
      ctx.fillStyle="#2c3626"; ctx.fillRect(x+4, y-2, e.w-8, 12);       // 沟内阴影
      ctx.fillStyle="#6b6248";
      for(let sx=0; sx<e.w; sx+=16){ ctx.fillRect(x+sx, y-8, 14, 8); }  // 沙袋
      ctx.fillStyle="#7a7054";
      for(let sx=0; sx<e.w; sx+=16){ ctx.fillRect(x+sx, y-8, 14, 3); }
      if(e.up>0){
        // 士兵抬头（前 20 帧升起、后 20 帧蹲回）
        const rise = Math.min(1, Math.min(e.up, 120-e.up)/20);
        const sy = y - rise*26;
        ctx.fillStyle="#c9a17a"; ctx.fillRect(x+18, sy, 12, 10);        // 头
        ctx.fillStyle="#3d4a26"; ctx.fillRect(x+16, sy-4, 16, 5);       // 头盔
        ctx.fillStyle="#5a6a3a"; ctx.fillRect(x+16, sy+10, 16, 10);     // 肩
        ctx.fillStyle="#333";    ctx.fillRect(x+28, sy+8, 18, 3);       // 枪
      }
      return;
    }
    if(e.mode==="tower"){
      // 高塔：木架 + 顶部平台
      ctx.fillStyle="#5b4630";
      ctx.fillRect(x+4, y-150, 7, 150); ctx.fillRect(x+e.w-11, y-150, 7, 150);  // 双腿
      ctx.strokeStyle="#5b4630"; ctx.lineWidth=5;
      ctx.beginPath();
      ctx.moveTo(x+6, y-20); ctx.lineTo(x+e.w-8, y-90);
      ctx.moveTo(x+e.w-8, y-20); ctx.lineTo(x+6, y-90);
      ctx.stroke();
      ctx.fillStyle="#7d5f3f"; ctx.fillRect(x-4, y-154, e.w+8, 10);     // 平台
      ctx.fillStyle="#3e2f1f"; ctx.fillRect(x-4, y-146, e.w+8, 4);
      // 塔顶狙击手
      const dir = (player.x > e.x) ? 1 : -1;
      ctx.save(); ctx.translate(x+e.w/2, y-154); ctx.scale(dir,1);
      ctx.fillStyle="#5a6a3a"; ctx.fillRect(-8,-22,16,16);
      ctx.fillStyle="#c9a17a"; ctx.fillRect(-5,-30,10,8);
      ctx.fillStyle="#3d4a26"; ctx.fillRect(-7,-34,14,4);
      ctx.fillStyle="#333";    ctx.fillRect(6,-26,20,3);
      if(e.cd>128 && e.cd<136){ ctx.fillStyle="#ffe86b"; ctx.fillRect(26,-27,6,5); } // 枪口焰
      ctx.restore();
      return;
    }
    // camper：草丛伏兵
    ctx.fillStyle="#2e5a2a";
    for(let b=0;b<6;b++){
      const bx = x + b*7 + (b%2)*3;
      ctx.beginPath();
      ctx.moveTo(bx, y); ctx.quadraticCurveTo(bx+3, y-16-(b%3)*4, bx+6, y);
      ctx.closePath(); ctx.fill();
    }
    if(e.revealed){
      // 现身：单膝跪地射击姿态
      const dir = (player.x > e.x) ? 1 : -1;
      ctx.save(); ctx.translate(x+e.w/2, y); ctx.scale(dir,1);
      ctx.fillStyle="#5a6a3a"; ctx.fillRect(-9,-16,18,14);              // 躯干
      ctx.fillStyle="#c9a17a"; ctx.fillRect(-5,-26,10,9);               // 头
      ctx.fillStyle="#3d4a26"; ctx.fillRect(-7,-30,14,4);               // 头盔
      ctx.fillStyle="#3d4a26"; ctx.fillRect(-9,-2,8,4);                 // 跪腿
      ctx.fillStyle="#333";    ctx.fillRect(6,-14,20,3);                // 枪
      ctx.restore();
    }
    return;
  }
  if(e.kind==="turret"){
    // 特殊炮台（青色，温和版）与普通炮台（灰红，扇形散射）
    ctx.fillStyle = e.sp ? "#1f6f6f" : "#3a3f4a"; ctx.fillRect(x, y+14, e.w, e.h-14);
    ctx.fillStyle = e.sp ? "#3aa8a0" : "#565e6e"; ctx.fillRect(x+4, y+18, e.w-8, 8);
    ctx.fillStyle="#22262e"; ctx.fillRect(x+e.w/2-4, y, 8, 16);
    ctx.fillStyle = e.sp ? "#1a5a56" : "#88332a"; ctx.beginPath(); ctx.arc(x+e.w/2, y, 7, 0, 7); ctx.fill();
    if(!e.dead){
      const blink = Math.floor(t/15)%2===0;
      ctx.fillStyle = e.sp ? (blink?"#5afff0":"#1a8a80") : (blink?"#ff5b3d":"#802a1a");
      ctx.fillRect(x+e.w/2-2, y-2, 4, 4);
    }
    return;
  }
  // 士兵
  const run = e.mode==="runner" || e.mode==="bomber";
  const bob = run?Math.sin(t*0.5)*1.5:0;
  ctx.save(); ctx.translate(x+e.w/2, y+bob);
  const dir = (player.x > e.x)?1:-1; ctx.scale(dir,1); ctx.translate(-e.w/2,0);
  const bodyCol = e.mode==="bomber" ? "#b0431f" : "#5a6a3a";
  const helmCol = e.mode==="bomber" ? "#5a1a10" : "#3d4a26";
  ctx.fillStyle=bodyCol;
  if(run){ const lo=Math.sin(t*0.5)*5; ctx.fillRect(3,26,7,14+lo*0.4); ctx.fillRect(13,26,7,14-lo*0.4); }
  else { ctx.fillRect(3,26,7,14); ctx.fillRect(13,26,7,14); }
  ctx.fillRect(2,12,19,14);
  ctx.fillStyle="#c9a17a"; ctx.fillRect(6,3,11,9);
  ctx.fillStyle=helmCol; ctx.fillRect(4,0,15,4); // 头盔
  if(e.mode==="bomber"){
    // 胸前引信灯：快速闪烁预警
    ctx.fillStyle = (Math.floor(t/6)%2)?"#ffe86b":"#ff2200";
    ctx.fillRect(9,16,6,5);
  } else {
    ctx.fillStyle="#333"; ctx.fillRect(15,14,12,4);  // 枪
  }
  ctx.restore();
}
// ============ 第二关 Boss：反应堆核心 + 上下旋转炮舱 ============
function drawReactor(){
  const b = boss, wx = b.wallX - cam;
  if(wx > W + 260) return;
  const wallW = W + 320;
  // 基地后方巨型墙体
  ctx.fillStyle="#2a3038"; ctx.fillRect(wx, 0, wallW, GROUND_Y);
  ctx.fillStyle="#22282f";
  for(let wy=0; wy<GROUND_Y; wy+=46) ctx.fillRect(wx, wy, wallW, 4);
  // 竖梁与管线
  ctx.fillStyle="#1a2027";
  for(let px=wx+30; px<wx+wallW; px+=120) ctx.fillRect(px, 0, 14, GROUND_Y);
  ctx.fillStyle="#333c47";
  for(let px=wx+60; px<wx+wallW; px+=120){
    ctx.fillRect(px, 0, 8, GROUND_Y);
    for(let py=40; py<GROUND_Y; py+=90) ctx.fillRect(px-8, py, 24, 8);
  }
  // 顶部警示排灯
  for(let px=wx+20; px<wx+wallW; px+=64){
    const on = Math.floor((perfNow/380) + px/64) % 2 === 0;
    ctx.fillStyle = on ? "#ff3b1f" : "#4a1004";
    ctx.fillRect(px, 18, 12, 7);
  }

  // ---- 核心（六边形反应堆）----
  const c = b.core, cx = c.x - cam, cy = c.y;
  ctx.fillStyle="#141a20"; ctx.fillRect(cx-14, cy-14, c.w+28, c.h+28);
  ctx.fillStyle="#39424e"; ctx.fillRect(cx-8, cy-8, c.w+16, c.h+16);
  if(!c.dead){
    const pulse = .55 + .45*Math.abs(Math.sin(perfNow/260));
    // 反应堆外壳
    ctx.fillStyle="#4a5563";
    ctx.beginPath();
    ctx.moveTo(cx+c.w/2, cy-10); ctx.lineTo(cx+c.w+6, cy+c.h*0.25);
    ctx.lineTo(cx+c.w+6, cy+c.h*0.75); ctx.lineTo(cx+c.w/2, cy+c.h+10);
    ctx.lineTo(cx-6, cy+c.h*0.75); ctx.lineTo(cx-6, cy+c.h*0.25);
    ctx.closePath(); ctx.fill();
    // 内部能量
    const eg = ctx.createRadialGradient(cx+c.w/2, cy+c.h/2, 6, cx+c.w/2, cy+c.h/2, c.h*0.62);
    eg.addColorStop(0, "#fffbe0");
    eg.addColorStop(.45, c.shielded ? "#5afff0" : "#ffb347");
    eg.addColorStop(1, c.shielded ? "#1a5a66" : "#7a1a04");
    ctx.fillStyle = eg;
    ctx.fillRect(cx, cy, c.w, c.h);
    // 能量流动条纹
    ctx.globalAlpha = .35; ctx.fillStyle="#ffffff";
    for(let s=0; s<6; s++){
      const sy = cy + ((perfNow/6 + s*22) % c.h);
      ctx.fillRect(cx, sy, c.w, 2);
    }
    ctx.globalAlpha = 1;
    // 护盾力场（两座炮舱未毁 → 核心无敌）
    if(c.shielded){
      ctx.globalAlpha = .22 + .16*pulse;
      ctx.strokeStyle="#5afff0"; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(cx+c.w/2, cy+c.h/2, c.h*0.78, 0, 7); ctx.stroke();
      ctx.globalAlpha = .10 + .08*pulse; ctx.fillStyle="#5afff0";
      ctx.beginPath(); ctx.arc(cx+c.w/2, cy+c.h/2, c.h*0.78, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      // 六边形网格
      ctx.strokeStyle="rgba(120,255,245,.35)"; ctx.lineWidth=1;
      for(let a=0; a<6; a++){
        const ang = a*Math.PI/3 + perfNow/2600;
        ctx.beginPath();
        ctx.moveTo(cx+c.w/2, cy+c.h/2);
        ctx.lineTo(cx+c.w/2+Math.cos(ang)*c.h*0.78, cy+c.h/2+Math.sin(ang)*c.h*0.78);
        ctx.stroke();
      }
    }
  } else {
    // 核心熔毁：破口透出稳定白光（第二关终点）
    const dg = ctx.createLinearGradient(0, cy, 0, cy+c.h);
    dg.addColorStop(0,"#eaffff"); dg.addColorStop(1,"#ffd27a");
    ctx.fillStyle=dg; ctx.fillRect(cx, cy, c.w, c.h);
    ctx.globalAlpha = .3 + .15*Math.sin(perfNow/120);
    ctx.fillStyle="#fff3a0"; ctx.fillRect(cx-30, cy-20, c.w+60, c.h+40);
    ctx.globalAlpha=1;
  }

  // ---- 上下炮舱（旋转炮塔，可被摧毁解除护盾）----
  for(const g of b.cannons){
    const gx = g.x-cam + g.w/2, gy = g.y + g.h/2;
    // 支架
    ctx.strokeStyle="#2c343d"; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(gx+g.w*0.6, gy); ctx.lineTo(gx+g.w*0.6+30, gy); ctx.stroke();
    // 炮舱圆壳
    ctx.fillStyle = g.dead ? "#2a2f36" : "#48525f";
    ctx.beginPath(); ctx.arc(gx, gy, g.w/2, 0, 7); ctx.fill();
    ctx.fillStyle = g.dead ? "#22262c" : "#5c6875";
    ctx.beginPath(); ctx.arc(gx, gy, g.w/2-7, 0, 7); ctx.fill();
    if(!g.dead){
      // 八个炮口围绕（旋转）
      ctx.fillStyle="#20262c";
      for(let k=0;k<8;k++){
        const ang = b.t*0.045 + k*Math.PI/4;
        const ex = gx + Math.cos(ang)*(g.w/2-1), ey = gy + Math.sin(ang)*(g.w/2-1);
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang); ctx.fillRect(-9, -3.5, 12, 7); ctx.restore();
      }
      // 中心红眼
      ctx.fillStyle = (Math.floor(b.t/12)%2) ? "#ff5b3d" : "#7a1a10";
      ctx.beginPath(); ctx.arc(gx, gy, 6, 0, 7); ctx.fill();
    } else {
      // 废炮舱：焦黑破口 + 冒烟
      ctx.fillStyle="#0e0f12";
      ctx.beginPath(); ctx.arc(gx-3, gy+2, 9, 0, 7); ctx.fill();
      ctx.globalAlpha = .3; ctx.fillStyle="#6a6a72";
      ctx.beginPath(); ctx.arc(gx-6, gy-14-((perfNow/90)%14), 5, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ---- 血条 / 状态 ----
  if(!b.dead){
    const alive = b.cannons.filter(g=>!g.dead).length;
    ctx.fillStyle="#000a"; ctx.fillRect(W/2-170, 24, 340, 18);
    // 护盾期显示炮舱剩余进度，解除后显示核心血量
    const ratio = c.shielded ? alive/2 : c.hp/c.maxHp;
    ctx.fillStyle = c.shielded ? "#5afff0" : "#ff5b3d";
    ctx.fillRect(W/2-168, 27, 336*Math.max(0, ratio), 13);
    ctx.fillStyle="#fff"; ctx.font="12px monospace";
    ctx.fillText(c.shielded ? "反应堆护盾力场 — 先摧毁炮舱 (" + (2-alive) + "/2)" : "反应堆核心", W/2-70, 56);
  }
}
function drawBoss(){
  if(boss.kind === "reactor") return drawReactor();
  const b = boss, wx = b.wallX - cam;
  if(wx > W + 100) return;
  // 要塞墙体
  ctx.fillStyle="#4a4440";
  ctx.fillRect(wx, 0, LEVEL_W - b.wallX + 300, GROUND_Y);
  ctx.fillStyle="#3a3531";
  for(let wy=0; wy<GROUND_Y; wy+=40) ctx.fillRect(wx, wy, LEVEL_W-b.wallX+300, 3);
  // 铆钉
  ctx.fillStyle="#5a544e";
  for(let wy=20; wy<GROUND_Y; wy+=60)
    for(let rx=wx+18; rx<wx+150; rx+=44) ctx.fillRect(rx, wy, 6, 6);
  // 弱点核心（大门中央，闪烁）
  const c = b.core, cx = c.x-cam;
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(cx-6, c.y-6, c.w+12, c.h+12);
  if(!c.dead){
    const blink = Math.floor(b.t/12)%2===0;
    ctx.fillStyle = blink ? "#ff5b3d" : "#8a1a10";
    ctx.fillRect(cx, c.y, c.w, c.h);
    ctx.fillStyle = blink ? "#ffd0b0" : "#5a1a10";
    ctx.beginPath(); ctx.arc(cx+c.w/2, c.y+c.h/2, 14, 0, 7); ctx.fill();
  } else {
    // 核心被摧毁：要塞大门敞开，透出通关之光
    const dg = ctx.createLinearGradient(0, c.y, 0, c.y+c.h);
    dg.addColorStop(0,"#fff8d0"); dg.addColorStop(1,"#ffb347");
    ctx.fillStyle=dg; ctx.fillRect(cx, c.y, c.w, c.h);
    ctx.globalAlpha = 0.22 + 0.1*Math.sin(perfNow/120);
    ctx.fillStyle="#fff3a0"; ctx.fillRect(cx-24, c.y-18, c.w+48, c.h+36);
    ctx.globalAlpha=1;
  }
  // 上下两门火炮
  for(const g of b.cannons){
    const gx = g.x-cam, gy=g.y;
    ctx.fillStyle = g.dead ? "#2f2f2f" : "#3a3f4a";
    ctx.fillRect(gx, gy, g.w, g.h);
    if(!g.dead){
      ctx.fillStyle="#565e6e"; ctx.fillRect(gx+g.w-14, gy+4, 14, g.h-8);
      ctx.fillStyle = (Math.floor(g.t/20)%2)?"#ff5b3d":"#5a1a10";
      ctx.beginPath(); ctx.arc(gx+10, gy+g.h/2, 6, 0, 7); ctx.fill();
    }
  }
  // 核心血条
  if(!b.dead){
    ctx.fillStyle="#000a"; ctx.fillRect(W/2-160, 24, 320, 16);
    ctx.fillStyle="#ff5b3d"; ctx.fillRect(W/2-158, 26, 316*c.hp/c.maxHp, 12);
    ctx.fillStyle="#fff"; ctx.font="12px monospace"; ctx.fillText("要塞核心", W/2-30, 56);
  }
}

function drawBullets(){
  for(const b of bullets){
    if(b.beam){ // 镭射光束（等级越高越粗）
      const ex=b.x+b.dx*950, ey=b.y+b.dy*950;
      const bw = b.bw||7;
      ctx.globalAlpha = Math.min(1, b.life/8);
      ctx.lineCap="round";
      ctx.strokeStyle="#5afff0"; ctx.lineWidth=bw;
      ctx.beginPath(); ctx.moveTo(b.x-cam,b.y); ctx.lineTo(ex-cam,ey); ctx.stroke();
      ctx.strokeStyle="#eaffff"; ctx.lineWidth=Math.max(2, bw*0.4);
      ctx.beginPath(); ctx.moveTo(b.x-cam,b.y); ctx.lineTo(ex-cam,ey); ctx.stroke();
      ctx.globalAlpha=1;
      continue;
    }
    if(b.bomb){ // 抛物线炸弹：大号黑铁球 + 高光 + 引信火花
      const blink = Math.floor(perfNow/80)%2===0;
      ctx.fillStyle="#1c1c20"; ctx.beginPath(); ctx.arc(b.x+7, b.y+7, 11, 0, 7); ctx.fill();
      ctx.fillStyle="#3c3c46"; ctx.beginPath(); ctx.arc(b.x+4, b.y+4, 5, 0, 7); ctx.fill();
      ctx.fillStyle="#6a6a75"; ctx.beginPath(); ctx.arc(b.x+3.5, b.y+3.5, 2, 0, 7); ctx.fill();
      ctx.fillStyle="#5a5a62"; ctx.fillRect(b.x+5, b.y-4, 5, 5);
      ctx.fillStyle = blink ? "#ffe86b" : "#ff5b1a";
      ctx.beginPath(); ctx.arc(b.x+7.5, b.y-6, 3, 0, 7); ctx.fill();
      continue;
    }
    ctx.fillStyle="#ffe86b";
    ctx.fillRect(b.x-cam-3, b.y-3, 6, 6);
  }
  ctx.fillStyle="#ff7b5b";
  for(const b of ebullets){
    ctx.beginPath(); ctx.arc(b.x-cam, b.y, b.r||4.5, 0, 7); ctx.fill();
  }
}
function drawParticles(){
  for(const q of particles){
    ctx.globalAlpha = Math.min(1, q.life/20);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x-cam-2, q.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;
}
function drawPowerups(){
  for(const pu of powerups){
    if(pu.taken) continue;
    const x=pu.x-cam, y=pu.y+Math.sin(pu.bob)*5;
    // 胶囊外壳
    ctx.fillStyle="#c0c8d8"; ctx.fillRect(x,y,pu.w,pu.h);
    ctx.fillStyle="#d42a2a"; ctx.fillRect(x+2,y+2,pu.w-4,pu.h-4);
    ctx.fillStyle="#fff"; ctx.fillRect(x+3,y+3,pu.w-6,2);
    // 枪械剪影
    ctx.fillStyle="#101418";
    if(pu.type==="M"){ // 机枪：粗枪身 + 弹匣 + 枪托
      ctx.fillRect(x+5,y+11,20,6);
      ctx.fillRect(x+11,y+17,5,6);
      ctx.fillRect(x+22,y+9,7,3);
    } else if(pu.type==="S"){ // 散弹枪：三根扩散枪管
      ctx.save(); ctx.translate(x+7,y+16);
      for(let k=-1;k<=1;k++){
        ctx.save(); ctx.rotate(k*0.35);
        ctx.fillRect(0,-1.5,20,3);
        ctx.restore();
      }
      ctx.fillRect(0,-1,8,7);
      ctx.restore();
    } else if(pu.type==="B"){ // 炸弹：圆球 + 引信 + 火花
      ctx.beginPath(); ctx.arc(x+17,y+16,8,0,7); ctx.fill();
      ctx.fillStyle="#3a3a42"; ctx.beginPath(); ctx.arc(x+14,y+13,2.5,0,7); ctx.fill();
      ctx.fillStyle="#5a5a62"; ctx.fillRect(x+15,y+5,4,5);
      ctx.fillStyle="#ffb347"; ctx.fillRect(x+16,y+2,3,3);
    } else { // 镭射枪：长管 + 线圈环
      ctx.fillRect(x+4,y+13,24,4);
      for(let r=0;r<3;r++) ctx.fillRect(x+8+r*5,y+10,3,10);
      ctx.fillRect(x+12,y+17,5,5);
    }
  }
}
function drawHUD(){
  ctx.fillStyle="#fff"; ctx.font="bold 16px monospace";
  ctx.fillText("分数 " + score, 20, 32);
  // 关卡标签
  ctx.fillStyle = LEVEL_IDX===1 ? "#7fd7a0" : "#7fbcff";
  ctx.font="bold 13px monospace";
  ctx.fillText(LEVEL_IDX===1 ? "第 1 关 · 丛林突击" : "第 2 关 · 基地突入", 20, 54);
  // 生命（小人图标）
  for(let i=0;i<Math.max(0,lives);i++){
    ctx.fillStyle="#e8a878"; ctx.fillRect(20+i*24, 68, 10, 12);
    ctx.fillStyle="#d42a2a"; ctx.fillRect(20+i*24, 66, 10, 4);
  }
  if(player.weapon!=="N"){
    const names = {S:"散弹枪", M:"机枪", L:"镭射枪", B:"炸弹"};
    const lv = player.wlv[player.weapon]||0;
    ctx.fillStyle="#ffd34d";
    ctx.fillText(player.weapon + " " + names[player.weapon] + (lv>=1 ? " Lv"+(lv+1) : ""), 20, 104);
  }
  // 进度条
  ctx.fillStyle="#0008"; ctx.fillRect(W/2-150, H-24, 300, 8);
  ctx.fillStyle="#4da6ff"; ctx.fillRect(W/2-150, H-24, 300*Math.min(1,cam/(LEVEL_W-W)), 8);
}
function drawOverlay(title, sub, color){
  ctx.fillStyle="#000c"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle=color; ctx.font="bold 52px monospace";
  ctx.fillText(title, W/2, H/2-40);
  ctx.fillStyle="#cfd8e3"; ctx.font="18px monospace";
  ctx.fillText(sub, W/2, H/2+10);
  if(Math.floor(perfNow/500)%2===0){
    ctx.fillStyle="#ffd34d"; ctx.font="16px monospace";
    ctx.fillText("- 按 Enter " + (state==="title"?"开始游戏":"重新开始") + " -", W/2, H/2+70);
  }
  ctx.textAlign="left";
}

let perfNow = 0;
function render(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake*0.6, (Math.random()-0.5)*shake*0.6);
  drawBG();
  if(state==="insert") drawInsert();
  if(state==="title"){
    ctx.restore();
    drawOverlay("魂斗罗", "第 1 关 · 丛林突击　→　第 2 关 · 基地突入", "#4da6ff");
    return;
  }
  drawTerrain();
  drawCrates();
  drawPowerups();
  drawMedals();
  for(const e of enemies) drawSoldier(e);
  drawBoss();
  if(player.slideT > 0) drawPlayerSlide();
  else if(player.crouch) drawPlayerCrouch(); else drawPlayer();
  drawBullets();
  drawParticles();
  ctx.restore();
  drawHUD();
  if(state==="over"){ drawOverlay("游戏结束", (LEVEL_IDX===1?"第一关":"第二关") + " · 击杀 " + killCount + " · 得分 " + score, "#ff5b3d"); }
  // 关卡开场横幅
  if(bannerT>0 && state==="play"){
    const a = Math.min(1, Math.min(bannerT, 170-bannerT)/30);
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign="center";
    ctx.fillStyle="#0a1018"; ctx.fillRect(0, H/2-58, W, 96);
    ctx.fillStyle="#7fbcff"; ctx.font="bold 40px monospace";
    ctx.fillText("第 2 关 · 基地突入", W/2, H/2-10);
    ctx.fillStyle="#cfd8e3"; ctx.font="15px monospace";
    ctx.fillText("潜入敌军基地 —— 摧毁反应堆核心", W/2, H/2+22);
    ctx.textAlign="left"; ctx.globalAlpha=1;
  }
  if(state==="win" && LEVEL_IDX===1){
    // 第二关开启界面
    ctx.fillStyle="#000d"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#4dff88"; ctx.font="bold 48px monospace";
    ctx.fillText("第一关 突破！", W/2, H/2-90);
    // 大门开启图示
    ctx.fillStyle="#4a4440"; ctx.fillRect(W/2-70, H/2-50, 140, 120);
    const dg = ctx.createLinearGradient(0,H/2-40,0,H/2+60);
    dg.addColorStop(0,"#fff8d0"); dg.addColorStop(1,"#ffb347");
    ctx.fillStyle=dg; ctx.fillRect(W/2-40, H/2-40, 80, 110);
    ctx.fillStyle="#fffef0"; ctx.globalAlpha=.5+.2*Math.sin(perfNow/150);
    ctx.fillRect(W/2-52, H/2-52, 104, 14);
    ctx.globalAlpha=1;
    ctx.fillStyle="#cfd8e3"; ctx.font="16px monospace";
    ctx.fillText("主角已突入要塞大门 —— 前方就是敌军基地", W/2, H/2+104);
    ctx.fillStyle="#ffd34d"; ctx.font="bold 20px monospace";
    ctx.fillText("得分 " + score + " · 击杀 " + killCount, W/2, H/2+140);
    if(Math.floor(perfNow/500)%2===0){
      ctx.fillStyle="#fff"; ctx.font="16px monospace";
      ctx.fillText("- 按 Enter 进入第二关 -", W/2, H/2+180);
    }
    ctx.textAlign="left";
  }
  if(state==="win" && LEVEL_IDX===2){
    // 全关卡通关
    ctx.fillStyle="#000e"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#ffd34d"; ctx.font="bold 46px monospace";
    ctx.fillText("任务完成！", W/2, H/2-80);
    ctx.fillStyle="#7fbcff"; ctx.font="bold 22px monospace";
    ctx.fillText("反应堆核心已熔毁 —— 敌军基地陷落", W/2, H/2-34);
    ctx.fillStyle="#cfd8e3"; ctx.font="16px monospace";
    ctx.fillText("第一关 · 丛林突击   ✔", W/2, H/2+14);
    ctx.fillText("第二关 · 基地突入   ✔", W/2, H/2+44);
    ctx.fillStyle="#ffd34d"; ctx.font="bold 22px monospace";
    ctx.fillText("总得分 " + score + " · 总击杀 " + killCount, W/2, H/2+92);
    if(Math.floor(perfNow/500)%2===0){
      ctx.fillStyle="#fff"; ctx.font="16px monospace";
      ctx.fillText("- 按 Enter 重新开始 -", W/2, H/2+140);
    }
    ctx.textAlign="left";
  }
}

// ---------- 游戏状态 ----------
const gameState = {
  onEnter(){
    if(state==="title" || state==="over") { startGame(); return; }
    if(state==="win"){
      if(LEVEL_IDX === 1) nextLevel();
      else startGame();
    }
  }
};

// ---------- 主循环 ----------
state = "title";
let last = 0;
function loop(t){
  perfNow = t;
  const dt = Math.min(50, t - last); last = t;
  // 固定步长近似（60fps 基准）
  update();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
