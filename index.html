    ctx.fillStyle="#22262a"; ctx.fillRect(gx, gy, g.w, 6);
    if(!g.dead){
      // 炮塔（朝左，随主角上下微调）
      let aim = Math.atan2(chestY()-my, (player.x+player.w/2)-mx);
      if(Math.cos(aim) > 0) aim = Math.PI - aim;              // 强制朝左半平面
      let rel = aim - Math.PI;
      rel = Math.max(-0.62, Math.min(0.62, rel));
      const ang = Math.PI + rel;
      // 后座
      const rec = (g.t % 150 < 8) ? 4 : 0;
      // 炮管
      ctx.save(); ctx.translate(mx, my); ctx.rotate(ang); ctx.translate(rec, 0);
      ctx.fillStyle="#1b2025"; ctx.fillRect(-2, -7, 30, 14);
      ctx.fillStyle="#3a434c"; ctx.fillRect(-2, -7, 30, 3.4);
      ctx.fillStyle="#2a3138"; ctx.fillRect(24, -9, 9, 18);   // 炮口制退器
      ctx.fillStyle="#0a0c0e"; ctx.fillRect(31, -4.6, 4, 9.2);
      ctx.fillStyle="#555f69"; ctx.fillRect(2, -9, 5, 3);     // 箍
      if(g.t % 150 < 4){
        ctx.fillStyle="#ffe58a"; ctx.globalAlpha=.9;
        ctx.beginPath(); ctx.moveTo(35,-6); ctx.lineTo(48,-2); ctx.lineTo(35,2); ctx.closePath(); ctx.fill();
        ctx.globalAlpha=1;
      }
      ctx.restore();
      // 炮塔圆壳
      ctx.fillStyle="#20252b"; ctx.beginPath(); ctx.arc(mx, my, 19, 0, 7); ctx.fill();
      ctx.fillStyle="#454e58"; ctx.beginPath(); ctx.arc(mx, my, 16, 0, 7); ctx.fill();
      ctx.fillStyle="#5b6570"; ctx.beginPath(); ctx.arc(mx-2, my-3, 13, 0, 7); ctx.fill();
      ctx.fillStyle="#38404a"; ctx.beginPath(); ctx.arc(mx, my, 7, 0, 7); ctx.fill();
      // 瞄准红灯
      const blink = Math.floor(g.t/9)%2===0;
      ctx.fillStyle = blink ? "#ff5b3d" : "#7a1a10";
      ctx.beginPath(); ctx.arc(mx+7, my-6, 3.4, 0, 7); ctx.fill();
      ctx.fillStyle = blink ? "#ffd0b0" : "#5a1a10";
      ctx.beginPath(); ctx.arc(mx+7, my-6, 1.6, 0, 7); ctx.fill();
    } else {
      // 击毁：焦黑炮塔 + 破口 + 浓烟
      ctx.fillStyle="#20242a"; ctx.beginPath(); ctx.arc(mx, my, 18, 0, 7); ctx.fill();
      ctx.fillStyle="#0d0f11"; ctx.beginPath(); ctx.arc(mx-3, my+3, 10, 0, 7); ctx.fill();
      ctx.fillStyle="#111315";
      ctx.beginPath(); ctx.moveTo(mx-8,my-6); ctx.lineTo(mx+9,my-9); ctx.lineTo(mx+4,my+2); ctx.closePath(); ctx.fill();
      for(let s=0;s<3;s++){
        const t2 = (perfNow/70 + s*11) % 34;
        ctx.globalAlpha = Math.max(0, .42 - t2*0.012);
        ctx.fillStyle="#6a6a72";
        ctx.beginPath(); ctx.arc(mx-6 + Math.sin(t2*0.3)*5, my-14-t2*1.6, 5+t2*0.28, 0, 7); ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle="#ff7a3d";
      ctx.beginPath(); ctx.arc(mx-4, my+5, 2.2, 0, 7); ctx.fill();
    }
  }

  // ---- 要塞核心血条 ----
  if(!b.dead){
    const bw = 340, bx = W/2-bw/2, by = 24;
    ctx.fillStyle="#000a"; ctx.fillRect(bx-4, by-4, bw+8, 26);
    ctx.fillStyle="#1a1c20"; ctx.fillRect(bx, by, bw, 18);
    const ratio = Math.max(0, core.hp/core.maxHp);
    ctx.fillStyle = ratio > .35 ? "#ff5b3d" : "#ff2d1a";

    // 分段刻度
    ctx.fillStyle="rgba(0,0,0,.45)";
    for(let s=1;s<10;s++) ctx.fillRect(bx + (bw/10)*s, by+2, 2, 14);
    ctx.fillStyle="#ffd0b0"; ctx.fillRect(bx+2, by+2, (bw-4)*ratio, 3);
    ctx.fillStyle="#fff"; ctx.font="bold 12px monospace"; ctx.textAlign="center";
    ctx.fillText("要 塞 核 心", W/2, by+34); ctx.textAlign="left";
  }
}

function drawBullets(){
  for(const b of bullets){
    if(b.beam){ // 镭射光束（等级越高越粗）
      const ex=b.x+b.dx*950, ey=b.y+b.dy*950;
      const bw = b.bw||7;
      ctx.globalAlpha = Math.min(1, b.life/8);
      ctx.lineCap="round";
      ctx.strokeStyle="#5afff0"; ctx.lineWidth=bw;
      ctx.beginPath(); ctx.moveTo(b.x-cam,b.y); ctx.lineTo(ex-cam,ey); ctx.stroke();
      ctx.strokeStyle="#eaffff"; ctx.lineWidth=Math.max(2, bw*0.4);
      ctx.beginPath(); ctx.moveTo(b.x-cam,b.y); ctx.lineTo(ex-cam,ey); ctx.stroke();
      ctx.globalAlpha=1;
      continue;
    }
    if(b.bomb){ // 抛物线炸弹：大号黑铁球 + 高光 + 引信火花
      const blink = Math.floor(perfNow/80)%2===0;
      ctx.fillStyle="#1c1c20"; ctx.beginPath(); ctx.arc(b.x+7, b.y+7, 11, 0, 7); ctx.fill();
      ctx.fillStyle="#3c3c46"; ctx.beginPath(); ctx.arc(b.x+4, b.y+4, 5, 0, 7); ctx.fill();
      ctx.fillStyle="#6a6a75"; ctx.beginPath(); ctx.arc(b.x+3.5, b.y+3.5, 2, 0, 7); ctx.fill();
      ctx.fillStyle="#5a5a62"; ctx.fillRect(b.x+5, b.y-4, 5, 5);
      ctx.fillStyle = blink ? "#ffe86b" : "#ff5b1a";
      ctx.beginPath(); ctx.arc(b.x+7.5, b.y-6, 3, 0, 7); ctx.fill();
      continue;
    }
    ctx.fillStyle="#ffe86b";
    ctx.fillRect(b.x-cam-3, b.y-3, 6, 6);
  }
  for(const b of ebullets){
    if(b.shell){
      // 坦克炮弹：一颗红色实心圆弹（不是激光束）
      const bx2 = b.x-cam, by2 = b.y, rr = b.r || 5.6;
      ctx.globalAlpha=.35; ctx.fillStyle="#ff2f14";
      ctx.beginPath(); ctx.arc(bx2, by2, rr*2.1, 0, 7); ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle="#8a1408";
      ctx.beginPath(); ctx.arc(bx2, by2, rr+1.2, 0, 7); ctx.fill();
      ctx.fillStyle="#ff3b1f";
      ctx.beginPath(); ctx.arc(bx2, by2, rr, 0, 7); ctx.fill();
      ctx.fillStyle="#ffb9a8";
      ctx.beginPath(); ctx.arc(bx2-rr*0.32, by2-rr*0.32, rr*0.38, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle="#ff7b5b";
      ctx.beginPath(); ctx.arc(b.x-cam, b.y, b.r||4.5, 0, 7); ctx.fill();
    }
  }

// 枪械剪影图标（武器包 / 阵亡掉落共用）
function drawGunIcon(type, x, y){
  ctx.fillStyle="#101418";
  if(type==="M"){ // 机枪：粗枪身 + 弹匣 + 枪托
    ctx.fillRect(x+5,y+11,20,6);
    ctx.fillRect(x+11,y+17,5,6);
    ctx.fillRect(x+22,y+9,7,3);
  } else if(type==="S"){ // 散弹枪：三根扩散枪管
    ctx.save(); ctx.translate(x+7,y+16);
    for(let k=-1;k<=1;k++){
      ctx.save(); ctx.rotate(k*0.35);
      ctx.fillRect(0,-1.5,20,3);
      ctx.restore();
    }
    ctx.fillRect(0,-1,8,7);
    ctx.restore();
  } else if(type==="B"){ // 炸弹：圆球 + 引信 + 火花
    ctx.beginPath(); ctx.arc(x+17,y+16,8,0,7); ctx.fill();
    ctx.fillStyle="#3a3a42"; ctx.beginPath(); ctx.arc(x+14,y+13,2.5,0,7); ctx.fill();
    ctx.fillStyle="#5a5a62"; ctx.fillRect(x+15,y+5,4,5);
    ctx.fillStyle="#ffb347"; ctx.fillRect(x+16,y+2,3,3);
  } else { // 镭射枪：长管 + 线圈环
    ctx.fillRect(x+4,y+13,24,4);
    for(let r=0;r<3;r++) ctx.fillRect(x+8+r*5,y+10,3,10);
    ctx.fillRect(x+12,y+17,5,5);
  }
}

function drawReveal(){

  g.addColorStop(0,"#08040e"); g.addColorStop(1,"#1d1028");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  }
  // 舰体中央那只"眼"
  const eyeGlow = 0.4 + 0.3*Math.sin(t*0.05);
  const eg = ctx.createRadialGradient(W/2, my+60, 4, W/2, my+60, 74);
  eg.addColorStop(0, "rgba(255,80,140," + eyeGlow + ")"); eg.addColorStop(1, "rgba(255,80,140,0)");
  ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(W/2, my+60, 74, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#ffd7e6"; ctx.beginPath(); ctx.ellipse(W/2, my+60, 46, 22, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#1a0c1e"; ctx.beginPath(); ctx.ellipse(W/2, my+60, 9, 19, 0, 0, 6.283); ctx.fill();
  // 前景崩落的地板
  ctx.fillStyle = "#0b0710";
  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H-44);
  for(let x=0;x<=W;x+=48) ctx.lineTo(x, H-44 + Math.sin(x*0.03 + t*0.16)*12);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  // 字幕
  ctx.textAlign="center";
  const msgs = [
    [26,  "工厂塌了。可脚下不是泥土 ——"],
    [104, "是一层冰冷的金属。"],
    [182, "叛军所有超越时代的武器，都来自这艘埋在基地底下的母舰。"],
    [262, "第 4 关 · 外星巢穴"],
  ];
  for(const [at, msg] of msgs){
    if(t < at) continue;
    const a = Math.min(1, (t - at)/18);
    ctx.globalAlpha = a;
    const isTitle = msg.startsWith("第 4 关");
    ctx.fillStyle = isTitle ? "#c08bff" : "#cfd8e3";
    ctx.font = isTitle ? "bold 26px monospace" : "16px monospace";
    ctx.fillText(msg, W/2, isTitle ? 148 : 96 + msgs.findIndex(m=>m[0]===at)*30);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}
function drawEscapeFx(){
  if(state !== "escape") return;
  const k = Math.min(1, stateTimer/160);
  ctx.globalAlpha = .28*k; ctx.fillStyle="#ff1a1a"; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 1;
  ctx.textAlign="center";
  ctx.fillStyle="#fff"; ctx.font="bold 28px monospace";
  if(stateTimer < 210) ctx.fillText("冲出去了 —— 整座工厂塌了！", W/2, 132);
  ctx.textAlign="left";
}
function drawHUD(){
  ctx.fillStyle="#fff"; ctx.font="bold 16px monospace";
  ctx.fillText("分数 " + score, 20, 32);
  // 关卡标签
  ctx.fillStyle = STAGE_INFO[LEVEL_IDX].color;
  ctx.font="bold 13px monospace";
  ctx.fillText(stageLabel(LEVEL_IDX), 20, 54);
  // 生命（小人图标）
  for(let i=0;i<Math.max(0,lives);i++){
    ctx.fillStyle="#e8a878"; ctx.fillRect(20+i*24, 68, 10, 12);
    ctx.fillStyle="#d42a2a"; ctx.fillRect(20+i*24, 66, 10, 4);
  }
  if(player.weapon!=="N"){
    const names = {S:"散弹枪", M:"机枪", L:"镭射枪", B:"炸弹"};
    const lv = player.wlv[player.weapon]||0;
    ctx.fillStyle="#ffd34d";
    ctx.fillText(player.weapon + " " + names[player.weapon] + " Lv" + (lv+1), 20, 104);
    for(let i=0;i<3;i++){
      ctx.fillStyle = i<=lv ? "#ffd34d" : "#3a4048";
      ctx.fillRect(20 + i*12, 110, 9, 4);
    }
  } else {
    ctx.fillStyle="#8b96a3";
    ctx.fillText("N 制式步枪 Lv1", 20, 104);
  }
  // 进度条（第三关：还差多远到出口 + 身后液面的位置）
  if(finalRun && liquid){
    const total = Math.max(1, runStartX - runExitX);
    const prog = Math.max(0, Math.min(1, (runStartX - player.x)/total));
    const lq   = Math.max(0, Math.min(1.06, (runStartX - liquid.x)/total));
    ctx.fillStyle="#0008"; ctx.fillRect(W/2-150, H-24, 300, 8);
    ctx.fillStyle="#4dff88"; ctx.fillRect(W/2-150, H-24, 300*prog, 8);
    ctx.fillStyle="#ff3b2f"; ctx.fillRect(W/2-150 + 300*lq - 2, H-28, 4, 16);
    ctx.fillStyle="#ffb0a4"; ctx.font="11px monospace"; ctx.textAlign="center";
    ctx.fillText("出口", W/2-150, H-30);
    ctx.textAlign="left";
  } else {
    ctx.fillStyle="#0008"; ctx.fillRect(W/2-150, H-24, 300, 8);
    ctx.fillStyle="#4da6ff"; ctx.fillRect(W/2-150, H-24, 300*Math.min(1,cam/(LEVEL_W-W)), 8);
  }
  // 小 Boss 血条（第 4~8 关：各母舰的中段守卫）
  if(mini && !mini.dead && Math.abs(player.x - mini.x) < 1500){
    const bw = 440, bx = W/2 - bw/2, by = 92;
    ctx.fillStyle = "#000a"; ctx.fillRect(bx-4, by-20, bw+8, 28);
    ctx.fillStyle = "#2a1f3a"; ctx.fillRect(bx, by, bw, 12);
    const k = Math.max(0, mini.hp / mini.maxHp);
    const g = ctx.createLinearGradient(bx, 0, bx+bw, 0);
    g.addColorStop(0, "#7dfce8"); g.addColorStop(1, mini.rage ? "#ff2f14" : "#ff7b3d");
    ctx.fillStyle = g; ctx.fillRect(bx, by, bw*k, 12);
    ctx.fillStyle = "#e8f4ff"; ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
    ctx.fillText(mini.name + (mini.rage ? " · 狂暴" : ""), W/2, by - 6);
    ctx.textAlign = "left";
  }
}
function drawStageBreak(){
  const d = STAGE_BREAK[nextStageIdx];
  if(!d) return;
  const t = stateTimer;
  ctx.fillStyle = "#02040a"; ctx.fillRect(0,0,W,H);
  // 背景：远处的母舰剪影 + 星点 + 扫描线
  for(let i=0;i<70;i++){
    const px = (i*173) % W, py = (i*97) % H;
    ctx.globalAlpha = .12 + .35*Math.abs(Math.sin(i + perfNow*0.001));
    ctx.fillStyle = "#9fc8e8"; ctx.fillRect(px, py, 1.6, 1.6);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(6,10,18,.72)";
  ctx.beginPath(); ctx.ellipse(W/2, H*0.62, 400, 120, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "rgba(120,190,255,.16)"; ctx.lineWidth = 2;
  for(let k=0;k<3;k++){
    ctx.beginPath(); ctx.ellipse(W/2, H*0.62, 300 + k*60, 84 + k*20, 0, 0, 6.283); ctx.stroke();
  }
  // 扫描线
  ctx.globalAlpha = .06; ctx.fillStyle = "#cfe8ff";
  const scanY = (perfNow*0.08) % H;
  ctx.fillRect(0, scanY, W, 2);
  ctx.globalAlpha = 1;

  const a = Math.min(1, t/24);
  ctx.textAlign = "center";
  ctx.globalAlpha = a;
  ctx.fillStyle = d.color; ctx.font = "bold 13px monospace";
  ctx.fillText("传 来 的 坐 标 · 下 一 艘 母 舰", W/2, 132);
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 40px monospace";
  ctx.fillText(d.title, W/2, 190);
  // 分隔线
  ctx.strokeStyle = d.color; ctx.globalAlpha = a*0.6;
  ctx.beginPath(); ctx.moveTo(W/2-300, 214); ctx.lineTo(W/2+300, 214); ctx.stroke();
  ctx.globalAlpha = a;
  // 正文（按字符折行）
  ctx.font = "17px monospace"; ctx.fillStyle = "#cfd8e3";
  let ly = 258;
  for(const para of d.lines){
    let line = "";
    for(const ch of para){
      line += ch;
      if(line.length >= 40){ ctx.fillText(line, W/2, ly); line = ""; ly += 28; }
    }
    if(line){ ctx.fillText(line, W/2, ly); ly += 28; }
    ly += 10;
  }
  // 下一关
  const info = STAGE_INFO[nextStageIdx];
  ctx.fillStyle = info.color; ctx.font = "bold 24px monospace";
  ctx.fillText("下一站：" + stageLabel(nextStageIdx), W/2, H - 104);
  if(Math.floor(perfNow/450)%2 === 0){
    ctx.fillStyle = "#e8f0ff"; ctx.font = "14px monospace";
    ctx.fillText("- 按 Enter 立即出发 -", W/2, H - 70);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}
function drawOverlay(title, sub, color){
  ctx.fillStyle="#000c"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle=color; ctx.font="bold 52px monospace";
  ctx.fillText(title, W/2, H/2-40);
  ctx.fillStyle="#cfd8e3"; ctx.font="18px monospace";
  const lines = String(sub).split("\n");
  lines.forEach((ln, i) => ctx.fillText(ln, W/2, H/2+10 + i*24));
  if(Math.floor(perfNow/500)%2===0){
    ctx.fillStyle="#ffd34d"; ctx.font="16px monospace";
    ctx.fillText("- 按 Enter " + (state==="title"?"开始游戏":"重新开始") + " -", W/2, H/2+70);
  }
  ctx.textAlign="left";
}

let perfNow = 0;
function render(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake*0.6, (Math.random()-0.5)*shake*0.6);
  drawBG();
  if(state==="insert") drawInsert();
  if(state==="title"){
    ctx.restore();
    drawOverlay("魂斗罗",
      "第 1 关 丛林突击　→　第 2 关 基地突入\n" +
      "第 3 关 逃出基地　→　第 4 关 外星巢穴\n" +
      "第 5 关 深海母舰　→　第 6 关 沙海母舰\n" +
      "第 7 关 冰盖母舰　→　第 8 关 轨道母舰", "#4da6ff");
    return;
  }
  if(state==="reveal"){
    ctx.restore();
    drawReveal();
    return;
  }
  if(state==="stagebreak"){
    ctx.restore();
    drawStageBreak();
    return;
  }
  drawTerrain();
  drawExitDoor();
  drawHoles();
  drawRedPools();
  drawCrates();
  drawPowerups();
  drawMedals();
  drawDrops();
  for(const e of enemies) drawSoldier(e);
  drawBoss();
  drawIronBalls();
  drawFleeSquad();
  if(player.slideT > 0) drawPlayerSlide();
  else if(player.rolling && !player.onGround) drawPlayerRoll();
  else if(player.crouch) drawPlayerCrouch(); else drawPlayer();
  drawQuestionMark();
  drawLiquidWall();
  drawDebris();
  drawBullets();
  drawParticles();
  ctx.restore();
  drawHUD();
  drawAftermathText();
  drawEscapeFx();
  if(state==="over"){ drawOverlay("游戏结束", stageLabel(LEVEL_IDX) + " · 击杀 " + killCount + " · 得分 " + score, "#ff5b3d"); }
  // 关卡开场横幅
  if(bannerT>0 && state==="play"){
    const info = STAGE_INFO[LEVEL_IDX];
    const a = Math.max(0, Math.min(1, Math.min(bannerT, 230-bannerT)/30));
    const bTitle = stageLabel(LEVEL_IDX);
    const bSub   = info.sub;
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign="center";
    ctx.fillStyle="#0a1018"; ctx.fillRect(0, H/2-58, W, 96);
    ctx.fillStyle = info.color; ctx.font="bold 40px monospace";
    ctx.fillText(bTitle, W/2, H/2-10);
    ctx.fillStyle="#cfd8e3"; ctx.font="15px monospace";
    ctx.fillText(bSub, W/2, H/2+22);
    ctx.textAlign="left"; ctx.globalAlpha=1;
  }
  if(state==="win" && LEVEL_IDX===1){
    // 第二关开启界面
    ctx.fillStyle="#000d"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#4dff88"; ctx.font="bold 48px monospace";
    ctx.fillText("第一关 突破！", W/2, H/2-90);
    // 大门开启图示
    ctx.fillStyle="#4a4440"; ctx.fillRect(W/2-70, H/2-50, 140, 120);
    const dg = ctx.createLinearGradient(0,H/2-40,0,H/2+60);
    dg.addColorStop(0,"#fff8d0"); dg.addColorStop(1,"#ffb347");
    ctx.fillStyle=dg; ctx.fillRect(W/2-40, H/2-40, 80, 110);
    ctx.fillStyle="#fffef0"; ctx.globalAlpha=.5+.2*Math.sin(perfNow/150);
    ctx.fillRect(W/2-52, H/2-52, 104, 14);
    ctx.globalAlpha=1;
    ctx.fillStyle="#cfd8e3"; ctx.font="16px monospace";
    ctx.fillText("主角已突入要塞大门 —— 前方就是敌军基地", W/2, H/2+104);
    ctx.fillStyle="#ffd34d"; ctx.font="bold 20px monospace";
    ctx.fillText("得分 " + score + " · 击杀 " + killCount, W/2, H/2+140);
    if(Math.floor(perfNow/500)%2===0){
      ctx.fillStyle="#fff"; ctx.font="16px monospace";
      ctx.fillText("- 按 Enter 进入第二关 -", W/2, H/2+180);
    }
    ctx.textAlign="left";
  }
  if(state==="win" && LEVEL_IDX>=2){
    const finalWin = LEVEL_IDX === 8;
    ctx.fillStyle="#000e"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle = finalWin ? "#ff7ad0" : "#ff8b6a"; ctx.font="bold 44px monospace";
    ctx.fillText(finalWin ? "母巢坠落 · 全剧终" : "逃出生天！", W/2, H/2-150);
    ctx.fillStyle="#c08bff"; ctx.font="bold 18px monospace";
    ctx.fillText(finalWin ? "轨道母舰在高空解体 —— 八艘母舰，一艘不剩"
                          : "整座工厂在身后轰然倒塌", W/2, H/2-112);
    const list = [
      "1 丛林突击  ✔", "2 基地突入  ✔", "3 逃出基地  ✔", "4 外星巢穴  ✔",
      "5 深海母舰  ✔", "6 沙海母舰  ✔", "7 冰盖母舰  ✔", "8 轨道母舰  ✔",
    ];
    ctx.font="15px monospace";
    list.forEach((s, i) => {
      const col = i < 4 ? 0 : 1, row = i % 4;
      ctx.textAlign = "left";
      ctx.fillStyle = "#cfd8e3";
      ctx.fillText(s, W/2 - 300 + col*310, H/2 - 62 + row*30);
    });
    ctx.textAlign="center";
    ctx.fillStyle="#ffd34d"; ctx.font="bold 22px monospace";
    ctx.fillText("总得分 " + score + " · 总击杀 " + killCount, W/2, H/2+92);
    ctx.fillStyle="#8fa0b5"; ctx.font="14px monospace";
    ctx.fillText(finalWin ? "从丛林到轨道，你打穿了整条外星供应链" : "", W/2, H/2+122);
    if(Math.floor(perfNow/500)%2===0){
      ctx.fillStyle="#fff"; ctx.font="16px monospace";
      ctx.fillText("- 按 Enter 重新开始 -", W/2, H/2+160);
    }
    ctx.textAlign="left";
  }
}

// ---------- 游戏状态 ----------
const gameState = {
  onEnter(){
    if(state==="title" || state==="over") { startGame(); return; }
    if(state==="win"){
      if(LEVEL_IDX === 1) nextLevel();
      else startGame();
    }
  }
};

// ---------- 主循环 ----------
state = "title";
let last = 0;
function loop(t){
  perfNow = t;
  const dt = Math.min(50, t - last); last = t;
  // 固定步长近似（60fps 基准）
  update();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
