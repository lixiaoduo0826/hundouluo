function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function sfx(freq, dur, type="square", vol=0.08, slide=0){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), a.currentTime+dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}

  tick(){
    if(!this.on || this.muted) { this.step++; return; }

    this.step++;
  }

// ================================================================
//  第 5~8 关：用生成器铺地形（连续地面，绝不断崖），再手工控制节奏
// ================================================================
function stageRand(seed){
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
// 连续地面：三层台阶之间游走（0 / -stepH / -2*stepH），全程无空洞
function mkGround(w, seed, baseY, stepH, segMin, segMax){
  const rnd = stageRand(seed);
  const pts = [[-100, baseY]];
  let x = 0, lv = 0;
  while(x < w - 200){
    x += segMin + rnd()*(segMax - segMin);
    if(rnd() < 0.55){
      lv = Math.max(0, Math.min(2, lv + (rnd() < 0.5 ? -1 : 1)));
    } else if(rnd() < 0.35){
      lv = 0;
    }
    pts.push([Math.round(x), baseY - lv*stepH]);
  }
  pts.push([w + 300, baseY - lv*stepH]);
  return [{pts}];
}
// 空中栈桥：均匀分布 + 抖动，避开小 Boss 场地与 Boss 前沿
function mkPlatforms(w, seed, n, avoid){
  const rnd = stageRand(seed);
  const out = [];
  for(let i=1;i<=n;i++){
    let x = Math.round(w*i/(n+1) + (rnd()-0.5)*300);
    x = Math.max(140, Math.min(w-900, x));
    if(avoid.some(a => x + 200 > a.l && x < a.r)) continue;
    const y = 268 + Math.round(rnd()*62);
    out.push({x, y, w:150 + Math.round(rnd()*70), h:16});
  }
  return out;
}
// 敌人触发点：沿途布防（px 为敌人落位，py 为悬浮单位高度）
function mkTriggers(w, seed, types, gapMin, gapMax){
  const rnd = stageRand(seed);
  const out = [];
  let x = 300;
  while(x < w - 1250){
    const t = types[Math.floor(rnd()*types.length)];
    const px = x + 480 + rnd()*220;
    out.push({x:Math.round(x), type:t, px:Math.round(px),
              py: Math.round(150 + rnd()*120)});
    x += gapMin + rnd()*(gapMax - gapMin);
  }
  return out;
}
// 武器补给：每 1650px 一个，S/M/L/B 轮换（y 在 loadLevel 里按地面高度换算）
function mkPowerups(w){
  const order = ["S","M","L","B"];
  const out = [];
  let i = 0;
  for(let x = 900; x < w - 900; x += 1650){
    out.push({type: order[i%4], x, dy: 96});
    i++;
  }
  return out;
}
function mkMedals(w){
  const out = [];
  for(let x = 2050; x < w - 1200; x += 2700) out.push({x, dy: 84});
  return out;
}

// ============ 第四关最终 Boss：外星主脑 ============
// 三只眼各自"锁定 → 红色预警 → 光束"，中央核心有护盾；破盾后加地面触须与更密的环形弹幕
function beamHitsPlayer(c){
  const p = player;
  const cx = c.x + c.w/2, cy = c.y + c.h/2;
  const dx = Math.cos(c.gunA), dy = Math.sin(c.gunA);
  const px = (p.x + p.w/2) - cx, py = (p.y + p.h/2) - cy;
  const proj = px*dx + py*dy;
  if(proj < 0) return false;
  const perp = Math.abs(px*(-dy) + py*dx);
  return perp < (c.beamW || 15);           // 光束半宽
}
function updateAlienBoss(b, p){
  const core = b.core;
  core.shielded = b.cannons.some(c => !c.dead);
  const phase2 = core.hp <= core.maxHp * 0.55;
  core.phase = phase2 ? 2 : 1;

  // ---- 三只眼：锁定 → 预警线 30 帧 → 光束 20 帧 ----
  for(const c of b.cannons){
    if(c.dead) continue;
    c.t++;
    const cx = c.x + c.w/2, cy = c.y + c.h/2;
    const period = phase2 ? 124 : 176;
    if(c.warnT <= 0 && c.beamT <= 0 && (c.t % period === 0) && !p.dead){
      c.warnT = 30; c.beamW = phase2 ? 20 : 17;
      c.lockX = p.x + p.w/2; c.lockY = p.y + p.h*0.55;
      c.gunA = Math.atan2(c.lockY - cy, c.lockX - cx);
      sfx(900,.16,"sine",.05,-320);
    }
    if(c.warnT > 0){
      c.warnT--;
      if(c.warnT === 0){
        c.beamT = 20; c.beamHit = false;
        shake = Math.max(shake, 8);
        sfx(1500,.22,"sawtooth",.09,-700);
      }
    }
    if(c.beamT > 0){
      c.beamT--;
      if(!c.beamHit && !p.dead && p.inv <= 0 && beamHitsPlayer(c)){ c.beamHit = true; hurtPlayer(); }
    }
    if(aabb(hitbox(), c) && p.inv <= 0) hurtPlayer();
  }

  // ---- 核心：环形弹幕（护盾期 10 / 破盾 12 / 二阶段 16）----
  if(!core.dead){
    const n = core.shielded ? 10 : (phase2 ? 16 : 12);
    if(b.t % (phase2 ? 170 : 240) === 40){
      for(let k=0;k<n;k++){
        const ang = b.t*0.04 + k*Math.PI*2/n;
        ebullets.push({x:core.x+core.w/2, y:core.y+core.h/2, w:9, h:9, r:5,
                       vx:Math.cos(ang)*3.9, vy:Math.sin(ang)*3.9, life:240, alien:true});
      }
      S.shoot();
    }
    // 触须拍地：玩家脚下先出现预警圈，再弹出地刺
    if(!core.shielded && b.t % (phase2 ? 150 : 190) === 100 && b.tentacles.length < 4){
      const tx = Math.max(b.wallX - 960, Math.min(b.wallX - 40, p.x + p.w/2));
      b.tentacles.push({x:tx, t:0, warn:40, up:0, hit:false});
      sfx(120,.4,"square",.10,-40);
    }
    if(aabb(hitbox(), core) && p.inv <= 0) hurtPlayer();
  }

  // ---- 触须推进 ----
  for(const tn of b.tentacles){
    tn.t++;
    if(tn.warn > 0) tn.warn--;
    else tn.up = Math.min(1, tn.up + 0.16);
    if(tn.up >= 0.85 && !tn.hit && !p.dead && p.inv <= 0){
      const gy = groundYAt(tn.x);
      const box = {x:tn.x-18, y:(gy < Infinity ? gy : GROUND_Y) - 96, w:36, h:96};
      if(aabb(hitbox(), box)){ tn.hit = true; hurtPlayer(); }
    }
  }
  b.tentacles = b.tentacles.filter(tn => tn.t < 130);

  // ---- 召唤爪兵 ----
  b.spawnT++;
  if(!core.dead && b.spawnT > (phase2 ? 240 : 360)){
    b.spawnT = 0;
    for(let k=0;k<(phase2 ? 3 : 2);k++){
      const sx = b.wallX - 280 - k*130;
      const gy = groundYAt(sx);
      enemies.push(makeAlien(sx, gy < Infinity ? gy : GROUND_Y, k === 1 ? "spit" : "claw"));
    }
    sfx(90,.5,"sawtooth",.10,-60);
  }
}

function spawnCarrierSpecial(b, p){
  const px = p.x + p.w/2;
  const clampX = (x, pad=60) => Math.max(b.wallX - 1020, Math.min(b.wallX - pad, x));
  if(b.special === "bolt"){
    // 深海：电浆柱从舱顶贯穿到地面
    b.specials.push({type:"bolt", x: clampX(px), t:0, warn:44, beam:0, hit:false});
    sfx(240,.42,"sine",.09,-60);
  } else if(b.special === "spike"){
    // 沙海：地刺沿地面连续刺出
    for(let k=0;k<3;k++){
      b.specials.push({type:"spike", x: clampX(px + (k-1)*140), t:0, warn:32 + k*9,
                       up:0, hit:false, hold:0});
    }
    sfx(110,.42,"square",.11,-50);
  } else if(b.special === "icefall"){
    // 冰盖：冰锥雨（多点落冰）
    for(let k=0;k<5;k++){
      b.specials.push({type:"ice", x: clampX(px + (k-2)*120 + (Math.random()-0.5)*70),
                       y:-40, vy:0, t:0, warn:24 + k*6, hit:false, dead:false});
    }
    sfx(980,.3,"sine",.07,-220);
  } else {
    // 轨道：核心主炮横向贯穿扫射
    b.specials.push({type:"rail", t:0, warn:56, fire:0, y0:chestY(), y1:chestY(), hit:false});
    sfx(70,.8,"sawtooth",.13,-30);
  }
}
function updateCarrierSpecials(b, p){
  const core = b.core;
  const cy0 = core.y + core.h/2;
  for(const s of b.specials){
    s.t++;
    if(s.type === "bolt"){
      if(s.warn > 0){
        s.warn--;
        if(s.warn === 0){
          s.beam = 22; shake = Math.max(shake, 11);
          sfx(1300,.34,"sawtooth",.13,-600);
        }
        if(s.t % 2 === 0) particles.push({x:s.x + (Math.random()-0.5)*44, y:80 + Math.random()*300,
          vx:(Math.random()-0.5)*2, vy:-1-Math.random()*2, life:14, color:"#8fe6ff"});
        continue;
      }
      if(s.beam > 0){
        s.beam--;
        if(!s.hit && !p.dead && p.inv <= 0){
          const gy = groundYAt(s.x);
          const box = {x:s.x-22, y:(gy < Infinity ? gy : GROUND_Y) - 460, w:44, h:460};
          if(aabb(hitbox(), box)){ s.hit = true; hurtPlayer(); }
        }
        for(let k=0;k<2;k++) particles.push({x:s.x + (Math.random()-0.5)*30, y:Math.random()*H,
          vx:(Math.random()-0.5)*2.4, vy:(Math.random()-0.5)*2, life:12, color:"#d8faff"});
        if(s.beam === 0) s.done = true;
      }
    } else if(s.type === "spike"){
      if(s.warn > 0){
        s.warn--;
        continue;
      }
      if(s.up < 1) s.up = Math.min(1, s.up + 0.22);
      else s.hold++;
      const gy = groundYAt(s.x);
      const h = 100*s.up;
      if(s.up >= 0.7 && !s.hit && !p.dead && p.inv <= 0 &&
         aabb(hitbox(), {x:s.x-17, y:(gy < Infinity ? gy : GROUND_Y)-h, w:34, h})){
        s.hit = true; hurtPlayer();
      }
      if(s.hold > 30) s.done = true;
    } else if(s.type === "ice"){
      if(s.warn > 0){
        s.warn--;
        if(s.warn === 0){ s.vy = 5; sfx(700,.18,"sine",.06,-160); }
        continue;
      }
      if(!s.hit){
        s.vy += 0.55; s.y += s.vy;
        const gy = groundYAt(s.x);
        const floor = (gy < Infinity ? gy : GROUND_Y);
        if(!p.dead && p.inv <= 0 && aabb(hitbox(), {x:s.x-18, y:s.y-20, w:36, h:46})){
          s.hit = true; hurtPlayer();
        }
        if(s.y + 24 >= floor || s.y > H + 80){
          s.hit = true;
          explode(s.x, floor, "#bfe9ff", 16, 4.5);
          shake = Math.max(shake, 5);
          if(!p.dead && p.inv <= 0 && Math.abs((p.x+p.w/2)-s.x) < 54 && p.y+p.h > floor-40) hurtPlayer();
          s.dead = true;
        }
      }
      if(s.hit) s.dead = true;
    } else if(s.type === "rail"){
      if(s.warn > 0){
        s.warn--;
        s.y1 = chestY();
        if(s.warn === 0){
          s.fire = 84; s.y0 = s.y1; shake = Math.max(shake, 14);
          sfx(60,.9,"sawtooth",.16,-20);
        }
        if(s.t % 3 === 0) particles.push({x:core.x - 20 + (Math.random()-0.5)*30,
          y:cy0 + (Math.random()-0.5)*60, vx:-3-Math.random()*3, vy:(Math.random()-0.5)*2,
          life:14, color:"#ff9be0"});
        continue;
      }
      if(s.fire > 0){
        s.fire--;
        const k = 1 - s.fire/84;
        const y = s.y0 + (s.y1 - s.y0)*Math.min(1, k*1.35);
        if(!p.dead && p.inv <= 0 && Math.abs((p.y + p.h*0.5) - y) < 26 &&
           p.x + p.w/2 < core.x){
          hurtPlayer();
        }
        for(let i=0;i<3;i++) particles.push({x:core.x - Math.random()*W, y:y + (Math.random()-0.5)*20,
          vx:-8-Math.random()*6, vy:(Math.random()-0.5)*1.4, life:10, color:"#ffd6f4"});
        if(s.fire === 0) s.done = true;
      }
    }
  }
  b.specials = b.specials.filter(s => !s.done);
}
function updateCarrierBoss(b, p){
  const core = b.core;
  core.shielded = b.cannons.some(c => !c.dead);
  const phase = core.hp <= core.maxHp * 0.55 ? 2 : 1;
  b.phase = phase;

  // ---- 节点荚：预警 26 帧 → 三连追踪弹 ----
  for(const c of b.cannons){
    if(c.dead) continue;
    c.t++;
    const cx = c.x + c.w/2, cy = c.y + c.h/2;
    const period = Math.max(96, (phase === 2 ? 116 : 152) - b.level*3);
    if(c.warnT <= 0 && c.burst <= 0 && c.t % period === 0 && !p.dead &&
       Math.abs((p.x + p.w/2) - cx) < 980){
      c.warnT = 26;
      c.gunA = Math.atan2(chestY() - cy, (p.x + p.w/2) - cx);
      sfx(780,.14,"sine",.045,-260);
    }
    if(c.warnT > 0){
      c.warnT--;
      if(c.warnT === 0){ c.burst = 3; c.bt = 0; c.flash = 6; }
    }
    if(c.burst > 0){
      c.bt++;
      if(c.bt % 8 === 1){
        const ang = c.gunA + (Math.random()-0.5)*0.07;
        ebullets.push({x:cx, y:cy, w:9, h:9, r:5,
                       vx:Math.cos(ang)*5.0, vy:Math.sin(ang)*5.0, life:210, alien:true});
        c.burst--;
      }
    }
    if(aabb(hitbox(), c) && p.inv <= 0) hurtPlayer();
  }

  // ---- 核心环形弹幕 ----
  if(!core.dead){
    const n = core.shielded ? 10 : (phase === 2 ? 16 : 12);
    const period = phase === 2 ? 176 : (core.shielded ? 250 : 214);
    if(b.t % period === 36){
      for(let k=0;k<n;k++){
        const ang = b.t*0.035 + k*Math.PI*2/n;
        ebullets.push({x:core.x+core.w/2, y:core.y+core.h/2, w:9, h:9, r:5,
                       vx:Math.cos(ang)*3.9, vy:Math.sin(ang)*3.9, life:250, alien:true});
      }
      S.shoot();
    }
    if(aabb(hitbox(), core) && p.inv <= 0) hurtPlayer();
  }

  // ---- 主题杀招 ----
  b.spT++;
  const spPeriod = phase === 2 ? 200 : 286;
  if(!core.dead && b.spT % spPeriod === 96 && b.specials.length < 3){
    spawnCarrierSpecial(b, p);
  }
  updateCarrierSpecials(b, p);

  // ---- 召唤守军 ----
  b.spawnT++;
  if(!core.dead && b.spawnT > (phase === 2 ? 250 : 370)){
    b.spawnT = 0;
    const cnt = phase === 2 ? 3 : 2;
    for(let k=0;k<cnt;k++){
      const sx = b.wallX - 260 - k*140;
      const gy = groundYAt(sx);
      enemies.push(makeAlien(sx, gy < Infinity ? gy : GROUND_Y, k === 1 ? "spit" : "claw"));
    }
    sfx(90,.5,"sawtooth",.10,-60);
  }
}
// 反应堆特殊攻击：三种"非子弹"手段轮换（地面电弧波 / 激光扫射 / 厂房落锤）
function updateReactorSpecials(b, p){
  const core = b.core;
  if(!b.specials) b.specials = [];
  b.spT = (b.spT||0) + 1;
  // 每 250 帧放一次，三种轮换
  if(!core.dead && b.spT % 250 === 110){
    b.spIdx = (b.spIdx + 1) % 3;
    if(b.spIdx === 0){
      // ① 地面电弧波：先在原地聚能 50 帧（地面有灼烧预警），再贴地窜向主角，只能跳起来躲
      b.specials.push({type:"arc", x:core.x-40, dir:(p.x+p.w/2 < core.x ? -1 : 1), t:0, warn:50,
                       gy:groundYAt(core.x-40)});
      sfx(260,.4,"sawtooth",.10,-70);
    } else if(b.spIdx === 1){
      // ② 激光扫射：从斜上缓缓扫到斜下，需要蹲下或走位
      b.specials.push({type:"laser", t:0, ang:-0.95, a0:-0.95, a1:0.44, dur:96});
      sfx(680,.5,"square",.06,-40);
    } else {
      // ③ 厂房落锤：锁定主角头顶的液压冲压机砸下
      const tx = Math.max(core.x-760, Math.min(core.x-40, p.x+p.w/2));
      b.specials.push({type:"piston", x:tx, t:0, y:-64, vy:0, hit:false, landT:0});
      sfx(150,.28,"square",.09,-20);
    }
  }
  for(const s of b.specials){
    s.t++;
    if(s.type === "arc"){
      // 蓄能阶段：原地噼啪放电（地面预警），蓄满才真正冲出去
      if(s.warn > 0){
        s.warn--;
        if(s.t % 2 === 0) particles.push({x:s.x+(Math.random()-0.5)*24, y:s.gy-6-Math.random()*18,
          vx:(Math.random()-0.5)*2.4, vy:-1-Math.random()*2, life:12, color:"#ffe58a"});
        if(s.warn === 0){ sfx(180,.34,"sawtooth",.12,-90); shake = Math.max(shake, 6); }
        continue;
      }
      s.x += s.dir * 6.6;
      const gy = groundYAt(s.x);
      if(gy === Infinity || s.x < b.wallX-800 || s.x > b.wallX+40){ s.done = true; continue; }
      s.gy = gy;
      if(p.inv<=0 && !p.dead && aabb(hitbox(), {x:s.x-15, y:gy-34, w:30, h:34})) hurtPlayer();
      if(s.t % 3 === 0) particles.push({x:s.x+(Math.random()-0.5)*12, y:gy-6,
        vx:(Math.random()-0.5)*1.6, vy:-1-Math.random()*1.2, life:13, color:"#ffe58a"});
    } else if(s.type === "laser"){
      if(s.t > 26) s.ang += (s.a1 - s.a0) / s.dur;
      if(s.t > 26 + s.dur + 12){ s.done = true; continue; }
      if(s.t > 26 && p.inv<=0 && !p.dead){
        const ox = core.x, oy = core.y + core.h*0.55;
        for(let d = 26; d < 860; d += 14){
          const px = ox - Math.cos(s.ang)*d, py = oy + Math.sin(s.ang)*d;
          if(py > groundYAt(px) - 2) break;
          if(aabb(hitbox(), {x:px-7, y:py-7, w:14, h:14})){ hurtPlayer(); break; }
        }
      }
      if(s.t % 2 === 0) particles.push({x:core.x-30+(Math.random()-0.5)*24,
        y:core.y+core.h*0.55+(Math.random()-0.5)*24,
        vx:-1-Math.random()*2, vy:(Math.random()-0.5)*1.8, life:13, color:"#ff9b4d"});
    } else if(s.type === "piston"){
      const gy = groundYAt(s.x);
      const floor = (gy === Infinity ? 440 : gy) - 54;
      if(s.t < 40){
        s.y = -64 + Math.sin(s.t*0.4)*2;                    // 悬停对位（地面有落点预警）
      } else if(!s.hit){
        s.vy += 4.4; s.y += s.vy;                            // 自由落体下砸
        if(p.inv<=0 && !p.dead && aabb(hitbox(), {x:s.x-34, y:s.y, w:68, h:56})) hurtPlayer();
        if(s.y >= floor){
          s.y = floor; s.hit = true; s.landT = s.t;
          shake = Math.max(shake, 14); sfx(90,.45,"square",.16,-40);
          explode(s.x, floor+54, "#cfc7ad", 22, 5);
          explode(s.x, floor+54, "#ffb347", 12, 3.5);
          if(p.inv<=0 && !p.dead && Math.abs((p.x+p.w/2)-s.x) < 62 && p.y+p.h > floor) hurtPlayer();
        }
      } else if(s.t - s.landT > 22){
        s.y -= 9;                                            // 回收
        if(s.y < -80) s.done = true;
      }
      if(s.t % 4 === 0 && s.y > -60) particles.push({x:s.x+(Math.random()-0.5)*50,
        y:s.y+56, vx:(Math.random()-0.5)*1.4, vy:-Math.random(), life:12, color:"#9aa0a8"});
    }
  }
  b.specials = b.specials.filter(s => !s.done);
}

// ============================================================
//  要塞：黑铁巨弹（首发）—— 有重力、会被地面接住然后向前滚
// ============================================================
function spawnIronBall(b){
  const core = b.core;
  ironBalls.push({
    x: core.x + core.w/2, y: core.y + core.h*0.34,
    r: 22, vx: -8.0, vy: -4.8,
    hp: 5, maxHp: 5, rolling: false, spin: 0, flash: 0, t: 0, dead: false,
  });
  sfx(90,.4,"square",.10,-55);
  shake = Math.max(shake, 5);
  explode(core.x+core.w/2, core.y+core.h*0.34, "#ffb347", 10, 3);
}
// 黑铁弹被击碎 / 撞到主角：都是炸开；撞到主角时像自爆兵一样向四周喷 6 颗子弹
function blastIronBall(ball, hitPlayer){
  if(ball.dead) return;
  ball.dead = true;
  const cx = ball.x, cy = ball.y;
  explode(cx, cy, "#ff5b3d", 24, 6);
  explode(cx, cy, "#3a3a44", 16, 4.5);
  sfx(105,.45,"sawtooth",.13,-70);
  shake = Math.max(shake, 9);
  if(hitPlayer){
    // 先结算受伤（hurtPlayer 会清掉主角身边的旧弹幕），再喷弹片，保证 6 颗一定飞出去
    if(player.inv<=0 && !player.dead) hurtPlayer();
    // 与自爆兵同款：向四周均匀喷 6 颗弹片
    for(let k=0;k<6;k++){
      const a = k*Math.PI/3 + Math.PI/6;
      ebullets.push({x:cx, y:cy, w:10, h:10, r:5,
                     vx:Math.cos(a)*4.0, vy:Math.sin(a)*4.0, life:190});
    }
  } else {
    score += 600;
  }
}
function updateIronBalls(){
  const p = player;
  for(const ball of ironBalls){
    if(ball.dead) continue;
    ball.t++;
    if(ball.flash > 0) ball.flash--;
    // ---- 物理：重力 + 抛物线 ----
    ball.vy += 0.46;
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.spin += ball.vx / ball.r;
    const gy = groundYAt(ball.x);
    if(gy < Infinity && ball.y + ball.r >= gy){
      ball.y = gy - ball.r;
      if(!ball.rolling){
        if(Math.abs(ball.vy) > 3.4){
          // 落地反弹（带衰减），弹两下才进入滚动
          ball.vy = -Math.abs(ball.vy) * 0.36;
          ball.vx *= 0.94;
          for(let k=0;k<4;k++) particles.push({x:ball.x+(Math.random()-0.5)*20, y:gy-3,
            vx:(Math.random()-0.5)*2.2, vy:-Math.random()*1.4, life:14, color:"#cfc7ad"});
          shake = Math.max(shake, 3);
        } else {
          // 转为贴地滚动，并保留向前冲劲
          ball.rolling = true; ball.vy = 0;
          ball.vx = (ball.vx < 0 ? -1 : 1) * Math.max(4.6, Math.abs(ball.vx) * 0.85);
          sfx(140,.18,"square",.06,-40);
        }
      } else {
        ball.vy = 0;
        const dir = ball.vx < 0 ? -1 : 1;
        ball.vx = dir * Math.max(3.0, Math.abs(ball.vx) * 0.997);   // 缓缓减速但一直向前滚
      }
    } else if(ball.rolling && gy === Infinity){
      ball.rolling = false;                 // 滚出平台边缘 → 重新受重力
    }
    // 滚动扬尘
    if(ball.rolling && ball.t % 3 === 0){
      particles.push({x:ball.x + (ball.vx>0?-ball.r:ball.r)*0.8, y:ball.y + ball.r - 4,
        vx:(ball.vx>0?-1:1)*(0.4+Math.random()*0.8), vy:-Math.random()*0.9,
        life:12, color:"#9d9885"});
    }
    const hit = {x:ball.x-ball.r, y:ball.y-ball.r, w:ball.r*2, h:ball.r*2};
    // 碾碎挡路木箱
    for(const c of crates){
      if(c.dead || !aabb(hit,c)) continue;
      c.hp -= 4; c.flash = 6;
      explode(c.x+c.w/2, c.y+c.h/2, "#c9a17a", 8, 3);
      if(c.hp <= 0){ c.dead = true; score += 50; }
    }
    // 撞到主角 → 炸开 + 6 颗弹片
    if(!p.dead && p.inv<=0 && aabb(hitbox(), hit)){ blastIronBall(ball, true); continue; }
    // 出界清理
    if(ball.x < cam - 200 || ball.x > cam + W + 260 || ball.y > H + 160) ball.dead = true;
  }
  ironBalls = ironBalls.filter(b => !b.dead);
}

function sniperBox(){
  const s = boss && boss.sniper;
  if(!s || s.dead || s.st === "down") return null;
  return {x:s.x-11, y:s.y-40, w:22, h:40};
}
function damageSniper(d){
  const s = boss && boss.sniper;
  if(!s || s.dead || s.st === "down") return;
  s.hp -= d; s.flash = 6;
  explode(s.x, s.y-24, "#ffd0b0", 5, 3); S.hitE();
  if(s.hp <= 0){
    s.hp = 0; s.dead = true; s.st = "down";
    s.respawnT = 300; s.downT = 0; s.warn = 0;       // 5 秒后增援到场
    score += 700; killCount++;
    explode(s.x, s.y-22, "#ff9b4d", 18, 5);
    sfx(190,.35,"sawtooth",.10,-70);
    shake = Math.max(shake, 5);
  }
}
function updateFortSniper(b, p){
  const s = b.sniper;
  if(!s) return;
  s.animT++;
  if(s.flash > 0) s.flash--;
  if(s.st === "down"){
    // 阵亡 → 倒计时，5 秒（300 帧）后增援从瞭望台右侧走进来
    s.downT++; s.respawnT--;
    if(s.respawnT <= 0){
      s.st = "walkin"; s.dead = false; s.hp = 2; s.maxHp = 3;
      s.x = s.homeX + 148; s.face = -1; s.warn = 0; s.cd = 0;
      sfx(420,.10,"square",.05,120);
    }
    return;
  }
  if(s.st === "walkin"){
    // 增援：沿瞭望台一路走过来，走到岗位后接班
    s.x -= 1.35; s.face = -1;
    if(s.x <= s.homeX){
      s.x = s.homeX; s.st = "idle"; s.hp = 3; s.cd = 70;
      sfx(320,.10,"square",.05);
    }
    return;
  }
  // 驻守：激光预警 → 开枪
  const tx = p.x + p.w/2, ty = chestY();
  s.aim = Math.atan2(ty - (s.y - 28), tx - s.x);
  s.face = (tx < s.x) ? -1 : 1;
  if(b.dead || p.dead){ s.warn = 0; return; }
  if(s.warn > 0){
    s.warn--;
    if(s.warn === 0){
      enemyShot(s.x + s.face*36, s.y - 26, tx, ty, 6.0, 0.05, 200);
      s.flash = 7; s.cd = 105 + Math.random()*55;
      sfx(1300,.07,"square",.045,-420);
    }
  } else if(s.cd > 0){
    s.cd--;
  } else if(Math.abs(tx - s.x) < 920){
    s.warn = 30;
  }
}

// ============================================================
//  第二关 Boss 倒下后：主角觉得不对劲 → 反应堆渗出红液 → 逃命关（第三关）
// ============================================================
function startAftermath(){
  state = "aftermath"; stateTimer = 0;
  bullets = []; ebullets = []; ironBalls = []; enemies = []; debris = []; redPools = [];
  cam = Math.max(0, LEVEL_W - W);
  BGM.stop();
  sfx(140,.5,"sine",.08,-60);
}
function updateAftermath(){
  stateTimer++;
  if(shake > 0) shake--;
  const p = player;
  p.vx = 0; p.vy = 0; p.crouch = false; p.animT++;
  const core = boss.core;
  // 84 帧后：红色液体从熔毁的核心底部渗出来，向主角那一侧蔓延
  if(stateTimer === 84){
    shake = Math.max(shake, 8);
    const gy = groundYAt(core.x + core.w/2);
    redPools.push({x: core.x + core.w/2 - 10, y: (gy<Infinity?gy:GROUND_Y) - 10,
                   w: 30, h: 12, grow: 2.4, maxW: 620, t: 0});
    sfx(60,.9,"sawtooth",.12,-30);
  }
  // 液面蔓延（不动玩家，纯演出）
  for(const pool of redPools){
    pool.t++;
    if(pool.grow > 0 && pool.w < pool.maxW){ pool.x -= pool.grow; pool.w += pool.grow; }
    if(pool.t % 7 === 0) particles.push({x: pool.x + Math.random()*pool.w, y: pool.y + 5,
      vx:0, vy:-0.5, life:20, color:"#8a0a10"});
    if(pool.t % 26 === 0) sfx(90,.18,"sine",.05,-140);
  }
  // 红液快碰到主角（或拖太久）→ 立刻切第三关
  const pool = redPools[0];
  if(pool && pool.x < p.x + p.w + 26 && stateTimer > 160){ startFinalRun(); return; }
  if(stateTimer > 560) startFinalRun();
}
// 第三关：反套路「反向逃生」——反应堆漏液从身后追上来，只能掉头往厂房大门狂跑
function startFinalRun(){
  bullets=[]; ebullets=[]; enemies=[]; particles=[]; ironBalls=[]; debris=[]; redPools=[];
  fleeSquad=[]; holes=[]; usedTriggers=new Set(); autoSpawnT=0; shake=0;

  liquid = {x: runStartX + 420, speed: 1.5, t: 0};

// 红液：碰到即死（掉一条命，回到检查点）
function updateRedPools(){
  const p = player;
  for(const pool of redPools){
    pool.t++;
    if(pool.grow > 0 && pool.w < pool.maxW){ pool.x -= pool.grow; pool.w += pool.grow; }
    if(pool.t % 9 === 0) particles.push({x: pool.x + Math.random()*pool.w, y: pool.y + 5,
      vx:0, vy:-0.45, life:18, color:"#8a0a10"});
    if(p.dead || p.inv > 0) continue;
    if(aabb(hitbox(), {x:pool.x, y:pool.y, w:pool.w, h:pool.h})){
      explode(p.x+p.w/2, p.y+p.h/2, "#ff1a1a", 26, 6);
      sfx(55,.7,"sawtooth",.18,-30); shake = Math.max(shake, 18);
      hurtPlayer(true);
    }
  }
}
// 第三关：天上砸落的工厂碎片——砸中地板会先裂开、约 1.7 秒后塌成洞
function spawnDebris(){
  const p = player;
  // 逃命是往左跑：碎片落在"前方"（更小 x）
  const cands = platforms.filter(pl => !pl.dead && pl.x + pl.w > p.x - 900 && pl.x < p.x - 30);
  let tgt = null;
  if(cands.length && Math.random() < 0.28) tgt = cands[Math.floor(Math.random()*cands.length)];
  const x = tgt ? tgt.x + 14 + Math.random()*Math.max(10, tgt.w - 28)
                : p.x - 110 - Math.random()*620;
  const dw = 22 + Math.random()*40, dh = 16 + Math.random()*26;
  debris.push({x, y: -80 - Math.random()*90, w: dw, h: dh,
               vy: 2.0 + Math.random()*1.8, vx: 0, rot: Math.random()*6.28,
               spin: (Math.random()-0.5)*0.14, tgt, dead:false, t:0,
               hp: dw > 46 ? 3 : 1, maxHp: dw > 46 ? 3 : 1, flash: 0});
  sfx(70,.14,"square",.05,-40);
}
function updateFinalRun(p){
  // ===== ① 红液浪头：一路从身后碾过来（越拖越急，被甩太远会自己加速）=====
  const L = liquid;
  if(L){
    L.t++;
    // 追猎节奏：永远保持在身后约 380px 左右——跑快了它加速追，停下了它慢慢逼近
    const gap = L.x - (p.x + p.w);
    const base = 1.5 + Math.min(1.25, L.t/700);
    let spd = Math.max(base, Math.min(4.2, (gap - 320) * 0.05));
    if(gap > 950) spd = 4.2;                       // 被彻底甩开 → 全力追上来
    L.x -= spd;
    if(L.t % 2 === 0){
      const gyL = groundYAt(L.x + 8);
      particles.push({x: L.x + Math.random()*30, y: (gyL<Infinity?gyL:440) - 24 - Math.random()*110,
        vx:-0.6-Math.random()*1.9, vy:-1.1-Math.random()*1.9, life:18,
        color: Math.random()<.5 ? "#ff2a2a" : "#ff7a6a"});
    }
    // 被浪头舔到 → 掉命
    if(!p.dead && p.x + p.w - 6 > L.x) hurtPlayer(true);
  }
  // ===== ② 碎片：砸中主角 / 砸裂地板（约 1.7 秒后塌成洞）=====
  debrisT--;
  if(debrisT <= 0 && state === "play"){
    spawnDebris();
    debrisT = 44 + Math.random()*46;
    if(Math.random() < 0.30) debrisT = 20;             // 偶尔连砸
  }
  for(const d of debris){
    d.t++;
    d.vy += 0.12; d.y += d.vy; d.x += d.vx; d.rot += d.spin;
    // 直接砸到主角
    if(!p.dead && p.inv <= 0 && aabb(hitbox(), d)){
      d.dead = true;
      explode(d.x, d.y, "#9aa0a8", 18, 4.5);
      hurtPlayer();
      continue;
    }
    // 砸中栈桥 → 结构受损（2 秒后断裂）
    const tp = d.tgt;
    if(tp && !tp.dead && d.y + d.h >= tp.y && d.y < tp.y + 44){
      d.dead = true;
      if(tp.crackT <= 0) tp.crackT = 120;
      shake = Math.max(shake, 10);
      explode(d.x, tp.y + 2, "#9aa0a8", 18, 4.5);
      explode(d.x, tp.y + 2, "#ffb347", 8, 3);
      sfx(110,.36,"square",.13,-40);
      continue;
    }
    // 砸在跑道上 → 地板裂开，稍后塌出洞
    const gy = groundYAt(d.x + d.w/2);
    if(gy < Infinity && d.y + d.h >= gy){
      d.dead = true; shake = Math.max(shake, 8);
      explode(d.x + d.w/2, gy - 4, "#9aa0a8", 16, 3.6);
      explode(d.x + d.w/2, gy - 4, "#ffb347", 8, 3);
      sfx(95,.30,"square",.11,-46);
      const cx = d.x + d.w/2;
      const nearHole = holes.some(h => Math.abs((h.x + h.w/2) - cx) < 190);
      if(!nearHole && holes.length < 6 && cx > runExitX - 150 && cx < runStartX + 40){
        const cw = 64 + Math.random()*24;
        holes.push({x: cx - cw/2, w: cw, y: gy, crackT: 100, seed: Math.random()*9});
      }
      continue;
    }
    if(d.y > H + 140) d.dead = true;
  }
  debris = debris.filter(d => !d.dead);
  // 地板裂缝倒计时（红裂缝闪烁 → 轰然塌陷）
  for(const hl of holes){
    if(hl.crackT <= 0) continue;
    hl.crackT--;
    if(hl.crackT === 0){
      shake = Math.max(shake, 15); sfx(80,.5,"square",.15,-40);
      for(let k=0;k<16;k++) particles.push({x: hl.x + Math.random()*hl.w, y: hl.y,
        vx:(Math.random()-0.5)*2.6, vy:-1-Math.random()*2.6, life:22, color:"#8a94a4"});
    } else if(hl.crackT % 8 === 0){
      particles.push({x: hl.x + Math.random()*hl.w, y: hl.y - 2,
        vx:(Math.random()-0.5)*1.4, vy:-0.4, life:14, color:"#ff5b3d"});
    }
  }
  // 栈桥断裂倒计时（闪烁 → 轰然塌落）
  for(const pl of platforms){
    if(pl.dead || pl.crackT <= 0) continue;
    pl.crackT--;
    if(pl.crackT === 0){
      pl.dead = true;
      explode(pl.x + pl.w/2, pl.y + 4, "#8a94a4", 30, 6);
      explode(pl.x + pl.w*0.3, pl.y + 4, "#5a636f", 18, 4);
      sfx(80,.5,"square",.15,-40); shake = Math.max(shake, 15);
    } else if(pl.crackT % 9 === 0){
      particles.push({x: pl.x + Math.random()*pl.w, y: pl.y + 6,
        vx:(Math.random()-0.5)*1.3, vy:-0.3, life:16, color:"#ff5b3d"});
    }
  }
  // ===== ③ 一起逃命的人群 =====
  updateFleeSquad(p);
  // ===== ④ 冲进左端逃生门 → 逃出厂房 =====
  if(state === "play" && p.x + p.w/2 < runExitX + 8){
    state = "escape"; stateTimer = 0; shake = 20;
    sfx(65,.9,"sawtooth",.16,-30);
  }
}
// 逃命的兵：一路向左狂奔；被液面追上会卷进去，掉进塌陷的洞会摔下去
function spawnFlee(x){
  const gx = Math.max(20, Math.min(LEVEL_W - 60, x));
  const gy = groundYAt(gx);
  fleeSquad.push({x:gx, y:(gy<Infinity?gy:GROUND_Y) - 38, w:20, h:38, vy:0,
    spd: 2.85 + Math.random()*0.55, animT: Math.random()*10,
    panic: Math.random() < 0.4, dead:false, sinkT:0, onGround:true});
}
function updateFleeSquad(p){
  const L = liquid;
  for(const s of fleeSquad){
    if(s.dead){ s.sinkT++; continue; }
    s.animT += 0.30 + s.spd*0.02;
    const near = L ? (L.x - s.x) < 240 : false;
    s.x -= near ? s.spd*1.24 : s.spd;
    // 竖直：踏空则往下掉（洞/断桥）
    s.vy = Math.min(s.vy + 0.55, 14);
    s.y += s.vy;
    const gy = groundYAt(s.x + s.w/2);
    if(gy < Infinity && s.y + s.h >= gy && s.vy >= 0 && s.y + s.h < gy + 40){
      s.y = gy - s.h; s.vy = 0; s.onGround = true;
    } else s.onGround = false;
    if(s.y > H + 60){ s.dead = true; s.sinkT = 26; continue; }
    // 被液面吞掉（身体右侧被浪头淹过）
    if(L && s.x + s.w > L.x){
      s.dead = true; s.sinkT = 0;
      explode(s.x + s.w/2, s.y + s.h*0.5, "#ff2a35", 12, 3.4);
      if(Math.random() < .45) sfx(320,.14,"square",.05,-160);
      continue;
    }
    if(Math.random() < 0.008) s.panic = !s.panic;
    if(s.x < cam - 300) s.dead = true;
  }
  fleeSquad = fleeSquad.filter(s => !(s.dead && s.sinkT > 26));
  // 不断有人从侧道冲出来汇合（上限 13 个）
  if(L && L.t % 150 === 70 && fleeSquad.filter(s => !s.dead).length < 13){
    spawnFlee(p.x + 90 + Math.random()*320);
  }
}
// 逃命段的重生：放在浪头前方，液面被震退一点，避免刚站起来又被吞
function respawnInRun(){
  const p = player;
  const front = liquid ? liquid.x : p.x + 400;
  const rx = Math.max(80, front - 430);
  resetPlayer(rx, true);                              // 逃命段重生也不掉枪
  player.face = -1; player.inv = 150;
  if(liquid){ liquid.x = rx + 360; liquid.speed = Math.max(1.5, liquid.speed - 0.35); }
  cam = Math.max(0, Math.min(rx - W*0.55, LEVEL_W - W));
  shake = 12;
}
// 逃出演出：冲进逃生门，身后整条走廊被红液灌满、工厂垮塌
function updateEscape(){
  stateTimer++;
  const p = player;
  p.vx = 0; p.vy = 0; p.animT++;
  p.crouch = false; p.rolling = false; p.slideT = 0;
  shake = Math.max(shake, 5 + Math.min(22, stateTimer*0.12));
  // 主角继续往门口冲
  const doorX = runExitX - 34;
  if(p.x > doorX){ p.x = Math.max(doorX, p.x - 3.4); p.face = -1; }
  const tCam = Math.max(0, Math.min(p.x - W*0.42, LEVEL_W - W));
  cam += (tCam - cam) * 0.08;
  if(stateTimer % 4 === 0){
    debris.push({x: cam + Math.random()*W, y: -60, w: 26+Math.random()*52, h: 18+Math.random()*30,
      vy: 3+Math.random()*3.2, vx:0, rot: Math.random()*6.28,
      spin:(Math.random()-0.5)*0.2, tgt:null, dead:false, t:0});
  }
  for(const d of debris){
    d.t++; d.vy += 0.16; d.y += d.vy; d.rot += d.spin;
    if(d.y > H + 120) d.dead = true;
  }
  debris = debris.filter(d => !d.dead);
  // 液面把整条走廊灌满
  if(liquid){
    liquid.x -= 4.6;
    if(stateTimer % 3 === 0) particles.push({x: liquid.x + Math.random()*40, y: H - 60 - Math.random()*260,
      vx:-1-Math.random()*2.4, vy:-1-Math.random()*2, life:18, color:"#ff3a34"});
  }
  updateFleeSquad(p);
  if(stateTimer > 260){
    if(LEVEL_IDX === 3){
      // 逃出厂房的瞬间，脚下地板整片塌下去 —— 底下不是泥土，是母舰的装甲
      state = "reveal"; stateTimer = 0; shake = 26;
      sfx(50,1.2,"sawtooth",.18,-20);
    } else {
      state = "win"; stateTimer = 0; BGM.stop(); S.clear();
    }
  }
}

//  第三关 → 第四关：脚下地板塌陷，露出埋在工厂底下的外星母舰

function updateReveal(){
  stateTimer++;
  shake = Math.max(shake, 8 + Math.min(16, stateTimer*0.05));
  if(stateTimer % 6 === 0){
    debris.push({x: cam + Math.random()*W, y: -50, w: 30+Math.random()*46, h: 18+Math.random()*26,
      vy: 3+Math.random()*3, vx:0, rot: Math.random()*6.28, spin:(Math.random()-0.5)*0.2,
      tgt:null, dead:false, t:0, hp:2});
  }
  for(const d of debris){ d.t++; d.vy += 0.16; d.y += d.vy; d.rot += d.spin; if(d.y > H+140) d.dead = true; }

function startAlienLair(){ advanceTo(4); }
// 通用：进入第 n 关（枪与等级一路带着）

// ---------- 工具 ----------
const aabb = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
// 玩家受击碰撞盒：站立时为全身；蹲下/滑铲时压低到下半身（子弹从头顶飞过）
function hitbox(){
  const p = player;
  if(p.slideT > 0) return {x:p.x-6, y:p.y+24, w:p.w+12, h:p.h-24};
  return p.crouch ? {x:p.x, y:p.y+22, w:p.w, h:p.h-22} : {x:p.x, y:p.y, w:p.w, h:p.h};
}
// 敌方瞄准点：固定瞄准站立时的胸口高度——蹲下即可让子弹从头顶飞过
function chestY(){ return player.y + 14; }
function explode(x,y,color,n=10,spd=4){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=Math.random()*spd+1;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:20+Math.random()*20,color});
  }
}

// ---------- 更新逻辑 ----------
// 直升机位置（开场索降演出）
function heliPos(t){
  let x, y=110;
  if(t<90){ const k=t/90; x = (W+150) - (W+150-270)*(1-Math.pow(1-k,2)); }
  else if(t<270){ x=270; }
  else { x = 270 + (t-270)*(t-270)*0.35; y = 110 - (t-270)*0.25; }
  return {x,y};
}
function update(){
  // ----- 开场：直升机索降插入 -----
  if(state==="insert"){
    stateTimer++;
    const t = stateTimer, hp2 = heliPos(t);
    const ground38 = groundYAt(260) - 38;
    player.crouch=false; player.vx=0; player.vy=0; player.face=1; player.inv=0;
    if(t<110){          // 挂在直升机下随其飞入
      player.x = hp2.x - 4; player.y = hp2.y + 26;
    } else if(t<235){   // 沿绳索滑降（先慢后快）
      const k=(t-110)/125;
      player.x = 259;
      player.y = (hp2.y+26) + (ground38-(hp2.y+26))*k*k;
    } else {            // 落地
      player.x = 259; player.y = ground38; player.onGround = true;
    }
    if(t>=335){ state="play"; stateTimer=0; BGM.start(); }
    if(shake>0)shake--;
    return;
  }
  if(state==="aftermath"){ updateAftermath(); return; }
  if(state==="escape"){ updateEscape(); return; }
  if(state==="reveal"){ updateReveal(); return; }
  if(state==="stagebreak"){ updateStageBreak(); return; }
  if(state!=="play" && state!=="walkin"){ stateTimer++; if(shake>0)shake--; return; }
  // ----- 通关后自动走进要塞大门 -----
  if(state==="walkin"){
    keys["ArrowRight"]=true; keys["Digit1"]=false; keys["Digit2"]=false;
  }
  if(shake>0)shake--;
  if(bannerT>0) bannerT--;
  const p = player;
  p.animT++;
  if(p.inv>0) p.inv--;
  const spd = 3.2;
  // 蹲下：仅地面可蹲，蹲下时不能移动
  p.crouch = !!(kDown() && p.onGround) || p.slideT > 0;
  if(p.slideCd > 0) p.slideCd--;
  p.vx = 0;
  if(p.crouch){
    // ----- 滑铲：地面蹲下时按 ← / → 触发 -----
    if(p.slideT > 0){
      const dir = p.slideDir;
      const gyNow   = groundYAt(p.x + p.w/2);
      const gyAhead = groundYAt(p.x + p.w/2 + dir*34);
      let slope = 0;
      if(gyNow < Infinity && gyAhead < Infinity) slope = gyAhead - gyNow; // >0 前方更低=下坡
      // 上坡阻力大（滑距≈平地一半）；下坡阻力略小 → 只比平地多一点点
      let fric = 0.26;
      if(slope > 1.5)       fric = 0.215;   // 下坡：比平地多约 20% 距离
      else if(slope < -1.5) fric = 0.56;    // 上坡：约平地一半
      p.slideV -= fric;
      p.slideAge = (p.slideAge||0) + 1;
      // 悬崖边缘收铲：预测下一步落点，若已经踩空就直接停住（不会被滑势带着冲下深坑）
      const nxC = p.x + dir*Math.max(p.slideV, 1) + p.w/2;
      const lipAhead = gyNow < Infinity && groundYAt(nxC) === Infinity;
      // 下坡不续时间：滑势一旦衰减到 1.3 就收铲，绝不一滑到底
      if(lipAhead || !p.onGround || p.slideV < 1.3 || p.slideAge > 48){ p.slideT = 0; if(lipAhead) p.vx = 0; }
      else { p.vx = dir * p.slideV; p.face = dir; p.slideT--; }
      if(p.slideT === 0) p.slideCd = 20;       // 铲完稍作停顿，不能连按刷距离
    } else if(p.onGround && p.slideCd <= 0 && ((kLeft() && !p.prevL) || (kRight() && !p.prevR))
              && groundYAt(p.x + p.w/2 + (kLeft()?-9:9)) < Infinity){
      // 起铲（需重新按方向键触发，按住不放不会连铲；紧贴崖边时不起铲，避免直接滑进坑里）
      p.slideDir = kLeft() ? -1 : 1;
      p.slideV = 8.4; p.slideT = 34; p.slideAge = 0; p.face = p.slideDir;
      p.vx = p.slideDir * p.slideV;
      sfx(220,.18,"sawtooth",.05,-120);
      for(let i=0;i<6;i++) particles.push({x:p.x+p.w/2-p.slideDir*8, y:p.y+p.h-4,
        vx:-p.slideDir*(1+Math.random()*1.6), vy:-Math.random()*1.4, life:16, color:"#c9c2a8"});
    }
  }
  if(!p.crouch && p.slideT<=0){
    if(kLeft()) { p.vx=-spd; p.face=-1; }
    if(kRight()){ p.vx= spd; p.face= 1; }
  }
  p.prevL = kLeft(); p.prevR = kRight();
  // 跳跃（恢复原版手感：跳得高、滞空长）
  // 站在钢栈桥上蹲下（↓）再按 2 → 不是起跳，而是从这一层桥面下穿，落到下一行（下层桥 / 地面）
  if(kJumpDown() && p.onGround && p.slideT<=0 && p.crouch && p.platY !== null){
    p.dropY = p.platY; p.platY = null;
    p.y += 5; p.vy = 2.6; p.onGround = false; p.rolling = false; p.rollAng = 0;
    S.jump();
    for(let i=0;i<7;i++) particles.push({x:p.x+p.w/2+(Math.random()-0.5)*16, y:p.y+p.h-2,
      vx:(Math.random()-0.5)*1.6, vy:-Math.random()*1.2, life:14, color:"#8b93a0"});
  } else if(kJumpDown() && p.onGround && p.slideT<=0){
    p.vy=-12.6; p.onGround=false; S.jump();
    // 起跳瞬间进入空中前滚翻（落地转回站立）
    p.rolling = true; p.rollDir = p.face; p.rollAng = 0; p.platY = null;
  }
  p.vy += 0.55; if(p.vy>14)p.vy=14;
  // 传送带：站在带上顺向加速 / 逆向减速（不按键也会被带着走）
  p.belt = 0;
  if(p.onGround && conveyors.length){
    for(const cv of conveyors){
      if(p.x + p.w > cv.x && p.x < cv.x + cv.w && Math.abs((p.y + p.h) - cv.y) <= 7){
        p.belt = cv.dir * cv.speed;
        p.vx += p.belt;
        break;
      }
    }
  }
  p.x += p.vx; p.y += p.vy;
  p.x = Math.max(0, Math.min(p.x, LEVEL_W - p.w));
  // Boss 墙体：战斗中挡在墙前（通关演出时允许跨过门槛进门）
  if(state === "play" && boss && !boss.dead && boss.wallX && p.x + p.w > boss.wallX) p.x = boss.wallX - p.w;

  // 木箱：水平阻挡（跳到箱顶上方则不阻挡，可站上去当掩体）
  for(const c of crates){
    if(c.dead) continue;
    if(aabb(p,c) && p.y + p.h > c.y + 8){
      p.x = (p.x + p.w/2 < c.x + c.w/2) ? c.x - p.w : c.x + c.w;
    }
  }
  // 坦克侧壁：只能从上方踩上去，不能直接穿过（用上一帧脚位判断，下落时不被推开）
  for(const e of enemies){
    if(e.kind!=="tank" || e.dead) continue;
    if(aabb(p,e) && p.y + p.h - p.vy > e.y + 12){
      p.x = (p.x + p.w/2 < e.x + e.w/2) ? e.x - p.w : e.x + e.w;
    }
  }

  // 平台 / 坡面地形碰撞（扫掠式：上一帧脚在表面上方、这一帧越过即落地；走路时贴合坡面）
  let landed = false;
  const feetPrev = p.y + p.h - p.vy;
  // 脚部碰撞区间：脚的任何一部分踩到支撑面都算站立（放宽接触判定）
  const footL = p.x + 2, footR = p.x + p.w - 2;
  if(p.vy >= 0){
    for(const pl of platforms.concat(crates, tankTops())){
      if(pl.dead) continue;
      // 下穿中：忽略刚刚离开的那一层桥面，避免立刻又被它接住
      if(p.dropY !== null && Math.abs(pl.y - p.dropY) < 5) continue;
      if(footR > pl.x && footL < pl.x + pl.w &&
         feetPrev <= pl.y + 2 && p.y + p.h >= pl.y){
        p.y = pl.y - p.h; p.vy = 0; landed = true;
        p.platY = platforms.indexOf(pl) >= 0 ? pl.y : null;   // 站在栈桥上（可蹲下下穿）
        p.dropY = null;
        break;
      }
    }
    if(!landed){
      const gy = groundYAt(p.x + p.w/2);
      if(gy < Infinity){
        const feet = p.y + p.h;
        if((feetPrev <= gy + 2 && feet >= gy) ||
           (p.onGround && feet >= gy - 1 && feet <= gy + 14)){ // 贴地走坡
          p.y = gy - p.h; p.vy = 0; landed = true;
          p.platY = null; p.dropY = null;
        }
      }
    }
  }
  p.onGround = landed;

  // 空中前滚翻：翻滚角度由竖直速度推导（起跳 0° → 顶点 180° → 落地 360°），
  // 与跳跃物理天然同步，落地正好转回站立姿势
  if(p.rolling){
    if(!p.onGround){
      const v = Math.max(-12.6, Math.min(12.6, p.vy));
      p.rollAng = ((v + 12.6) / 25.2) * Math.PI * 2 * p.rollDir;
    } else {
      // 落地：若滞空较短（跳到高台）没转满，落地瞬间补完剩余角度，避免回正跳变
      p.rolling = false; p.rollAng = Math.PI*2*p.rollDir; p.landT = 7;
      for(let i=0;i<4;i++) particles.push({x:p.x+p.w/2+(Math.random()-0.5)*14, y:p.y+p.h-2,
        vx:(Math.random()-0.5)*1.8, vy:-Math.random()*1.1, life:13, color:"#cfc7ad"});
    }
  }
  if(p.landT>0) p.landT--;

  // 滑铲贴地：滑行速度远大于走路，坡面下沉比重力快，不贴地会起铲即腾空而断铲
  if(p.slideT > 0){
    const gy = groundYAt(p.x + p.w/2);
    if(gy < Infinity){
      const feet = p.y + p.h;
      if(feet >= gy - 22 && feet <= gy + 24){ p.y = gy - p.h; p.vy = 0; p.onGround = true; landed = true; }
    }
  }

  // 掉进水坑 / 掉出屏幕
  if(p.y > H + 60){ hurtPlayer(true); }

  // 瞄准方向：按住 ↑ 才抬枪朝正上方，手指一松立刻回到平射（不再有延迟残留）
  p.aimAng = 0;
  const aimingUp = kUp() && !kDown();
  if(aimingUp) p.aimAng = -Math.PI/2;
  // 空中按住 ↓：枪口朝正下方（可对脚下开火，带朝下瞄准动画）
  if(!p.onGround && kDown() && !aimingUp) p.aimAng = Math.PI/2;
  // 滑铲低姿：枪口压平，贴地横扫（铲中也能开火）
  if(p.slideT > 0) p.aimAng = 0;

  // 射击（数字 1 键）：站立跑动 / 跳跃 / 滑铲 / 抬枪 全部可开火
  if(p.fireCd>0) p.fireCd--;
  if(p.bulletCd>0) p.bulletCd--;
  if(kShoot()){
    tryShoot(false);
    // 炸弹武器：一边投弹一边用枪管连射（子弹有自己的冷却，不跟投弹节奏绑定）
    if(p.weapon === "B" && p.bulletCd <= 0) shootBulletOnly();
  }

  // 道具拾取：同类=升级(Lv1→2→3，满级转积分)；异类=保住手里的枪并转积分（按住 ↑ 拾取才换枪）
  for(const pu of powerups){
    pu.bob += 0.08;
    if(!pu.taken && aabb(p, {x:pu.x,y:pu.y+Math.sin(pu.bob)*5,w:pu.w,h:pu.h})){
      pu.taken = true; S.power();
      explode(pu.x+17, pu.y+13, "#ffd34d", 14, 3);
      if(p.weapon === "N" || (kUp() && p.weapon !== pu.type)){
        // 空手 / 主动（↑）换枪：直接换成新枪 Lv1
        p.weapon = pu.type; p.wlv[pu.type] = 0; score += 500;
        explode(p.x+p.w/2, p.y+10, "#5afff0", 16, 4);
      } else if(p.weapon === pu.type){
        const cur = p.wlv[pu.type] || 0;
        if(cur < 2){
          p.wlv[pu.type] = cur + 1; score += 500*(cur+1);
          explode(p.x+p.w/2, p.y+10, "#5afff0", 20, 5);
        } else {                       // 已经三级：转积分
          score += 1500;
          explode(p.x+p.w/2, p.y+10, "#ffd34d", 18, 4);
        }
      } else {                         // 异类武器：不抢手里的枪，转积分
        score += 1000;
        explode(p.x+p.w/2, p.y+10, "#ffd34d", 14, 3);
      }
    }
  }
  // 阵亡掉落的枪：回到原地可以捡回（保留掉落时的等级）
  for(const d of drops){
    d.bob += 0.07;
    if(!d.taken && aabb(p, {x:d.x, y:d.y+Math.sin(d.bob)*4, w:d.w, h:d.h})){
      d.taken = true; S.power();
      p.weapon = d.type;
      p.wlv[d.type] = d.lv || 0;
      explode(d.x+d.w/2, d.y+d.h/2, "#5afff0", 18, 4);
    }
  }

  // 勋章拾取：+1 条命
  for(const m of medals){
    m.bob += 0.06;
    if(!m.taken && aabb(p, {x:m.x, y:m.y+Math.sin(m.bob)*5, w:26, h:26})){
      m.taken = true; lives++; score += 300; S.power();
      explode(m.x+13, m.y+13, "#ffd34d", 18, 4);
    }
  }

  // ----- 相机 -----
  // 第三关是往左跑：镜头多留出前方的空间（主角偏屏幕右侧）
  const camLead = finalRun ? 0.55 : 0.38;
  const targetCam = Math.max(0, Math.min(p.x - W*camLead, LEVEL_W - W));
  cam = boss.active ? Math.min(cam+6, LEVEL_W - W) : cam + (targetCam - cam)*0.12;

  // ----- 触发生成（通关演出阶段 / Boss 已破不再刷兵）-----
  if(state==="play" && !(boss && boss.dead)){
  for(let i=0;i<triggers.length;i++){
    const t = triggers[i];
    if(!usedTriggers.has(i) && cam + W*0.85 > t.x){
      usedTriggers.add(i);
      if(t.type==="runner") spawnRunner();
      if(t.type==="bomber"){
        const by = groundYAt(cam+W+40);
        enemies.push(makeSoldier(cam+W+40, by<Infinity ? by-40 : 300, "bomber"));
      }
      if(t.type==="sniper"){
        // 狙击手按地形坡面高度落位（杜绝浮空）
        const gy = groundYAt(t.px);
        enemies.push(makeSoldier(t.px, gy<Infinity ? gy-40 : 300, "sniper"));
      }
      if(t.type==="turret"){
        // 第二关的固定炮台全部换成坦克（会推进碾压 / 可踩上去当平台）
        if(LEVEL_IDX >= 2){
          enemies.push(makeTank(t.px));
        } else {
          // 炮台同样按坡面高度落位
          const gy = groundYAt(t.px);
          enemies.push(makeTurret(t.px, gy<Infinity ? gy-40 : 300, t.sp));
        }
      }
      if(t.type==="tank") enemies.push(makeTank(t.px));
      if(t.type==="trencher" || t.type==="towerSniper" || t.type==="camper"){
        enemies.push(makeFort(t.px, t.type==="towerSniper" ? "tower" : t.type));
      }
      if(t.type==="roller") enemies.push(makeRoller(t.px));
      if(t.type==="cam")    enemies.push(makeCam(t.px, t.py));
      if(t.type==="drone") enemies.push(makeDrone(t.px, t.py));
      // 第四关的外星守军
      if(t.type==="claw" || t.type==="spit"){
        const gyA = groundYAt(t.px);
        enemies.push(makeAlien(t.px, gyA < Infinity ? gyA : GROUND_Y, t.type));
      }
      if(t.type==="eye")    enemies.push(makeAlien(t.px, t.py || 200, "eye"));
    }
  }
  }

  // 自动补兵（Boss 破防后停刷）
  if(state==="play" && !(boss && boss.dead)){
    autoSpawnT++;
    if(autoSpawnT > 150 && enemies.filter(e=>e.kind==="soldier"&&e.mode==="runner").length < 3){
      autoSpawnT = 0; spawnRunner();
    }
  }

  // ----- 敌人 -----
  for(const e of enemies){
    if(e.kind==="alien"){ updateAlien(e, p); continue; }
    if(e.kind==="mini"){ updateMini(e, p); continue; }
    if(e.kind==="turret"){
      e.cd--;
      if(e.kick>0) e.kick--;
      const cxT = e.x + e.w/2, cyT = e.y + 19;            // 炮塔转轴
      const dx = (p.x+p.w/2) - cxT, dy = chestY() - cyT;
      // —— 炮塔平滑转向：每帧最多转一点，先"转头"再开火（给玩家反应时间）——
      const tgt = Math.atan2(dy, dx);
      if(e.gunA === undefined) e.gunA = Math.PI;          // 初始朝左（玩家来向）
      let da = tgt - e.gunA;
      while(da >  Math.PI) da -= Math.PI*2;
      while(da < -Math.PI) da += Math.PI*2;
      const turn = e.sp ? 0.05 : 0.072;                   // 特殊炮台转头更慢
      if(Math.abs(da) <= turn) e.gunA = tgt; else e.gunA += Math.sign(da)*turn;
      const aimed = Math.abs(da) < 0.15;                  // 大致对准才开火
      // 炮口位置（沿炮管方向伸出）
      const mx = cxT + Math.cos(e.gunA)*31, my = cyT + Math.sin(e.gunA)*31;
      if(e.sp){
        // 特殊炮台：单发瞄准、节奏慢、无散射
        if(!e.dead && Math.abs(dx)<560 && aimed && e.cd<=0){
          e.cd = 170; e.kick = 5;
          enemyShot(mx, my, mx+Math.cos(e.gunA)*120, my+Math.sin(e.gunA)*120, 4.2, 0.06, 160);
          S.shoot();
        }
      } else {
        if(!e.dead && Math.abs(dx)<560 && aimed && e.cd<=0){
          e.cd = 130; e.burst = 3; e.bt = 0;
        }
        if(e.burst>0){
          e.bt = (e.bt||0)+1;
          if(e.bt%18===1){
            // 三连单发瞄准（打点有偏差，玩家蹲/跳可躲）
            e.kick = 5;
            enemyShot(mx, my, mx+Math.cos(e.gunA)*120, my+Math.sin(e.gunA)*120, 4.8, 0.09, 160);
            S.shoot(); e.burst--;
          }
        }
      }
    } else if(e.kind==="roller"){
      // 滚轮炮台：朝主角一路碾过来，进入射程后停下三连点射
      e.animT = (e.animT||0) + 1;
      const dxr = (p.x+p.w/2) - (e.x+e.w/2);
      const dist = Math.abs(dxr);
      const dir = dxr > 0 ? 1 : -1;
      e.face = dir;
      // 移动（距离 > 250 时推进；太近也会后退一点避免贴脸）
      let mv = 0;
      if(dist > 205) mv = dir*1.45;
      else if(dist < 120) mv = -dir*0.9;
      e.vx = mv;
      e.wheel = (e.wheel||0) + mv*0.5;
      e.x += e.vx;
      // 木箱阻挡
      for(const c of crates){
        if(!c.dead && aabb(e,c) && e.y + e.h > c.y + 8){
          e.x = e.vx > 0 ? c.x - e.w : c.x + c.w;
          e.vx = 0;
        }
      }
      // 重力贴地
      const feetPrevR = e.y + e.h;
      e.vy = Math.min(e.vy + 0.55, 14); e.y += e.vy;
      if(e.vy >= 0){
        const gy = groundYAt(e.x + e.w/2);
        if(gy < Infinity && ((feetPrevR <= gy + 2 && e.y + e.h >= gy) ||
           (e.onGroundPrev && e.y + e.h >= gy - 1 && e.y + e.h <= gy + 16))){
          e.y = gy - e.h; e.vy = 0; e.onGroundPrev = true;
        } else e.onGroundPrev = false;
      }
      e.cd--;
      if(!e.dead && e.cd<=0 && dist < 420){ e.cd = 150; e.burst = 3; e.bt = 0; }
      if(e.burst>0){
        e.bt++;
        if(e.bt%16===1){
          enemyShot(e.x+e.w/2 + e.face*18, e.y+14, p.x+p.w/2, chestY(), 4.4, 0.14, 170);
          S.shoot(); e.burst--;
        }
      }
    } else if(e.kind==="tank"){
      // ===== 坦克：向前推进碾压 → 没碾到就倒退 → 循环；主炮只朝正前方平射，站车顶即安全 =====
      e.t++; if(e.flash>0) e.flash--;
      const dxk = (p.x+p.w/2) - (e.x+e.w/2);
      const dist = Math.abs(dxk);
      const dir = dxk > 0 ? 1 : -1;
      e.face = dir;
      // ---- 发现机制：进正面视野先「察觉·转炮塔」，确认目标后才开火；看不见就绝不射击 ----
      const dyT = Math.abs(chestY() - (e.y + 16));
      const inSight = !p.dead && dist < 560 && dyT < 170;
      if(!e.alerted){
        if(inSight){
          e.spot = (e.spot||0) + 1;
          if(e.spot >= 34){ e.alerted = true; e.spot = 0; e.loseT = 0; e.cd = Math.max(e.cd, 40); }
        } else e.spot = Math.max(0, (e.spot||0) - 2);
      } else if(dist > 780 || p.dead){
        e.loseT = (e.loseT||0) + 1;
        if(e.loseT > 90){ e.alerted = false; e.loseT = 0; e.cd = 70; }
      } else e.loseT = 0;
      // 状态机：待机 → 冲锋 → 后退 → 待机
      if(e.stT > 0) e.stT--;
      if(e.stT === 0){
        if(e.st === "charge")       { e.st = "retreat"; e.stT = 62; }
        else if(e.st === "retreat") { e.st = "idle";    e.stT = 74 + Math.random()*50; }
        else                        { e.st = "charge";  e.stT = 80; }
      }
      let mv = 0;
      if(e.st === "charge")       mv = dir * 3.1;      // 冲上来试图碾压
      else if(e.st === "retreat") mv = -dir * 1.9;     // 没碾到 → 倒车拉开距离
      else                        mv = dir * 0.55;     // 待机时缓慢找位置
      if(!e.alerted) mv = dir * 0.35;                  // 没发现主角：只轻轻巡场，不冲锋
      const nx = e.x + mv;
      if(nx < e.home - 340 || nx > e.home + 340) mv = 0;   // 不离开属地
      e.x += mv; e.vx = mv;
      e.tread += mv * 0.6;
      // 履带碾碎挡路的木箱
      for(const c of crates){
        if(!c.dead && aabb(e,c) && c.y + c.h > e.y + 8){
          c.hp = 0; c.dead = true; score += 50;
          explode(c.x+c.w/2, c.y+c.h/2, c.loot?"#d9b07a":"#8a6a3a", 16, 4);
          if(c.loot) dropLoot(c.x+c.w/2, c.y+c.h/2);
        }
      }
      // 站在车顶的玩家随车移动（被带着走）
      if(p.onGround && Math.abs((p.y+p.h) - e.y) <= 5 &&
         p.x + p.w > e.x + 4 && p.x < e.x + e.w - 4) p.x += mv;
      // 碾压判定：车身撞进玩家（站在车顶不算）
      if(!p.dead && p.inv <= 0 && p.y + p.h > e.y + 16 && aabb(hitbox(), e)) hurtPlayer();
      // 贴地
      const feetPrevK = e.y + e.h;
      e.vy = Math.min(e.vy + 0.55, 14); e.y += e.vy;
      if(e.vy >= 0){
        const gy = groundYAt(e.x + e.w/2);
        if(gy < Infinity && feetPrevK <= gy + 2 && e.y + e.h >= gy){ e.y = gy - e.h; e.vy = 0; }
      }
      // 炮击：炮管严格水平（仰角恒为 0），只向车头方向平射，打不到头顶/车顶的人
      e.cd--;
      e.gunA += (0 - e.gunA) * 0.18;
      // 锁定后的开火前提示：炮口前方短虚线（只在已经发现主角时亮）
      e.aim = (e.alerted && e.cd < 26 && e.cd > 0 && dist < 620) ? e.cd : 0;
      if(e.alerted && !e.dead && e.cd <= 0 && dist < 620){
        e.cd = 84 + Math.random()*40; e.recoil = 11;
        const sx = e.x + e.w/2 + e.face*78, sy = e.y + 13;   // 炮口位置（与绘制对齐）
        enemyShot(sx, sy, sx + e.face*600, sy, 6.0, 0, 220);  // 零散布、零俯仰：纯水平前射
        const shell = ebullets[ebullets.length - 1];
        if(shell){ shell.shell = true; shell.r = 5.6; }   // 坦克炮弹：普通红色圆弹
        S.shoot(); shake = Math.max(shake, 5);
        // 炮口烟 + 车体震动
        for(let k=0;k<7;k++) particles.push({x:sx + e.face*10, y:sy, vx:e.face*(1.5+Math.random()*2.2),
          vy:-Math.random()*1.2, life:16+Math.random()*8, color:"#ffe58a"});
        for(let k=0;k<4;k++) particles.push({x:sx, y:sy, vx:e.face*(0.4+Math.random()),
          vy:-Math.random()*1.6, life:22+Math.random()*10, color:"#9aa0a8"});
      }
      if(e.recoil > 0) e.recoil--;
    } else if(e.kind==="cam"){
      // 天花板摄像头：扫描到主角 → 红灯预警 → 只打一发（数量多，靠密度施压）
      e.t = (e.t||0) + 1; e.animT += 0.35;
      e.y = e.baseY + Math.sin(e.t*0.05)*2;
      const dxc = (p.x+p.w/2) - (e.x+e.w/2);
      e.cd--;
      if(e.warn > 0){
        e.warn--;
        if(e.warn === 0){ e.burst = 1; e.bt = 0; }
      } else if(!e.dead && e.cd<=0 && Math.abs(dxc)<640){
        e.cd = 150 + Math.random()*45;
        e.warn = 26;
      }
      if(e.burst>0){
        e.bt++;
        if(e.bt%9===1){
          enemyShot(e.x+e.w/2, e.y+e.h, p.x+p.w/2, chestY(), 4.2, 0.14, 190);
          sfx(880,.06,"square",.04,-200); e.burst--;
        }
      }
    } else if(e.kind==="drone"){
      // 巡逻无人机：在玩家上方漂移悬停，周期性单发瞄准射击
      e.t = (e.t||0) + 1; e.animT += 0.5;
      const homeX = p.x + e.side*150;
      e.x += (homeX - e.x) * 0.010;
      e.y = e.baseY + Math.sin(e.t*0.035)*24;
      e.cd--;
      if(!e.dead && e.cd<=0 && Math.abs((p.x+p.w/2)-(e.x+e.w/2))<540){
        e.cd = 95;
        enemyShot(e.x+e.w/2, e.y+e.h-4, p.x+p.w/2, chestY(), 4.6, 0.16, 180);
        S.shoot();
      }
    } else if(e.kind==="fort"){ // 工事类：战壕兵 / 高塔狙击 / 草丛伏兵
      e.t++;
      if(e.mode==="trencher"){
        // 周期性抬头射击再蹲下；蹲下时不可被击中
        e.cd--;
        if(e.cd<=0){ e.up = 120; e.cd = 250 + Math.random()*60; }
        if(e.up>0){
          e.up--;
          if(e.up===105 || e.up===65){
            enemyShot(e.x+26, e.y-20, p.x+p.w/2, chestY(), 4.6, 0.13, 160);
            S.shoot();
          }
        }
      } else if(e.mode==="tower"){
        // 高处狙击：射程更远、弹速更快
        e.cd--;
        if(!e.dead && e.cd<=0 && Math.abs(p.x-e.x)<720){
          e.cd = 140;
          enemyShot(e.x+23, e.y-170, p.x+p.w/2, chestY(), 5.4, 0.08, 200);
          S.shoot();
        }
      } else { // camper：藏在草丛，玩家靠近才现身开火
        if(!e.revealed && Math.abs((p.x+p.w/2)-(e.x+20))<240){ e.revealed = true; e.cd = 30; }
        if(e.revealed){
          e.cd--;
          if(e.cd<=0){
            e.cd = 110;
            enemyShot(e.x+20, e.y-30, p.x+p.w/2, chestY(), 4.8, 0.14, 160);
            S.shoot();
          }
        }
      }
    } else { // soldier
      if(e.mode==="sniper"){
        // 狙击手不移动，但同样受重力，确保始终贴在支撑面上
        const feetPrevS = e.y + e.h;
        e.vy = Math.min(e.vy + 0.55, 14); e.y += e.vy;
        if(e.vy >= 0){
          const footL = e.x + 2, footR = e.x + e.w - 2;
          for(const pl of platforms.concat(crates)){
            if(pl.dead) continue;
            if(footR > pl.x && footL < pl.x + pl.w &&
               feetPrevS <= pl.y + 2 && e.y + e.h >= pl.y){ e.y = pl.y - e.h; e.vy = 0; break; }
          }
          if(e.vy > 0){
            const gy = groundYAt(e.x + e.w/2);
            if(gy < Infinity && feetPrevS <= gy + 2 && e.y + e.h >= gy){
              e.y = gy - e.h; e.vy = 0;
            }
          }
        }
        e.cd--;
        if(!e.dead && e.cd<=0){
          e.cd = 110;
          enemyShot(e.x+e.w/2, e.y+10, p.x+p.w/2, chestY(), 4.6, 0.12, 160);
          S.shoot();
        }
      } else { // runner / bomber：冲向玩家
        const dir = p.x > e.x ? 1 : -1;
        e.vx = dir * (e.mode==="bomber" ? 2.9 : 2.1);
        e.x += e.vx;
        // 木箱阻挡冲锋兵：被挡时尝试跳过去
        for(const c of crates){
          if(!c.dead && aabb(e,c) && e.y + e.h > c.y + 8){
            e.x = e.vx > 0 ? c.x - e.w : c.x + c.w;
            if(e.onGroundPrev && Math.random() < 0.25) e.vy = -9;
          }
        }
        const feetPrevE = e.y + e.h;
        e.vy = Math.min(e.vy + 0.55, 14); e.y += e.vy;
        // 扫掠式落地：平台或地面，脚部任一部分接触即站立
        if(e.vy >= 0){
          const footL = e.x + 2, footR = e.x + e.w - 2;
          let ok = false;
          for(const pl of platforms.concat(crates)){
            if(pl.dead) continue;
            if(footR > pl.x && footL < pl.x + pl.w &&
               feetPrevE <= pl.y + 2 && e.y + e.h >= pl.y){
              e.y = pl.y - e.h; e.vy = 0; ok = true; break;
            }
          }
          if(!ok){
            const gy = groundYAt(e.x + e.w/2);
            const feet = e.y + e.h;
            if(gy < Infinity &&
               ((feetPrevE <= gy + 2 && feet >= gy) ||
                (e.onGroundPrev && feet >= gy - 1 && feet <= gy + 14))){ // 贴地跑坡
              e.y = gy - e.h; e.vy = 0; ok = true;
            }
          }
          e.onGroundPrev = ok;
          // 站在地面边缘前方是悬崖时，起跳跨过去
          if(ok && groundYAt(e.x + e.w/2 + e.vx*22) === Infinity && Math.random() < 0.5){
            e.vy = -10; e.onGroundPrev = false;
          }
        }
      }
    }
    // 敌人撞到玩家（自爆兵撞击即自爆）
    if(!e.dead && !p.dead && p.inv<=0 && aabb(hitbox(),ebox(e))){
      hurtPlayer();
      if(e.mode==="bomber") e.dead = true;
    }
  }
  // 自爆兵死亡：向四周抛出 14 颗红色球弹（带抛物线，落地再炸开）
  for(const e of enemies){
    if(e.dead && e.mode==="bomber" && !e.bombed){
      e.bombed = true;
      for(let k=0;k<14;k++){
        const a = -Math.PI/2 + (k-6.5)*0.24 + Math.random()*0.12; // 以上半圈为主抛出
        const v = 2.6 + Math.random()*2.2;
        ebullets.push({x:e.x+e.w/2, y:e.y+e.h/2, w:12, h:12, r:6.5,
                       vx:Math.cos(a)*v, vy:Math.sin(a)*v - 3.5, g:true, life:220});
      }
      explode(e.x+e.w/2, e.y+e.h/2, "#ff5b3d", 24, 5.5);
      sfx(120,.4,"sawtooth",.12,-60); shake = Math.max(shake,6);
    }
  }
  // 死亡的敌人立即移除；出界/坠落的也移除
  // 小 Boss 是锁场战斗的主角，不能因为镜头还没跟上就被当成"出界"清掉
  enemies = enemies.filter(e => !e.dead && (e.kind === "mini" || (e.x > cam - 200 && e.x < cam + W + 400 && e.y < H + 80)));

  // ----- 第四~八关：母舰中段的小 Boss（锁场、死亡结算）-----
  if(miniArena && state === "play"){
    if(!miniSpawned && p.x > miniArena.l + 60 && p.x < miniArena.r) spawnMini();
    if(mini){
      if(!mini.dead){
        // 闸门落下：这一小段必须打赢才能继续往前走
        p.x = Math.max(miniArena.l, Math.min(p.x, miniArena.r - p.w));
      } else if(!mini.rewarded){
        mini.rewarded = true;
        lives++; score += 2000;
        shake = Math.max(shake, 26);
        explode(mini.x + mini.w/2, mini.y + mini.h/2, "#7dfce8", 40, 8);
        explode(mini.x + mini.w/2, mini.y + mini.h/2, "#ff5b3d", 26, 5.5);
        sfx(65,.9,"sawtooth",.16,-40);
        dropLoot(mini.x + mini.w/2, mini.y + mini.h/2);
        ebullets = [];
      }
    }
  }

  // ----- Boss -----
  const b = boss;
  if(!b.dead){
    if(!b.active && p.x > LEVEL_W - 1000){ b.active = true; }
    if(b.active){
      b.t++;
      cam = Math.min(cam+6, LEVEL_W - W);
      if(b.kind === "alien"){
        updateAlienBoss(b, p);
      } else if(b.kind === "carrier"){
        updateCarrierBoss(b, p);
      } else if(b.kind === "reactor"){
        // 第二关：反应堆核心（上下两座旋转炮舱 + 护盾核心）
        b.core.shielded = b.cannons.some(c => !c.dead);
        if(b.t % 260 === 0) spawnRunner(true);
        for(const c of b.cannons){
          if(c.dead) continue;
          c.t++;
          if(c.t % 230 === 0){                       // 旋转六向弹幕（数量与频率都调低）
            for(let k=0;k<6;k++){
              const ang = b.t*0.045 + k*Math.PI/3;
              ebullets.push({x:c.x+c.w/2, y:c.y+c.h/2, w:9, h:9, r:5,
                             vx:Math.cos(ang)*3.2, vy:Math.sin(ang)*3.2, life:230});
            }
            S.shoot();
          }
          if(c.t % 230 === 115){                     // 单发瞄准（不再三连）
            const dx=(p.x+p.w/2)-(c.x+c.w/2), dy=chestY()-(c.y+c.h/2), base=Math.atan2(dy,dx);
            ebullets.push({x:c.x+c.w/2, y:c.y+c.h/2, w:8, h:8, vx:Math.cos(base)*5, vy:Math.sin(base)*5, life:220});
            S.shoot();
          }
          if(aabb(hitbox(), c) && p.inv<=0) hurtPlayer();
        }
        const core = b.core;
        if(!core.dead){
          if(b.t % 420 === 40){                      // 环形弹幕（护盾期 6 发 / 破盾后 8 发）
            const n = core.shielded ? 6 : 8;
            for(let k=0;k<n;k++){
              const ang = b.t*0.06 + k*Math.PI*2/n;
              ebullets.push({x:core.x+core.w/2, y:core.y+core.h/2, w:8, h:8, r:4.6,
                             vx:Math.cos(ang)*4.2, vy:Math.sin(ang)*4.2, life:240});
            }
            S.shoot();
          }
          if(aabb(hitbox(), core) && p.inv<=0) hurtPlayer();
        }
        // 三种非弹幕攻击（电弧 / 激光 / 落锤）
        updateReactorSpecials(b, p);
      } else {
        // 首发：巨型黑铁弹（比所有炮火都先出手），之后每 330 帧补一颗
        b.ballT = (b.ballT||0) + 1;
        if(!b.ballLock && (b.ballT === 24 || (b.ballT > 24 && b.ballT % 330 === 0))) spawnIronBall(b);
        // 瞭望台狙击兵（阵亡 5 秒后由增援接替）
        updateFortSniper(b, p);
        if(b.t % 140 === 0) spawnRunner(true); // 要塞召唤小兵
        // 火炮：单发瞄准（散射已移除）
        for(const c of b.cannons){
          if(c.dead) continue;
          c.t++;
          if(c.t % 150 === 0){
            const dx=(p.x+p.w/2)-(c.x), dy=chestY()-(c.y+c.h/2), base=Math.atan2(dy,dx);
            ebullets.push({x:c.x, y:c.y+c.h/2, w:8, h:8, vx:Math.cos(base)*5, vy:Math.sin(base)*5, life:220});
            S.shoot();
          }
          if(aabb(hitbox(),c) && p.inv<=0) hurtPlayer();
        }
        // 核心：旋转环形弹幕
        const core = b.core;
        if(!core.dead && b.t % 170 === 30){
          for(let k=0;k<6;k++){
            const ang = (b.t*0.05) + k*Math.PI/3;
            ebullets.push({x:core.x, y:core.y+core.h/2, w:8, h:8, vx:Math.cos(ang)*4.2, vy:Math.sin(ang)*4.2, life:220});
          }
          S.shoot();
        }
        if(!core.dead && aabb(hitbox(),core) && p.inv<=0) hurtPlayer();
      }
    }
  }
  // 黑铁巨弹推进（物理滚动 / 与主角、木箱、子弹的交互都在里面）
  updateIronBalls();
  // 红液（第三关的残留泄漏）与崩塌中的工厂碎片
  if(redPools.length) updateRedPools();
  if(finalRun) updateFinalRun(p);

  // ----- 子弹 -----
  for(const bl of bullets){
    // 抛物线炸弹：命中敌人/落地/超时即爆炸（范围杀伤 85px，-3 血）
    if(bl.bomb){
      // 追踪修正：锁定目标仍存活时，每帧重新解算水平速度指向目标当前位置
      if(bl.tref && !bl.tref.dead){
        bl.T = Math.max(6, bl.T - 1);
        bl.vx = ((bl.tref.x + bl.tref.w/2) - (bl.x+7)) / bl.T;
        if(Math.hypot((bl.tref.x+bl.tref.w/2)-(bl.x+7), (bl.tref.y+bl.tref.h/2)-(bl.y+7)) < 28) bl.life = 1; // 近距引爆
      }
      bl.vy += BOMB_G; bl.x += bl.vx; bl.y += bl.vy; bl.life--;
      if(bl.life%4===0) particles.push({x:bl.x+4, y:bl.y+4, vx:-bl.vx*0.1, vy:-0.3, life:14, color:"#9aa0a8"});
      const gy = groundYAt(bl.x + bl.w/2);
      let boom = bl.life<=0 || bl.y+bl.h >= (gy===Infinity ? H+60 : gy);
      if(!boom) for(const e of enemies){ if(!e.dead && aabb(bl,e)){ boom=true; break; } }
      if(boom){
        bl.life = 0;
        explode(bl.x+7, bl.y+7, "#ffb347", 30, 6);
        explode(bl.x+7, bl.y+7, "#ff5b3d", 20, 4);
        shake = Math.max(shake, 10);
        sfx(90,.5,"sawtooth",.14,-40);
        for(const e of enemies){
          if(e.dead) continue;
          const d = Math.hypot((e.x+e.w/2)-(bl.x+7), (e.y+e.h/2)-(bl.y+7));
          if(d<85) damageEnemy(e, 3);
        }
        // 炸弹爆炸同样能炸碎木箱 / 快递箱
        for(const c of crates){
          if(c.dead) continue;
          const cx2 = c.x + c.w/2, cy2 = c.y + c.h/2;
          if(Math.hypot(cx2-(bl.x+7), cy2-(bl.y+7)) < 88){
            c.hp -= 4; c.flash = 6;
            if(c.hp <= 0){
              c.dead = true; score += 50;
              explode(cx2, cy2, c.loot ? "#d9b07a" : "#8a6a3a", 16, 4);
              sfx(110,.3,"sawtooth",.1,-60);
              if(c.loot) dropLoot(cx2, cy2);
            }
          }
        }
        // 炸弹同样能炸碎黑铁弹 / 炸掉狙击兵
        for(const ball of ironBalls){
          if(ball.dead) continue;
          if(Math.hypot(ball.x-(bl.x+7), ball.y-(bl.y+7)) < 88){
            ball.hp -= 3; ball.flash = 6;
            if(ball.hp <= 0) blastIronBall(ball, false);
          }
        }
        const bsx2 = sniperBox();
        if(bsx2 && Math.hypot((bsx2.x+11)-(bl.x+7), (bsx2.y+20)-(bl.y+7)) < 92) damageSniper(3);
        if(boss.active && !boss.dead){
          for(const c of boss.cannons){
            if(c.dead) continue;
            if(Math.hypot((c.x+c.w/2)-(bl.x+7), (c.y+c.h/2)-(bl.y+7))<90){
              c.hp-=3; explode(c.x+c.w/2,c.y+c.h/2,"#ff9b4d",16,5);
              if(c.hp<=0){ c.dead=true; score+=800; shake=10; S.hitE(); }
            }
          }
          const core = boss.core;
          if(!core.dead && Math.hypot((core.x+core.w/2)-(bl.x+7), (core.y+core.h/2)-(bl.y+7))<95){
            if(core.shielded){ explode(core.x+core.w/2, core.y+core.h/2, "#5afff0", 12, 4); }
            else { core.hp-=3; if(core.hp<=0) killCore(); }
          }
        }
      }
      continue;
    }
    // 镭射光束：静止贯穿，对路径上所有目标造成一次伤害
    if(bl.beam){
      bl.life--;
      const LEN = 950;
      const hitTest = (r)=>{
        for(let s=0;s<=LEN;s+=12){
          const px=bl.x+bl.dx*s, py=bl.y+bl.dy*s;
          if(px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h) return true;
        }
        return false;
      };
      for(const e of enemies){
        if(!e.dead && !bl.hit.has(e) && hitTest(ebox(e))){
          bl.hit.add(e); e.hp-=3;
          if(e.hp<=0){
            e.dead=true; killCount++;
            score += scoreFor(e);
            explode(e.x+e.w/2,e.y+e.h/2,"#ff9b4d",14,4); S.hitE();
          }
        }
      }
      // 镭射能烧穿木箱 / 快递箱（贯穿烧一排）
      if(!bl.hitCrates) bl.hitCrates = new Set();
      for(const c of crates){
        if(c.dead || bl.hitCrates.has(c)) continue;
        if(hitTest(c)){
          bl.hitCrates.add(c); c.hp -= 3; c.flash = 6;
          explode(c.x+c.w/2, c.y+c.h/2, "#c9a17a", 8, 3); S.hitE();
          if(c.hp <= 0){
            c.dead = true; score += 50;
            explode(c.x+c.w/2, c.y+c.h/2, c.loot ? "#d9b07a" : "#8a6a3a", 16, 4);
            sfx(110,.3,"sawtooth",.1,-60);
            if(c.loot) dropLoot(c.x+c.w/2, c.y+c.h/2);
          }
        }
      }
      // 镭射同样能击碎黑铁弹 / 打死瞭望台狙击兵
      for(const ball of ironBalls){
        if(ball.dead) continue;
        if(!bl.hitBalls) bl.hitBalls = new Set();
        if(bl.hitBalls.has(ball)) continue;
        if(hitTest({x:ball.x-ball.r, y:ball.y-ball.r, w:ball.r*2, h:ball.r*2})){
          bl.hitBalls.add(ball); ball.hp -= 3; ball.flash = 6;
          if(ball.hp <= 0) blastIronBall(ball, false);
        }
      }
      const sbx = sniperBox();
      if(sbx && !bl.hitSniper && hitTest(sbx)){ bl.hitSniper = true; damageSniper(3); }
      if(boss.active && !boss.dead){
        for(const c of boss.cannons){
          if(!c.dead && !bl.hit.has(c) && hitTest(c)){
            bl.hit.add(c); c.hp-=3;
            if(c.hp<=0){ c.dead=true; score+=800; explode(c.x+c.w/2,c.y+c.h/2,"#ff9b4d",20,5); shake=8; S.hitE(); }
          }
        }
        const core = boss.core;
        if(!core.dead && !bl.hit.has(core) && hitTest(core)){
          bl.hit.add(core);
          if(core.shielded){ explode(core.x+core.w/2, core.y+core.h/2, "#5afff0", 10, 3); }
          else { core.hp-=3; if(core.hp<=0) killCore(); }
        }
      }
      continue;
    }
    bl.x+=bl.vx; bl.y+=bl.vy; bl.life--;
    // 打木箱（可破坏，打碎得分）
    for(const c of crates){
      if(bl.life>0 && !c.dead && aabb(bl,c)){
        bl.life=0; c.hp--; c.flash=6; explode(bl.x,bl.y,"#c9a17a",4,2); S.hitE();
        if(c.hp<=0){
          c.dead=true; score+=50;
          explode(c.x+c.w/2, c.y+c.h/2, c.loot ? "#d9b07a" : "#8a6a3a", 16, 4);
          sfx(110,.3,"sawtooth",.1,-60);
          if(c.loot) dropLoot(c.x+c.w/2, c.y+c.h/2);
        }
        break;
      }
    }
    // 打黑铁巨弹（可以打碎，打碎即安全拆除）
    if(bl.life>0){
      for(const ball of ironBalls){
        if(ball.dead) continue;
        if(aabb(bl, {x:ball.x-ball.r, y:ball.y-ball.r, w:ball.r*2, h:ball.r*2})){
          bl.life = 0; ball.hp -= (bl.dmg||1); ball.flash = 5;
          explode(bl.x, bl.y, "#ffe86b", 6, 3); S.hitE();
          if(ball.hp <= 0) blastIronBall(ball, false);
          break;
        }
      }
    }
    // 打头顶掉下来的工厂碎片：打够就可以在空中碎掉
    if(bl.life>0 && debris.length){
      for(const d of debris){
        if(d.dead) continue;
        if(aabb(bl, d)){
          bl.life = 0;
          if(d.hp === undefined) d.hp = d.w > 46 ? 3 : 1;
          d.hp -= (bl.dmg||1); d.flash = 5;
          explode(bl.x, bl.y, "#cfd8e3", 5, 2.2); S.hitE();
          if(d.hp <= 0){
            d.dead = true; score += 30;
            explode(d.x + d.w/2, d.y + d.h/2, "#9aa0a8", 12, 3.6);
            explode(d.x + d.w/2, d.y + d.h/2, "#ffd34d", 5, 2.2);
            sfx(220,.14,"square",.07,-150);
          }
          break;
        }
      }
    }
    // 打瞭望台狙击兵
    if(bl.life>0){
      const sb = sniperBox();
      if(sb && aabb(bl, sb)){ bl.life = 0; damageSniper(bl.dmg||1); }
    }
    // 打敌人
    for(const e of enemies){
      if(!e.dead && aabb(bl,ebox(e))){
        bl.life=0; e.hp-=bl.dmg||1; explode(bl.x,bl.y,"#fff3a0",5,2.5);
        if(e.hp<=0){
          e.dead=true; killCount++;
          score += scoreFor(e);
          explode(e.x+e.w/2,e.y+e.h/2,"#ff9b4d",14,4); S.hitE();
        }
        break;
      }
    }
    // 打 Boss：先炮台后核心
    if(bl.life>0 && boss.active && !boss.dead){
      for(const c of boss.cannons){
        if(!c.dead && aabb(bl,c)){
          bl.life=0; c.hp-=bl.dmg||1; explode(bl.x,bl.y,"#fff3a0",6,3); S.hitE();
          if(c.hp<=0){ c.dead=true; score+=800; explode(c.x+c.w/2,c.y+c.h/2,"#ff9b4d",20,5); shake=8; }
          break;
        }
      }
      const core = boss.core;
      if(bl.life>0 && !core.dead && aabb(bl,core)){
        bl.life=0;
        if(core.shielded){ explode(bl.x,bl.y,"#5afff0",6,3); }
        else {
          core.hp-=bl.dmg||1; explode(bl.x,bl.y,"#fff3a0",6,3); S.hitE();
          if(core.hp<=0) killCore();
        }
      }
    }
  }
  bullets = bullets.filter(b=>b.life>0 && b.x>cam-40 && b.x<cam+W+40 && b.y>-40 && b.y<H+40);

  for(const bl of ebullets){
    // 自爆兵抛物线炸弹：受重力下坠，落地/超时炸开（近身范围伤害）
    if(bl.g){
      bl.vy += 0.28; bl.x += bl.vx; bl.y += bl.vy; bl.life--;
      const gy = groundYAt(bl.x);
      if(bl.y + bl.r >= (gy===Infinity ? H+60 : gy) || bl.life<=0){
        bl.life = 0;
        explode(bl.x, bl.y, "#ff5b3d", 14, 4.5);
        explode(bl.x, bl.y, "#ffb347", 8, 3);
        sfx(150,.22,"sawtooth",.07,-90);
        if(p.inv<=0 && !p.dead && Math.hypot((p.x+p.w/2)-bl.x, (p.y+p.h/2)-bl.y) < 52) hurtPlayer();
      } else if(p.inv<=0 && !p.dead && aabb(hitbox(),bl)){
        bl.life = 0; hurtPlayer();
        explode(bl.x, bl.y, "#ff5b3d", 14, 4.5);
      }
      continue;
    }
    bl.x+=bl.vx; bl.y+=bl.vy; bl.life--;
    // 敌弹被木箱挡下（木箱=玩家的掩体）
    for(const c of crates){
      if(bl.life>0 && !c.dead && aabb(bl,c)){
        bl.life=0; c.flash=6; explode(bl.x,bl.y,"#c9a17a",4,2);
        break;
      }
    }
    if(bl.life>0 && p.inv<=0 && !p.dead && aabb(hitbox(),bl)){ bl.life=0; hurtPlayer(); }
  }
  ebullets = ebullets.filter(b=>b.life>0);

  // 粒子
  for(const q of particles){ q.x+=q.vx; q.y+=q.vy; q.vy+=0.25; q.life--; }
  particles = particles.filter(q=>q.life>0);
  if(debris.length) debris = debris.filter(d => !d.dead);      // 被打碎/落地的碎片清出列表
  for(const c of crates) if(c.flash>0) c.flash--;

  // 通关演出：主角走进基地大门 → 过关结算
  if(state==="walkin" && p.x >= boss.core.x - 30){
    state="win"; stateTimer=0; keys["ArrowRight"]=false;
    BGM.stop(); S.clear();
  }
}

// ============ 第四关：外星巢穴的三种守军 ============
// claw = 爪兵（贴地冲刺 + 跳扑）  spit = 吐酸兵（抛物线酸球）  eye = 悬浮眼球（追踪能量弹）
function makeAlien(px, py, mode){

  return {kind:"alien", mode, x:px, y:py - h, w, h,
          hp: mode === "spit" ? 3 : 2, maxHp: mode === "spit" ? 3 : 2,
          face:-1, t:Math.random()*100, cd:90 + Math.random()*60, flash:0,
          vx:0, vy:0, jumpCd:60 + Math.random()*60, onGroundPrev:true,
          spit:0, animT:Math.random()*20, dead:false};
}
function updateAlien(e, p){
  e.t++; if(e.flash > 0) e.flash--;
  e.animT += 0.24;
  const px = p.x + p.w/2, py = p.y + p.h/2;
  const cx = e.x + e.w/2, cy = e.y + e.h/2;
  const dx = px - cx, dist = Math.abs(dx);
  e.face = dx > 0 ? 1 : -1;
  if(p.dead) return;

  // ---- 悬浮眼球：保持高度，缓慢横移对准，定期三连追踪弹 ----
  if(e.mode === "eye"){
    e.bob += 0.055;
    const wantY = Math.min(chestY() - 46, e.homeY + Math.sin(e.bob)*15);
    if(dist > 150) e.x += e.face * Math.min(1.15, dist*0.012);
    e.y += (wantY - e.y) * 0.05;
    e.cd--;
    if(e.cd <= 0 && dist < 640){
      e.cd = 120 + Math.random()*60;
      const base = Math.atan2(chestY() - cy, (p.x+p.w/2) - cx);
      for(let k=0;k<3;k++){
        const ang = base + (k-1)*0.11;
        ebullets.push({x:cx, y:cy, w:9, h:9, r:5,
                       vx:Math.cos(ang)*3.6, vy:Math.sin(ang)*3.6, life:220, alien:true});
      }
      S.shoot();
    }
    return;
  }

  // ---- 吐酸兵：保持中距离，抛物线酸球砸脚 ----
  if(e.mode === "spit"){
    e.cd--;
    if(e.spit > 0) e.spit--;
    if(dist < 210) e.x -= e.face * 0.75;
    else if(dist > 430) e.x += e.face * 0.9;
    if(e.cd <= 0 && dist < 560){
      e.cd = 135 + Math.random()*50; e.spit = 12;
      const T = 52;
      const vx = ((p.x + p.w/2) - cx) / T;
      const vy = ((p.y + p.h - 6) - (e.y + 12) - 0.5*0.30*T*T) / T;
      ebullets.push({x:cx, y:e.y + 12, w:11, h:11, r:6, vx, vy, g:0.30, life:200, acid:true});
      sfx(180,.2,"sawtooth",.07,-90);
    }
    // 贴地行走（有坡就跟着地形）
    const gy = groundYAt(cx);
    if(gy < Infinity) e.y = gy - e.h;
    return;
  }

  // ---- 爪兵：贴地冲刺，靠近就跳扑，落地继续追 ----
  e.jumpCd = Math.max(0, (e.jumpCd||0) - 1);
  const chase = dist < 520 ? 1.85 : 0.85;
  e.x += e.face * chase;
  e.vy += 0.55;
  e.y += e.vy;
  const gy = groundYAt(e.x + e.w/2);
  if(gy < Infinity && e.y + e.h >= gy && e.vy >= 0){
    e.y = gy - e.h; e.vy = 0; e.onGroundPrev = true;
  } else if(e.y + e.h < gy - 4) e.onGroundPrev = false;
  if(e.onGroundPrev && dist < 240 && dist > 40 && e.jumpCd <= 0){
    e.vy = -9.2; e.jumpCd = 100; e.onGroundPrev = false;
  }
  if(e.onGroundPrev && groundYAt(e.x + e.w/2 + e.face*34) === Infinity && e.jumpCd <= 0){
    e.vy = -8.4; e.jumpCd = 70;
  }
  if(e.y > H + 100){ e.dead = true; }
}

// 工事敌人的受击盒（隐藏时为空盒=不可被打）
function ebox(e){

  if(e.mode==="trencher") return e.up>0 ? {x:e.x+12, y:e.y-30, w:28, h:30} : {x:-9999,y:-9999,w:0,h:0};

function scoreFor(e){
  if(e.kind==="alien")  return e.mode==="eye" ? 450 : 320;
  if(e.kind==="mini")   return 3000;
  if(e.kind==="turret") return 500;
  if(e.kind==="tank")   return 1200;
  if(e.kind==="roller") return 600;
  if(e.kind==="cam")    return 350;
  if(e.kind==="drone")  return 300;
  if(e.kind==="fort")   return e.mode==="tower"?400 : e.mode==="camper"?250 : 150;
  return e.mode==="sniper" ? 200 : 100;
}

const BOMB_G = 0.35; // 炸弹抛物线重力
// 统一开火入口：force=true 时无视冷却
// 炸弹武器的附加射击：只吐子弹、单独冷却，让 B 枪可以"一手投弹一手扫射"
function shootBulletOnly(){
  const p = player;
  if(!p || p.dead) return;
  const mvx = Math.cos(p.aimAng), mvy = Math.sin(p.aimAng);
  const downAim = p.aimAng === Math.PI/2;
  const bx = p.x + p.w/2 + (p.crouch ? 0 : p.face*mvx*8);
  const by = downAim ? p.y + p.h - 4 : (p.crouch ? p.y+28 : p.y+12+mvy*8);
  const lv = (p.wlv && p.wlv.B) || 0;
  const dmg = p.aimAng !== 0 ? 2 : 1;
  const spd = p.aimAng !== 0 ? 13.8 : 12;
  p.bulletCd = 7;
  const rows = lv>=2 ? [-6,0,6] : (lv>=1 ? [-5,5] : [0]);
  for(const yo of rows)
    bullets.push({x:bx, y:by+yo, w:6, h:6, vx:p.face*mvx*spd, vy:mvy*spd, life:70, dmg});
  S.shoot();
}
function tryShoot(force){
  const p = player;
  if(!p || p.dead) return;
  if(p.fireCd>0 && !force) return;
  const mvx = Math.cos(p.aimAng), mvy = Math.sin(p.aimAng); // 局部坐标：+x 为面朝方向
  const downAim = p.aimAng === Math.PI/2;                   // 空中朝下射击
  const bx = p.x + p.w/2 + (p.crouch ? 0 : p.face*mvx*8);
  const by = downAim ? p.y + p.h - 4 : (p.crouch ? p.y+28 : p.y+12+mvy*8);
  const mk = (vx,vy,dmg=1,yoff=0)=>bullets.push({x:bx,y:by+yoff,w:6,h:6,vx,vy,life:70,dmg});
  // 抬枪向上瞄准增强：伤害 2、弹速更快
  const boost = p.aimAng !== 0 ? 1.15 : 1;
  const dmg   = p.aimAng !== 0 ? 2 : 1;
  const lv = p.wlv && p.wlv[p.weapon] || 0; // 武器等级 0/1/2 = Lv1/Lv2/Lv3
  if(p.weapon==="B"){ // 炸弹：自动锁定面前最近的敌人，投出抛物线炸弹；Lv2 双弹 / Lv3 三弹齐投
    p.fireCd = lv>=2 ? 44 : (lv>=1 ? 40 : 32);
    // 收集面朝方向按距离排序的敌人
    const cands = enemies.filter(e=>!e.dead && Math.sign((e.x+e.w/2)-bx)===p.face)
                         .sort((a,b)=>Math.abs(a.x-bx)-Math.abs(b.x-bx));
    // 炸弹还能锁定 Boss 的炮舱 / 核心 / 瞭望台狙击兵（它们不在 enemies 列表里）
    if(boss && boss.active && !boss.dead){
      for(const c of boss.cannons) if(!c.dead)
        cands.push({x:c.x, y:c.y, w:c.w, h:c.h, dead:false, bossPart:true});
      const bc = boss.core;
      if(bc && !bc.dead) cands.push({x:bc.x, y:bc.y, w:bc.w, h:bc.h, dead:false, bossPart:true});
    }
    const sbT = sniperBox();
    if(sbT && Math.sign((sbT.x + sbT.w/2) - bx) === p.face)
      cands.push({x:sbT.x, y:sbT.y, w:sbT.w, h:sbT.h, dead:false, bossPart:true});
    if(cands.length > 1) cands.sort((a,b)=>
      Math.abs(a.x+a.w/2-bx)-Math.abs(b.x+b.w/2-bx));
    const throwBomb = (tgt, extraT)=>{
      let vx, vy, T;
      if(tgt){
        const tx=tgt.x+tgt.w/2, ty=tgt.y+tgt.h/2;
        T = Math.max(26, Math.abs(tx-bx)/7) + extraT;
        vx=(tx-bx)/T; vy=(ty-by-0.5*BOMB_G*T*T)/T;
      } else { vx=p.face*6; vy=-7; T=90; }
      bullets.push({bomb:true, x:bx, y:by, w:14, h:14, tref:tgt, T, vx, vy, life:150});
    };
    const nB = lv>=2 ? 3 : (lv>=1 ? 2 : 1);
    for(let i=0;i<nB;i++){
      // 依次锁定第 1/2/3 近的目标；不够就错开时间砸同一目标
      const tgt = cands[i] || cands[0] || null;
      throwBomb(tgt, cands[i] ? 0 : i*10);
    }
    sfx(300,.2,"triangle",.08,-160);
  } else if(p.weapon==="L"){ // 镭射枪：贯穿光束；等级越高越粗、伤害越高
    p.fireCd = 45;
    bullets.push({beam:true, x:bx, y:by, dx:p.face*mvx, dy:mvy, life:14, hit:new Set(),
                  bw: 7 + lv*5, bd: 3 + lv});
    sfx(1200,.25,"sawtooth",.09,-900);
  } else if(p.weapon==="M"){ // 机枪：高射速连发；Lv2 双排 / Lv3 三排
    p.fireCd = 5;
    const rows = lv>=2 ? [-9,0,9] : (lv>=1 ? [-6,6] : [0]);
    for(const yo of rows) mk(p.face*mvx*12*boost, mvy*12*boost, dmg, yo);
    S.shoot();
  } else if(p.weapon==="S"){ // 散弹枪：3 向；Lv2 五向；Lv3 七向
    p.fireCd = lv>=2 ? 18 : (lv>=1 ? 20 : 16);
    const n = lv>=2 ? 7 : (lv>=1 ? 5 : 3);
    for(let k=0;k<n;k++){
      const ang = p.aimAng + (k-(n-1)/2)*0.30;
      mk(p.face*Math.cos(ang)*10.5*boost, Math.sin(ang)*10.5*boost, dmg);
    }
    S.shoot();
  } else { // 普通步枪
    p.fireCd = 10;
    mk(p.face*mvx*10.5*boost, mvy*10.5*boost, dmg);
    S.shoot();
  }
}
// 敌人受击通用处理
function damageEnemy(e, dmg){
  e.hp -= dmg;
  if(e.hp<=0 && !e.dead){
    e.dead=true; killCount++;
    score += scoreFor(e);
    explode(e.x+e.w/2,e.y+e.h/2,"#ff9b4d",14,4); S.hitE();
  }
}
// Boss 核心击破
function killCore(){
  const core = boss.core;
  core.dead=true; boss.dead=true; score+=5000; S.bossDown();
  explode(core.x+core.w/2, core.y+core.h/2, "#ff5b3d", 40, 7); shake=30;
  // Boss 倒下即清场：全屏小兵不再刷新，也不再干扰通关演出
  enemies = [];
  ironBalls = [];
  if(boss.sniper) boss.sniper.st = "down";
  ebullets = ebullets.filter(b => Math.abs(b.x - (core.x+core.w/2)) > 320);
  if(LEVEL_IDX === 2 && !finalRun){
    // 第二关：爆炸过后进入"不对劲"的过场（接着反应堆渗液 → 第三关逃命）
    setTimeout(()=>{ if(state === "play") startAftermath(); }, 1600);
  } else if(LEVEL_IDX >= 4 && LEVEL_IDX < 8){
    // 第四~七关：击穿这一艘 → 顺着坐标去找下一艘（过场字幕 → 下一关）
    const next = LEVEL_IDX + 1, from = LEVEL_IDX;
    setTimeout(()=>{
      if(state !== "play" || LEVEL_IDX !== from) return;
      shake = 22;
      explode(core.x+core.w/2, core.y+core.h/2, "#7dfce8", 44, 8);
      explode(core.x+core.w/2, core.y+core.h/2, "#ff4f8b", 32, 6);
      startStageBreak(next);
    }, 1900);
  } else if(LEVEL_IDX === 8){
    // 第八关：轨道母巢被击穿 → 真正的结局
    setTimeout(()=>{
      if(state !== "play" || LEVEL_IDX !== 8) return;
      state = "win"; stateTimer = 0; BGM.stop(); S.clear();
      shake = 30;
      explode(core.x+core.w/2, core.y+core.h/2, "#ff7ad0", 60, 10);
      explode(core.x+core.w/2, core.y+core.h/2, "#7dfce8", 44, 8);
    }, 1900);
  } else {
    setTimeout(()=>{ state="walkin"; stateTimer=0; }, 1600); // 爆炸过后主角自动走向大门
  }
}

// 快递箱掉落：随机道具（武器 / 勋章 / 加分 / 当前武器升一级）
function dropLoot(x, y){
  const roll = Math.random();
  if(roll < 0.50){
    const types = ["S","M","L","B"];
    const t = types[Math.floor(Math.random()*types.length)];
    powerups.push({type:t, x:x-17, y:y-16, w:34, h:26, taken:false, bob:0});
    explode(x, y, "#ffd34d", 10, 3);
  } else if(roll < 0.70){
    medals.push({x:x-13, y:y-14, taken:false, bob:0});
    explode(x, y, "#ffd34d", 10, 3);
  } else if(roll < 0.88){
    score += 800;
    explode(x, y, "#7fd7ff", 14, 4);
  } else if(player.weapon !== "N" && (player.wlv[player.weapon]||0) < 2){
    player.wlv[player.weapon] = (player.wlv[player.weapon]||0) + 1;   // 弹药：当前武器升一级
    explode(x, y, "#5afff0", 16, 5);
  } else {
    score += 1200;
    explode(x, y, "#ffd34d", 12, 4);
  }
}
function hurtPlayer(fell){  const p = player;
  if(!fell && p.inv>0) return;
  lives--; S.hurt(); shake=12;
  explode(p.x+p.w/2, p.y+p.h/2, "#ff5b3d", 18, 5);
  if(lives < 0){ state = "over"; stateTimer=0; BGM.stop(); return; }
  // 第三关逃命：检查点没有意义，统一重生在液面前方
  if(finalRun){ respawnInRun(); ebullets = ebullets.filter(b => Math.abs(b.x - p.x) > 150); return; }
  // 找最近的检查点
  let cp = 0;
  for(const c of checkpoints) if(c <= p.x+50) cp = Math.max(cp,c);
  checkpoint = cp;
  // Boss 战中阵亡：解除镜头锁定，重新靠近后 Boss 再次激活
  if(boss && !boss.dead) boss.active = false;
  // 阵亡掉落临终武器（掉坑里不算，捡不回来）
  if(!fell && p.weapon !== "N"){
    drops.push({x:p.x + p.w/2 - 15, y:p.y + p.h - 30, w:30, h:26,
                type:p.weapon, lv:p.wlv[p.weapon]||0, bob:0, taken:false});
  }
  resetPlayer(checkpoint + 20);
  // 清掉玩家身边子弹，防止连续受伤
  ebullets = ebullets.filter(b => Math.abs(b.x - p.x) > 150);
}
